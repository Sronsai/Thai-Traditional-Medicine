จาม/น้ำมูก/คัด/คัน)': [t.sneeze, t.rhino, t.block, t.itch].join('/'),\n      'TNSS รวมก่อน': tPre, 'TNSS หลัง (จาม/น้ำมูก/คัด/คัน)': '', 'TNSS รวมหลัง': '', 'TNSS ลดลง (%)': '',\n      'กลุ่มอาการเด่น': this.predominant().label,\n      'คำแนะนำปรับสูตรจาก AI': this.state.advice || this.ruleAdvice().text,\n      'สูตรแนะนำครั้งถัดไป': this.formulaText(rule.next),\n      'คะแนน SUS (พท.)': f.sus, 'ความพึงพอใจผู้ป่วย (1-5)': f.satis,\n      'ต้นทุนรวม/ครั้ง (บาท)': f.cost, 'อุปกรณ์': navigator.userAgent.slice(0, 80),\n      'เวอร์ชันแอป': APP_VERSION, 'หมายเหตุ': f.note\n    };\n    this.setState({ submitMsg: 'กำลังส่ง…', submitOk: true });\n    try {\n      const r = await this.post({ action: 'session', data });\n      this.setState({ submitMsg: r.ok ? ('บันทึกลงชีต sumary แถวที่ ' + r.row + ' · ' + r.id) : ('ผิดพลาด: ' + r.error), submitOk: !!r.ok, linked: !!r.ok });\n    } catch (e) {\n      this.setState({ submitMsg: 'ส่งไม่สำเร็จ: ' + e.message, submitOk: false });\n    }\n  }\n\n  async savePatient() {\n    const f = this.state.form;\n    if (!f.consent) { this.setState({ submitMsg: 'ต้องได้รับความยินยอม PDPA ก่อน', submitOk: false }); return; }\n    this.setState({ submitMsg: 'กำลังบันทึกทะเบียน…', submitOk: true });\n    try {\n      const r = await this.post({\n        action: 'patient', data: {\n          'HN': f.hn, 'วันที่ลงทะเบียน': new Date().toISOString().slice(0, 10), 'ชื่อ-นามสกุล': f.name,\n          'อายุ (ปี)': f.age, 'เพศ': f.sex, 'ธาตุเจ้าเรือน': f.thatu, 'ยินยอม PDPA': 'ยินยอม',\n          'คลินิก/หน่วยบริการ': f.clinic\n        }\n      });\n      this.setState({ submitMsg: r.ok ? 'บันทึกทะเบียนผู้ป่วยแล้ว' : ('ผิดพลาด: ' + r.error), submitOk: !!r.ok });\n    } catch (e) {\n      this.setState({ submitMsg: 'บันทึกไม่ได้: ' + e.message, submitOk: false });\n    }\n  }\n\n  async submitTNSS() {\n    const f = this.state.form, t = this.state.tnss;\n    if (!f.hn) { this.setState({ submitMsg: 'กรอก HN ก่อนบันทึก', submitOk: false }); return; }\n    this.setState({ submitMsg: 'กำลังบันทึก…', submitOk: true });\n    try {\n      const r = await this.post({\n        action: 'tnss', data: {\n          'HN': f.hn, 'วันที่ประเมิน': new Date().toISOString().slice(0, 10),\n          'วันที่ (ลำดับ)': this.state.myWeek.length + 1,\n          'จาม': t.sneeze, 'น้ำมูกไหล': t.rhino, 'คัดจมูก': t.block, 'คันจมูก': t.itch,\n          'TNSS รวม': this.tnssTotal(), 'สุ่มยาวันนี้': f.sumaToday ? 'สุ่มแล้ว' : 'ไม่ได้สุ่ม', 'หมายเหตุ': ''\n        }\n      });\n      if (r.ok) {\n        this.setState(s => ({\n          submitMsg: 'ขอบคุณค่ะ บันทึกอาการวันนี้แล้ว', submitOk: true,\n          myWeek: [...s.myWeek.slice(-6), { v: this.tnssTotal(), label: 'วันนี้' }]\n        }));\n      } else this.setState({ submitMsg: 'ผิดพลาด: ' + r.error, submitOk: false });\n    } catch (e) {\n      this.setState({ submitMsg: 'บันทึกไม่ได้: ' + e.message, submitOk: false });\n    }\n  }\n\n  /* ───────── render values ───────── */\n  renderVals() {\n    const s = this.state, f = s.form;\n    const safe = Number(this.props.safeMinCm ?? 20);\n    const cases = s.cases;\n    const avg = (k) => cases.length ? cases.reduce((a, c) => a + (Number(c[k]) || 0), 0) / cases.length : 0;\n    const avgGain = Math.round(avg('gain'));\n    const tnssDropAvg = Math.round(avg('tnssDrop'));\n    const aeCount = cases.filter(c => c.ae && c.ae !== 'ไม่มี').length;\n\n    const tab = (name) => 'padding:9px 15px;border-radius:9px;border:none;cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;'\n      + (s.screen === name ? 'background:#F7F2E7;color:#0F3327;' : 'background:transparent;color:rgba(247,242,231,.8);');\n\n    const maxBar = 160;\n    const patencyBars = cases.slice(0, 14).map(c => ({\n      preH: Math.round(c.pre / 100 * maxBar) + 'px',\n      postH: Math.round(c.post / 100 * maxBar) + 'px',\n      tipPre: 'ก่อน ' + c.pre + '%', tipPost: 'หลัง ' + c.post + '%'\n    }));\n\n    const t0 = Math.round(avg('tnssPre')) || 9;\n    const t1 = Math.round(avg('tnssPost')) || 4;\n    const series = Array.from({ length: 14 }, (_, i) => t0 + (t1 - t0) * Math.pow(i / 13, 0.75));\n    const pts = series.map((v, i) => [Math.round(i / 13 * 314) + 3, Math.round(160 - v / 12 * 150)]);\n    const tnssDots = pts.map(p => ({ x: p[0], y: p[1] }));\n\n    const predomLabels = ['คัดจมูกเด่น', 'น้ำมูกเด่น', 'จามเด่น', 'คันจมูกเด่น'];\n    const predomColors = ['#1E6B54', '#C4772C', '#2E8C6E', '#8A7F66'];\n    const predomRows = predomLabels.map((label, i) => {\n      const n = cases.filter(c => c.predom === label).length;\n      return { label, n, color: predomColors[i], w: Math.round(n / Math.max(1, cases.length) * 100) + '%' };\n    });\n\n    const stepLabels = ['คัดกรอง', 'วัดก่อนสุ่ม', 'ตำรับยา', 'หัตถการ + AR', 'สรุป + ส่งชีต'];\n    const steps = stepLabels.map((label, i) => {\n      const n = i + 1, on = s.step === n, done = s.step > n;\n      return {\n        n, label, go: () => this.setState({ step: n }),\n        style: 'display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;border:1px solid '\n          + (on ? '#0F3327' : '#E4DCC8') + ';background:' + (on ? '#0F3327' : '#FFFDF7') + ';color:' + (on ? '#F7F2E7' : done ? '#1E6B54' : '#8A7F66') + ';',\n        numStyle: 'width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:'\n          + (on ? 'rgba(247,242,231,.2)' : done ? '#E6F0EA' : '#F2EDE1') + ';'\n      };\n    });\n\n    const herbs = HERBS.map(h => ({ th: h.th, sci: h.sci, v: s.herb[h.key], on: e => this.setHerb(h.key, e.target.value) }));\n    const herbTotal = this.herbTotal();\n    const ok100 = Math.abs(herbTotal - 100) < 0.5;\n\n    const wave = s.wave.length ? s.wave : Array.from({ length: 48 }, () => 0.04);\n    const waveBars = wave.map(v => ({\n      h: Math.max(3, Math.round(v * 92)) + 'px',\n      c: v > 0.55 ? '#C4772C' : v > 0.22 ? '#3FA37F' : 'rgba(247,242,231,.32)'\n    }));\n\n    const recording = !!s.rec;\n    const dist = s.dist;\n    const near = dist !== null && dist < safe;\n    const warnZone = dist !== null && dist < safe + 5;\n    const target = this.targetSec();\n    const mm = String(Math.floor(s.elapsed / 60)).padStart(2, '0');\n    const ss = String(s.elapsed % 60).padStart(2, '0');\n\n    const gain = s.pre && s.post ? s.post.index - s.pre.index : null;\n    const relGain = s.pre && s.post && s.pre.index ? Math.round((s.post.index - s.pre.index) / s.pre.index * 100) : null;\n\n    const tnssItems = TNSS_KEYS.map(k => ({\n      label: k.label, v: s.tnss[k.key], word: WORDS[s.tnss[k.key]] || '',\n      on: e => { const v = Number(e.target.value); this.setState(st => ({ tnss: { ...st.tnss, [k.key]: v } })); }\n    }));\n    const tt = this.tnssTotal();\n\n    const wkMax = Math.max(12, ...s.myWeek.map(d => d.v));\n    const myWeek = s.myWeek.map(d => ({\n      label: d.label, h: Math.max(4, Math.round(d.v / wkMax * 66)) + 'px',\n      c: d.v >= 8 ? '#C4772C' : d.v >= 5 ? '#3FA37F' : '#1E6B54'\n    }));\n\n    const sel = s.sel;\n    const selRows = sel ? [\n      { k: 'ผลต่าง Patency', v: '+' + sel.gain + '%' },\n      { k: 'TNSS ก่อน → หลัง', v: sel.tnssPre + ' → ' + sel.tnssPost + ' (' + sel.tnssDrop + '%)' },\n      { k: 'กลุ่มอาการเด่น', v: sel.predom },\n      { k: 'ระยะใกล้สุด', v: sel.minDist + ' ซม.' },\n      { k: 'แจ้งเตือนระยะ', v: sel.alerts + ' ครั้ง' },\n      { k: 'ทำครบเวลา', v: sel.adherence + '%' },\n      { k: 'เหตุการณ์ไม่พึงประสงค์', v: sel.ae },\n      { k: 'ครั้งที่', v: String(sel.visit) }\n    ] : [];\n\n    return {\n      goDash: () => this.setState({ screen: 'dash' }),\n      goTp: () => this.setState({ screen: 'tp' }),\n      goPatient: () => this.setState({ screen: 'patient' }),\n      goSet: () => this.setState({ screen: 'set' }),\n      tabDash: tab('dash'), tabTp: tab('tp'), tabPatient: tab('patient'), tabSet: tab('set'),\n      isDash: s.screen === 'dash', isTp: s.screen === 'tp', isPatient: s.screen === 'patient', isSet: s.screen === 'set',\n      linkDot: s.linked ? '#8FE3B8' : '#E0B36A',\n      linkText: s.linked ? (s.fromSheet ? 'ข้อมูลจากชีต sumary' : 'เชื่อมชีตแล้ว') : 'เคสตัวอย่าง 30 เคส',\n\n      kpis: [\n        { label: 'จำนวนเคส', value: String(cases.length), note: s.fromSheet ? 'จากชีต sumary' : 'ชุดตัวอย่างสำหรับนำเสนอ', color: '#0F3327' },\n        { label: 'Patency เพิ่มเฉลี่ย', value: '+' + avgGain + '%', note: 'เป้าหมาย > 25%', color: avgGain >= 25 ? '#1E6B54' : '#C4772C' },\n        { label: 'TNSS ลดลงเฉลี่ย', value: tnssDropAvg + '%', note: 'เป้าหมาย > 40% ใน 2 สัปดาห์', color: tnssDropAvg >= 40 ? '#1E6B54' : '#C4772C' },\n        { label: 'เหตุการณ์ไม่พึงประสงค์', value: aeCount + ' ราย', note: 'เป้าหมาย 0% ระคายเคือง/ลวก', color: aeCount ? '#B4462F' : '#1E6B54' },\n        { label: 'ทำครบเวลาเฉลี่ย', value: Math.round(avg('adherence')) + '%', note: 'เป้าหมาย > 85%', color: '#0F3327' }\n      ],\n      patencyBars, avgGain,\n      tnssPoints: pts.map(p => p.join(',')).join(' '),\n      tnssArea: '3,160 ' + pts.map(p => p.join(',')).join(' ') + ' 317,160',\n      tnssDots, tnssStart: t0, tnssEnd: t1, tnssDrop: t0 ? Math.round((1 - t1 / t0) * 100) : 0,\n      predomRows, caseCount: cases.length,\n      caseRows: cases.map(c => ({ ...c, aeColor: c.ae === 'ไม่มี' ? '#6B7A6F' : '#B4462F', open: () => this.setState({ sel: c }) })),\n      sel, selRows,\n      closeSel: () => this.setState({ sel: null }),\n      stop: e => e.stopPropagation(),\n\n      steps, step1: s.step === 1, step2: s.step === 2, step3: s.step === 3, step4: s.step === 4, step5: s.step === 5,\n      next: () => this.setState({ step: Math.min(5, s.step + 1) }),\n      back: () => this.setState({ step: Math.max(1, s.step - 1) }),\n      f, h: Object.fromEntries(['hn', 'name', 'age', 'sex', 'thatu', 'icd', 'clinic', 'provider', 'visit', 'consent', 'weight', 'temp', 'cost', 'proc', 'ae', 'satis', 'sus', 'note', 'sumaToday'].map(k => [k, this.h(k)])),\n      qrHint: f.hn ? 'ผู้ป่วยเปิดแอปด้วย HN ' + f.hn + ' ได้ทันที' : 'ผู้ป่วยเข้าได้ทั้งสแกน QR และกรอก HN',\n      savePatient: () => this.savePatient(),\n\n      recPre: () => this.record('pre'),\n      recPost: () => this.record('post'),\n      recLabel: recording ? 'กำลังอัด ' + Math.ceil(10 - s.recSec) + ' วิ' : 'เริ่มอัดเสียง 10 วินาที',\n      recBtn: 'padding:12px 18px;border-radius:12px;border:none;font-weight:700;font-family:inherit;cursor:' + (recording ? 'default' : 'pointer') + ';background:' + (recording ? '#C4772C' : '#F7F2E7') + ';color:#0F3327;',\n      recStatus: s.recErr ? s.recErr : recording ? 'หายใจเข้า–ออกลึกทางจมูก' : (s.pre || s.post) ? 'วิเคราะห์เสร็จแล้ว' : 'กดเริ่มเมื่อผู้ป่วยพร้อม',\n      preIndex: s.pre ? s.pre.index : '—',\n      postIndex: s.post ? s.post.index : '—',\n      preMetrics: s.pre ? [\n        { k: 'พลังงานเสียงรวม (RMS ×10⁻³)', v: String(s.pre.rms) },\n        { k: 'Spectral Centroid', v: s.pre.centroid + ' Hz' },\n        { k: 'พลังงานย่านปั่นป่วน', v: s.pre.turb + '%' }\n      ] : [{ k: 'ยังไม่มีข้อมูล', v: '—' }],\n      gainText: gain === null ? '—' : (gain >= 0 ? '+' : '') + gain + '%',\n      resultLine: gain === null ? 'อัดเสียงหลังสุ่มยาเพื่อเทียบผล'\n        : 'หลังสุ่มยาทางเดินหายใจโล่งขึ้น ' + (relGain >= 0 ? relGain : 0) + '% เทียบกับก่อนทำหัตถการ',\n\n      herbs, herbTotal,\n      totalBg: ok100 ? '#E6F0EA' : '#FDF4E6',\n      totalMsg: ok100 ? 'สัดส่วนถูกต้อง พร้อมจ่ายยา' : 'ต้องรวมได้ 100% ก่อนส่งข้อมูลเข้าชีต',\n      normalize: () => this.normalizeHerbs(),\n\n      safeMin: safe,\n      videoRef: el => { this._video = el; if (el && this._stream) el.srcObject = this._stream; },\n      toggleCam: () => this.toggleCam(),\n      camLabel: s.camOn ? 'ปิดกล้อง' : 'เปิดกล้อง AR',\n      camStatus: s.camOn ? (s.manualMode ? 'โหมดสำรอง (ไม่มีตัวตรวจจับใบหน้า)' : 'ตรวจจับใบหน้า · ' + (this._fdKind || 'ทำงาน')) : 'กล้องปิดอยู่',\n      camErr: s.camErr, detMsg: s.detMsg,\n      inIframe: (typeof window !== 'undefined') && window.self !== window.top,\n      openTop: () => { try { window.open(window.location.href, '_blank', 'noopener'); } catch (e) {} },\n      distText: dist === null ? 'ยังไม่วัด' : Math.round(dist) + ' ซม.' + (near ? ' · ถอยห่าง!' : ''),\n      ringColor: near ? '#B4462F' : warnZone ? '#C4772C' : 'rgba(143,227,184,.55)',\n      ringW: near ? '5px' : '3px',\n      minDist: s.minDist === null ? '—' : Math.round(s.minDist) + ' ซม.',\n      alerts: s.alerts, alertColor: s.alerts ? '#B4462F' : '#1E6B54',\n      manualMode: s.manualMode, manualDist: s.manualDist,\n      onManualDist: e => { const v = Number(e.target.value); this.setState({ manualDist: v }); this.registerDist(v); },\n      clock: mm + ':' + ss,\n      targetText: this.props.demoTimer ? '01:00 (โหมดสาธิต)' : String(Math.round(target / 60)) + ' นาที',\n      timerPct: Math.round(s.elapsed / target * 100) + '%',\n      timerLabel: s.running ? 'หยุดพัก' : s.elapsed ? 'ทำต่อ' : 'เริ่มจับเวลาสุ่มยา',\n      coach: s.elapsed >= target ? 'ครบเวลาแล้ว — เช็ดหน้าให้แห้งแล้วอัดเสียงหลังสุ่มยา'\n        : s.running ? 'สูดลมหายใจเข้าทางจมูกลึกๆ นับ 1–4 แล้วผ่อนออกทางปากช้าๆ'\n        : 'นั่งตัวตรง ห่างจากชามสุ่มยาประมาณ 25–30 ซม. แล้วกดเริ่ม',\n      startSuma: () => this.startSuma(),\n\n      advice: s.advice || 'กดปุ่มเพื่อให้ระบบวิเคราะห์อาการเด่นและเสนอสัดส่วนตำรับยาครั้งถัดไป',\n      aiBtnLabel: s.aiBusy ? 'กำลังวิเคราะห์…' : 'วิเคราะห์คำแนะนำ',\n      askAI: () => this.askAI(),\n      nextFormula: this._next ? this.formulaText(this._next) : this.formulaText(),\n      submitSession: () => this.submitSession(),\n      submitMsg: s.submitMsg, submitColor: s.submitOk ? '#1E6B54' : '#B4462F',\n\n      tnssItems, tnssTotal: tt, predomLabel: this.predominant().label,\n      tnssWord: tt >= 9 ? 'อาการมาก ควรแจ้ง พท. ในนัดถัดไป' : tt >= 5 ? 'อาการปานกลาง สุ่มยาต่อเนื่องนะคะ' : 'อาการดีขึ้นมาก เยี่ยมเลยค่ะ',\n      submitTNSS: () => this.submitTNSS(),\n      scanQR: () => this.setState({ submitMsg: 'ในเวอร์ชันจริงจะเปิดกล้องอ่าน QR จากหน้า พท. — ตอนนี้กรอก HN ได้เลย', submitOk: true }),\n      myWeek,\n\n      url: s.url, key: s.key,\n      onUrl: e => this.setState({ url: e.target.value.trim() }, () => this.saveCfg()),\n      onKey: e => this.setState({ key: e.target.value.trim() }, () => this.saveCfg()),\n      testLink: () => this.testLink(),\n      loadSheet: () => this.loadSheet(),\n      sheetDocs: [\n        { name: 'sumary', cols: '45 คอลัมน์', desc: '1 แถว = 1 ครั้งการสุ่มยา · ข้อมูลผู้ป่วย, ตำรับยา 5 ชนิด, Patency ก่อน–หลัง, ลิงก์ไฟล์เสียง, ความปลอดภัย AR, TNSS, คำแนะนำ AI, ต้นทุน' },\n        { name: 'tnss_daily', cols: '12 คอลัมน์', desc: 'คะแนน TNSS รายวันจากผู้ป่วย (จาม/น้ำมูก/คัด/คัน + รวม) ใช้คำนวณ Trend 7–14 วัน' },\n        { name: 'patients', cols: '10 คอลัมน์', desc: 'ทะเบียนผู้ป่วยแยก ลงครั้งเดียว ใช้ HN เป็นคีย์เชื่อมกับ sumary' },\n        { name: 'lookup', cols: '3 คอลัมน์', desc: 'ค่าตั้งต้นที่แก้ได้เอง: สูตรยามาตรฐาน, รายชื่อ พท., คลินิก, ICD-10, ต้นทุน' }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
