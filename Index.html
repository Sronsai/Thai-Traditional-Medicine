document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

i', sans-serif; font-size: 20px; font-weight: 700;\">TNSS ก่อนทำหัตถการ<\u002Fh2>\n            <p style=\"margin: 0 0 18px; font-size: 14px; color: #8A7F66;\">ให้คะแนนอาการทั้ง 4 ด้าน 0–3 คะแนน · รวมสูงสุด 12 คะแนน<\u002Fp>\n            <div data-r=\"tnss-grid\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;\">\n              <sc-for list=\"{{ tnssItems }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div style=\"{{ t.card }}\">\n                  <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 9px;\">\n                    <span style=\"{{ t.dot }}\"><\u002Fspan>\n                    <span style=\"font-weight: 600; font-size: 16px; color: {{ t.color }};\">{{ t.label }}<\u002Fspan>\n                    <span style=\"margin-left: auto; {{ t.chip }}\">{{ t.word }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <input type=\"range\" min=\"0\" max=\"3\" step=\"1\" value=\"{{ t.v }}\" sc-camel-on-input=\"{{ t.on }}\" style=\"{{ t.range }}\">\n                  <div style=\"display: flex; justify-content: space-between; font-size: 11px; color: #6F6449; margin-top: 3px;\">\n                    <span>0 ไม่มี<\u002Fspan><span>1 เล็กน้อย<\u002Fspan><span>2 ปานกลาง-มาก<\u002Fspan><span>3 รุนแรงมาก<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top: 18px; padding: 16px 18px; border-radius: 15px; background: linear-gradient(150deg, #E6F0EA, #F2EDE1); display: flex; flex-wrap: wrap; align-items: center; gap: 14px;\">\n              <div>\n                <div style=\"font-size: 12px; color: #6B7A6F;\">คะแนนรวมก่อนทำหัตถการ<\u002Fdiv>\n                <div style=\"font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 34px; font-weight: 700; line-height: 1; color: #16543F;\">{{ tnssTotal }}<span style=\"font-size: 16px; color: #6B7A6F;\"> / 12<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"padding: 5px 13px; border-radius: 999px; background: #FFFDF7; font-size: 13px; font-weight: 600; color: {{ tnssBandColor }};\">{{ tnssBandLabel }}<\u002Fspan>\n              <span style=\"margin-left: auto; font-size: 13px; color: #16543F;\">อาการเด่น: {{ predomLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 18px; padding: 24px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E0D5B8;\">\n            <h2 style=\"margin: 0 0 4px; font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 20px; font-weight: 700;\">สมุฏฐานการเกิดโรค<\u002Fh2>\n            <p style=\"margin: 0 0 18px; font-size: 14px; color: #8A7F66;\">วิเคราะห์ตามหลักเวชกรรมไทย · ระบบตั้งค่าเริ่มต้นตามเดือนและอาการเด่น แก้ไขได้<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px;\">\n              <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">อุตุสมุฏฐาน (ฤดู)\n                <sc-raw-select value=\"{{ utuValue }}\" sc-camel-on-change=\"{{ h.utu }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n                  <sc-for list=\"{{ utuOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <span style=\"font-size: 12px; color: #8A7250;\">{{ utuAutoNote }}<\u002Fspan>\n              <\u002Flabel>\n              <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">กาลสมุฏฐาน (ช่วงเวลา)\n                <sc-raw-select value=\"{{ f.kala }}\" sc-camel-on-change=\"{{ h.kala }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n                  <sc-for list=\"{{ kalaOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n                    <option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Flabel>\n              <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">ตรีธาตุที่กระทำ\n                <sc-raw-select value=\"{{ triValue }}\" sc-camel-on-change=\"{{ h.tri }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n                  <sc-for list=\"{{ triOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <span style=\"font-size: 12px; color: #8A7250;\">{{ triAutoNote }}<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"margin-top: 16px; display: grid; gap: 9px; padding: 15px 17px; border-radius: 14px; background: #FDF4E6; border: 1px solid #EBD9BC; font-size: 14px; color: #4A3A22; line-height: 1.65;\">\n              <div>{{ thatuNote }}<\u002Fdiv>\n              <div>{{ triNote }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 18px; padding: 16px; border-radius: 14px; background: #F4EEDE; border: 1px solid #E0D5B8;\">\n            <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 12px;\">\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"#1E6B54\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                <path d=\"M12 3 4 6v6c0 4.4 3.4 8.3 8 9 4.6-.7 8-4.6 8-9V6l-8-3Z\"><\u002Fpath>\n                <path d=\"m9 12 2 2 4-4\"><\u002Fpath>\n              <\u002Fsvg>\n              <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 1.4px; color: #1E6B54;\">e-CONSENT · PDPA {{ consentVer }}<\u002Fspan>\n            <\u002Fdiv>\n            <label style=\"display: flex; gap: 11px; align-items: flex-start; cursor: pointer; padding-bottom: 12px; border-bottom: 1px dashed #DCCDA8;\">\n              <input type=\"checkbox\" checked=\"{{ f.consent }}\" sc-camel-on-change=\"{{ h.consent }}\" style=\"width: 20px; height: 20px; margin-top: 2px; accent-color: #1E6B54;\">\n              <span style=\"font-size: 14px; line-height: 1.6;\"><strong>ยินยอมเพื่อการรักษา<\u002Fstrong> (จำเป็น) — ให้เก็บข้อมูลสุขภาพ เสียงลมหายใจ และผลประเมิน เพื่อใช้ในการวินิจฉัยและติดตามผลการรักษา<br><span style=\"color: #8A7250; font-size: 13px;\">ระบบจะไม่ส่งข้อมูลเข้า Google Sheet หากไม่ได้ติ๊กช่องนี้<\u002Fspan><\u002Fspan>\n            <\u002Flabel>\n            <label style=\"display: flex; gap: 11px; align-items: flex-start; cursor: pointer; padding-top: 12px;\">\n              <input type=\"checkbox\" checked=\"{{ f.research }}\" sc-camel-on-change=\"{{ h.research }}\" style=\"width: 20px; height: 20px; margin-top: 2px; accent-color: #B08B3E;\">\n              <span style=\"font-size: 14px; line-height: 1.6;\"><strong>ยินยอมเพื่องานวิจัย R2R<\u002Fstrong> (เลือกได้) — ให้นำข้อมูลที่ไม่ระบุตัวตนไปวิเคราะห์เผยแพร่เป็นงานวิจัย ตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล<br><span style=\"color: #8A7250; font-size: 13px;\">ไม่ยินยอมได้ — ไม่กระทบสิทธิการรักษา และเคสจะไม่ถูกนับในชุดข้อมูลวิจัย<\u002Fspan><\u002Fspan>\n            <\u002Flabel>\n            <div style=\"margin-top: 14px; padding-top: 14px; border-top: 1px dashed #DCCDA8;\">\n              <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 8px;\">\n                <span style=\"font-size: 13px; font-weight: 600; color: #4E5A51;\">ลายเซ็นผู้ป่วย<\u002Fspan>\n                <span style=\"font-size: 12px; color: #8A7250;\">ไม่บังคับ · เซ็นด้วยนิ้วหรือเมาส์<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ sigClear }}\" style=\"margin-left: auto; padding: 7px 13px; border-radius: 9px; border: 1px solid #C9C0AB; background: #FFF; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer;\">ล้างลายเซ็น<\u002Fbutton>\n              <\u002Fdiv>\n              <canvas ref=\"{{ sigRef }}\" width=\"640\" height=\"180\" style=\"width: 100%; max-width: 100%; height: 150px; border-radius: 12px; border: 1px solid #D6CDB8; background: #FFF; touch-action: none; cursor: crosshair;\"><\u002Fcanvas>\n              <div style=\"margin-top: 7px; font-size: 12px; color: #6F5A38;\">{{ consentStamp }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 18px; padding: 16px 18px; border-radius: 14px; background: #EFE7D3; border: 1px solid #E0D5B8; text-align: center;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ saveIntake }}\" style=\"padding: 13px 26px; border-radius: 12px; border: none; background: #1E6B54; color: #F7F2E7; font-weight: 700; font-family: inherit; font-size: 15px; cursor: pointer;\">บันทึกทะเบียนผู้ป่วย + RCQ-36<\u002Fbutton>\n            <div style=\"margin-top: 9px; font-size: 13px; color: #6F5A38;\">{{ intakeHint }}<\u002Fdiv>\n            <div style=\"margin-top: 6px; font-size: 13px; color: {{ intakeColor }};\">{{ intakeMsg }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div data-r=\"tp-actions\" style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #EFE8D6; align-items: center; justify-content: center;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"padding: 12px 22px; border-radius: 12px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; font-family: inherit; cursor: pointer;\">ย้อนกลับ<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"padding: 12px 24px; border-radius: 12px; border: none; background: #0F3327; color: #F7F2E7; font-weight: 700; font-family: inherit; cursor: pointer;\">ถัดไป<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ขั้นที่ 2 วัดก่อนสุ่ม -->\n      <sc-if value=\"{{ step2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <section data-r=\"card\" style=\"padding: 24px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E0D5B8;\">\n          <h2 style=\"margin: 0 0 4px; font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 20px; font-weight: 700;\">Pre-Suma Test · อัดเสียงลมหายใจ<\u002Fh2>\n          <p style=\"margin: 0 0 18px; font-size: 14px; color: #8A7F66;\">ให้ผู้ป่วยหายใจเข้า–ออกลึกทางจมูก 10 วินาที ระบบวิเคราะห์ดัชนีความโล่งของโพรงจมูก<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;\">\n            <div style=\"padding: 20px; border-radius: 16px; background: #0F3327; color: #F7F2E7;\">\n              <div style=\"font-size: 13px; opacity: .78;\">Nasal Patency ก่อนสุมยา<\u002Fdiv>\n              <div data-r=\"patency-big\" style=\"font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 52px; font-weight: 700; line-height: 1.1;\">{{ preIndex }}<span style=\"font-size: 20px; opacity: .7;\">%<\u002Fspan><\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ recPre }}\" style=\"{{ recBtn }}\">{{ recLabel }}<\u002Fbutton>\n              <div style=\"margin-top: 10px; font-size: 13px; opacity: .8;\">{{ recStatus }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 20px; border-radius: 16px; background: #FFF; border: 1px solid #E0D5B8; display: grid; gap: 11px; align-content: start;\">\n              <div style=\"font-size: 13px; font-weight: 600; color: #4E5A51;\">ค่าที่วัดได้จากสัญญาณเสียง<\u002Fdiv>\n              <sc-for list=\"{{ preMetrics }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <div style=\"display: flex; gap: 12px; font-size: 14px; padding-bottom: 8px; border-bottom: 1px dashed #DCCDA8;\">\n                  <span style=\"color: #8A7F66;\">{{ m.k }}<\u002Fspan>\n                  <span style=\"margin-left: auto; font-weight: 600;\">{{ m.v }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div data-r=\"tp-actions\" style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #EFE8D6; align-items: center; justify-content: center;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"padding: 12px 22px; border-radius: 12px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; font-family: inherit; cursor: pointer;\">ย้อนกลับ<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"padding: 12px 24px; border-radius: 12px; border: none; background: #0F3327; color: #F7F2E7; font-weight: 700; font-family: inherit; cursor: pointer;\">ถัดไป<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ขั้นที่ 3 ตำรับยา -->\n      <sc-if value=\"{{ step3 }}\" hint-placeholder-val=\"{{ false }}\">\n        <section data-r=\"card\" style=\"padding: 24px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E0D5B8;\">\n          <h2 style=\"margin: 0 0 4px; font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 20px; font-weight: 700;\">ตำรับยาสุ่ม 5 ชนิด<\u002Fh2>\n          <p style=\"margin: 0 0 18px; font-size: 14px; color: #8A7F66;\">ปรับสัดส่วนสมุนไพรให้รวมได้ 100% ตามอาการเด่นและธาตุเจ้าเรือน<\u002Fp>\n          <div style=\"display: grid; gap: 14px;\">\n            <sc-for list=\"{{ herbs }}\" as=\"hb\" hint-placeholder-count=\"5\">\n              <div data-r=\"herb-row\" style=\"display: grid; grid-template-columns: minmax(0, 180px) minmax(0, 1fr) auto; gap: 14px; align-items: center;\">\n                <div>\n                  <div style=\"font-size: 15px; font-weight: 600;\">{{ hb.th }}<\u002Fdiv>\n                  <div style=\"font-size: 11px; color: #8A7F66; font-style: italic;\">{{ hb.sci }}<\u002Fdiv>\n                <\u002Fdiv>\n                <input type=\"range\" min=\"0\" max=\"60\" step=\"5\" value=\"{{ hb.v }}\" sc-camel-on-input=\"{{ hb.on }}\" style=\"width: 100%; accent-color: #1E6B54;\">\n                <span style=\"font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 52px; text-align: right;\">{{ hb.v }}%<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 15px; background: {{ totalBg }}; border: 1px solid #E0D5B8;\">\n            <div style=\"font-size: 15px; font-weight: 700;\">รวม {{ herbTotal }}%<\u002Fdiv>\n            <span style=\"font-size: 13px; color: #6F5A38;\">{{ totalMsg }}<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ normalize }}\" style=\"margin-left: auto; padding: 10px 16px; border-radius: 11px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; font-family: inherit; cursor: pointer;\">ปรับให้ครบ 100%<\u002Fbutton>\n          <\u002Fdiv>\n          <div data-r=\"tp-actions\" style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #EFE8D6; align-items: center; justify-content: center;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"padding: 12px 22px; border-radius: 12px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; font-family: inherit; cursor: pointer;\">ย้อนกลับ<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"padding: 12px 24px; border-radius: 12px; border: none; background: #0F3327; color: #F7F2E7; font-weight: 700; font-family: inherit; cursor: pointer;\">ถัดไป<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ขั้นที่ 4 หัตถการ + AR -->\n      <sc-if value=\"{{ step4 }}\" hint-placeholder-val=\"{{ false }}\">\n        <section data-r=\"card\" style=\"padding: 24px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E0D5B8;\">\n          <h2 style=\"margin: 0 0 4px; font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 20px; font-weight: 700;\">หัตถการสุมยา · ผู้ช่วยเฝ้าระยะปลอดภัย<\u002Fh2>\n          <p style=\"margin: 0 0 18px; font-size: 14px; color: #8A7F66;\">รักษาระยะห่างจากชามสุมยาอย่างน้อย {{ safeMin }} ซม. ระบบเตือนเมื่อเข้าใกล้เกินไป<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;\">\n            <div style=\"padding: 16px; border-radius: 16px; background: #0F3327; color: #F7F2E7;\">\n              <div style=\"position: relative; border-radius: 13px; overflow: hidden; background: #08201A; aspect-ratio: 4 / 3;\">\n                <video ref=\"{{ videoRef }}\" autoplay=\"\" muted=\"\" playsinline=\"\" style=\"width: 100%; height: 100%; object-fit: cover;\"><\u002Fvideo>\n                <div style=\"position: absolute; inset: 14%; border-radius: 50%; border: {{ ringW }} solid {{ ringColor }}; pointer-events: none;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px;\">\n                <button type=\"button\" sc-camel-on-click=\"{{ toggleCam }}\" style=\"padding: 11px 17px; border-radius: 11px; border: none; background: #F7F2E7; color: #0F3327; font-weight: 700; font-family: inherit; cursor: pointer;\">{{ camLabel }}<\u002Fbutton>\n                <span style=\"font-size: 13px; opacity: .82;\">{{ camStatus }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top: 8px; font-size: 13px; color: #F0C38A;\">{{ camErr }}<\u002Fdiv>\n              <sc-if value=\"{{ manualMode }}\" hint-placeholder-val=\"{{ false }}\">\n                <label style=\"display: grid; gap: 6px; margin-top: 12px; font-size: 13px;\">ปรับระยะด้วยมือ (ซม.)\n                  <input type=\"range\" min=\"10\" max=\"60\" step=\"1\" value=\"{{ manualDist }}\" sc-camel-on-input=\"{{ onManualDist }}\" style=\"width: 100%; accent-color: #8FE3B8;\">\n                <\u002Flabel>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display: grid; gap: 14px; align-content: start;\">\n              <div style=\"padding: 18px; border-radius: 16px; background: #FFF; border: 1px solid #E0D5B8;\">\n                <div style=\"font-size: 13px; color: #6B7A6F;\">ระยะห่างปัจจุบัน<\u002Fdiv>\n                <div style=\"font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 32px; font-weight: 700; color: #16543F;\">{{ distText }}<\u002Fdiv>\n                <div style=\"margin-top: 8px; font-size: 13px; color: #4E5A51;\">ระยะใกล้สุดที่วัดได้ {{ minDist }} · เตือนแล้ว <span style=\"font-weight: 700; color: {{ alertColor }};\">{{ alerts }}<\u002Fspan> ครั้ง<\u002Fdiv>\n                <div style=\"margin-top: 6px; font-size: 13px; color: #8A7250;\">{{ detMsg }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding: 18px; border-radius: 16px; background: linear-gradient(150deg, #E6F0EA, #F2EDE1);\">\n                <div style=\"font-size: 13px; color: #6B7A6F;\">เวลาสุมยา · เป้าหมาย {{ targetText }}<\u002Fdiv>\n                <div style=\"font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.1; color: #16543F;\">{{ clock }}<\u002Fdiv>\n                <span style=\"display: block; height: 9px; border-radius: 999px; background: #FFFDF7; overflow: hidden; margin: 10px 0;\">\n                  <span style=\"display: block; height: 100%; width: {{ timerPct }}; background: #1E6B54; border-radius: 999px;\"><\u002Fspan>\n                <\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ startSuma }}\" style=\"padding: 11px 18px; border-radius: 11px; border: none; background: #0F3327; color: #F7F2E7; font-weight: 700; font-family: inherit; cursor: pointer;\">{{ timerLabel }}<\u002Fbutton>\n                <div style=\"margin-top: 10px; font-size: 13px; color: #16543F; line-height: 1.6;\">{{ coach }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div data-r=\"tp-actions\" style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #EFE8D6; align-items: center; justify-content: center;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"padding: 12px 22px; border-radius: 12px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; font-family: inherit; cursor: pointer;\">ย้อนกลับ<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"padding: 12px 24px; border-radius: 12px; border: none; background: #0F3327; color: #F7F2E7; font-weight: 700; font-family: inherit; cursor: pointer;\">ถัดไป<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ขั้นที่ 5 สรุป -->\n      <sc-if value=\"{{ step5 }}\" hint-placeholder-val=\"{{ false }}\">\n        <section data-r=\"card\" style=\"padding: 24px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E0D5B8;\">\n          <h2 style=\"margin: 0 0 4px; font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 20px; font-weight: 700;\">Post-Suma Test &amp; สรุปผลลง OPD Card<\u002Fh2>\n          <p style=\"margin: 0 0 18px; font-size: 14px; color: #8A7F66;\">อัดเสียงหลังสุมยา บันทึกผลการรักษา แล้วส่งข้อมูลทั้งครั้งเข้าชีต sumary<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;\">\n            <div style=\"padding: 20px; border-radius: 16px; background: #0F3327; color: #F7F2E7;\">\n              <div style=\"font-size: 13px; opacity: .78;\">Nasal Patency หลังสุมยา<\u002Fdiv>\n              <div data-r=\"patency-big\" style=\"font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 52px; font-weight: 700; line-height: 1.1;\">{{ postIndex }}<span style=\"font-size: 20px; opacity: .7;\">%<\u002Fspan><\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ recPost }}\" style=\"{{ recBtn }}\">{{ recLabel }}<\u002Fbutton>\n              <div style=\"margin-top: 10px; font-size: 13px; opacity: .8;\">{{ recStatus }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 20px; border-radius: 16px; background: linear-gradient(150deg, #E6F0EA, #F2EDE1); display: grid; gap: 8px; align-content: start;\">\n              <div style=\"font-size: 13px; color: #6B7A6F;\">ผลต่างก่อน–หลัง<\u002Fdiv>\n              <div style=\"font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 40px; font-weight: 700; line-height: 1; color: #16543F;\">{{ gainText }}<\u002Fdiv>\n              <div style=\"font-size: 14px; color: #16543F; line-height: 1.6;\">{{ resultLine }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px;\">\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">น้ำหนักสมุนไพร (กรัม)\n              <input type=\"number\" value=\"{{ f.weight }}\" sc-camel-on-input=\"{{ h.weight }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">อุณหภูมิไอน้ำ (°C)\n              <input type=\"number\" value=\"{{ f.temp }}\" sc-camel-on-input=\"{{ h.temp }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">ต้นทุนต่อครั้ง (บาท)\n              <input type=\"number\" value=\"{{ f.cost }}\" sc-camel-on-input=\"{{ h.cost }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">รหัสหัตถการ\n              <input value=\"{{ f.proc }}\" sc-camel-on-input=\"{{ h.proc }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">เหตุการณ์ไม่พึงประสงค์\n              <input value=\"{{ f.ae }}\" sc-camel-on-input=\"{{ h.ae }}\" placeholder=\"ไม่มี\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">ความพึงพอใจ (1–5)\n              <input type=\"number\" min=\"1\" max=\"5\" value=\"{{ f.satis }}\" sc-camel-on-input=\"{{ h.satis }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">SUS Score\n              <input type=\"number\" value=\"{{ f.sus }}\" sc-camel-on-input=\"{{ h.sus }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">บันทึกเพิ่มเติม\n              <input value=\"{{ f.note }}\" sc-camel-on-input=\"{{ h.note }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 18px; padding: 18px; border-radius: 16px; background: #FDF4E6; border: 1px solid #EBD9BC;\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 10px;\">\n              <div style=\"font-size: 12px; font-weight: 700; color: #9A5A16; letter-spacing: 1.2px;\">คำแนะนำจาก AI<\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ askAI }}\" style=\"margin-left: auto; padding: 10px 16px; border-radius: 11px; border: 1px solid #D9C89E; background: #FFF; font-weight: 600; font-family: inherit; cursor: pointer;\">{{ aiBtnLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size: 14px; line-height: 1.65; color: #4A3A22; white-space: pre-line;\">{{ advice }}<\u002Fdiv>\n            <div style=\"margin-top: 10px; font-size: 13px; color: #6F5A38;\">ตำรับครั้งถัดไป: {{ nextFormula }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div data-r=\"tp-actions\" style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #EFE8D6; align-items: center; justify-content: center;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"padding: 12px 22px; border-radius: 12px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; font-family: inherit; cursor: pointer;\">ย้อนกลับ<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ submitSession }}\" style=\"padding: 13px 24px; border-radius: 12px; border: none; background: #1E6B54; color: #F7F2E7; font-weight: 700; font-family: inherit; cursor: pointer;\">ส่งเข้า Google Sheet<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"margin-top: 10px; text-align: center; font-size: 13px; color: {{ sessionColor }};\">{{ sessionMsg }}<\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ─────────── โหมดผู้ป่วย ─────────── -->\n  <sc-if value=\"{{ isPatient }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-r=\"main\" data-screen-label=\"ติดตามผล F/U\" style=\"max-width: 1240px; margin: 0 auto; padding: 26px 22px 0;\">\n      <section data-r=\"car Fstrong> โดยอัตโนมัติ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ kiosk }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width: 460px; margin-bottom: 16px;\">\n            <div style=\"font-size: 13px; color: #4E5A51; margin-bottom: 6px;\">ผู้รับบริการ<\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-radius: 12px; border: 1px solid #CFE0D5; background: #E6F0EA;\">\n              <span style=\"display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto; background: #FFFDF7; color: #1E6B54;\">\n                <svg sc-camel-view-box=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                  <path d=\"M19 20v-1.5a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4V20\"><\u002Fpath>\n                  <circle cx=\"12\" cy=\"7\" r=\"3.6\"><\u002Fcircle>\n                <\u002Fsvg>\n              <\u002Fspan>\n              <span style=\"display: grid; gap: 1px; min-width: 0;\">\n                <span style=\"font-size: 16px; font-weight: 700; color: #14201B;\">{{ kioskName }}<\u002Fspan>\n                <span style=\"font-size: 12px; color: #4E5A51; font-variant-numeric: tabular-nums;\">HN {{ rcqHN }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showNav }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-bottom: 16px;\">\n          <div style=\"font-size: 13px; color: #4E5A51; margin-bottom: 6px;\">{{ rcqSearchLabel }}<\u002Fdiv>\n          <div style=\"position: relative;\">\n            <input value=\"{{ rcqHN }}\" sc-camel-on-input=\"{{ onRcqHN }}\" sc-camel-on-focus=\"{{ onRcqHnFocus }}\" sc-camel-on-blur=\"{{ onRcqHnBlur }}\" placeholder=\"กรอก HN หรือชื่อ-นามสกุล\" style=\"width: 10 : 28px; border-radius: 9px; flex: 0 0 auto; background: #FFFDF7; color: #1E6B54;\">\n                <svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                  <path d=\"M19 20v-1.5a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4V20\"><\u002Fpath>\n                  <circle cx=\"12\" cy=\"7\" r=\"3.6\"><\u002Fcircle>\n                <\u002Fsvg>\n              <\u002Fspan>\n              <span style=\"font-size: 15px; font-weight: 700; color: #14201B;\">{{ rcqPatientName }}<\u002Fspan>\n              <span style=\"font-size: 12px; color: #4E5A51; font-variant-numeric: tabular-nums;\">HN {{ rcqHN }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ rcqModeQr }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-if value=\"{{ fuQrNotReady }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 16px 18px; border-radius: 13px; background: #FDF4E6; border: 1px dashed #EBD9BC;\">\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#9A5A16\" stroke-width=\"1.9\" stroke-linecap=\"round\" aria-hidden=\"true\">\n                <circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle>\n                <path d=\"M12 8v5M12 16h.01\"><\u002Fpath>\n              <\u002Fsvg>\n              <span style=\"font-size: 13px; color: #7A5A18; line-height: 1.6;\">เลือกผู้ป่วยจากช่องค้นหาด้านบนก่อน จึงจะสร้าง QR ได้<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ fuQrReady }}\" hint-placeholder-val=\"{{ false }}\">\n            <div data-r=\"qr-row\" style=\"display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; align-items: center; padding: 22px; border-radius: 15px; background: #F  none; background: #06C755; color: #FFF;\">ส่งทาง LINE<\u002Fa>\n                  <button type=\"button\" sc-camel-on-click=\"{{ dlRcqQr }}\" style=\"display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 11px; font-weight: 600; font-size: 13px; font-family: inherit; cursor: pointer; text-decoration: none; border: 1px solid #C9C0AB; background: #FFF; color: #14201B;\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 4v11\"><\u002Fpath><path d=\"m8 12 4 3 4-3\"><\u002Fpath><path d=\"M5 19h14\"><\u002Fpath><\u002Fsvg> บันทึกภาพ QR<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ copyHnQrLink }}\" style=\"display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 11px; font-weight: 600; font-size: 13px; font-family: inherit; cursor: pointer; text-decoration: none; border: 1px solid #C9C0AB; background: #FFF; color: #14201B;\">{{ hnQrCopyLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"font-size: 12.5px; color: #6F5A38; line-height: 1.55;\">{{ shareMsg }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ rcqModeSelf }}\" hint-placeholder-val=\"{{ true }}\">\n        <sc-if value=\"{{ rcqPrev }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 18px; align-items: center; padding: 16px 18px; border-radius: 15px; background: linear-gradient(150deg, #E6F0EA, #F4EEDE); border: 1px solid #CFE0D5; margin-bottom: 16px;\">\n            <div>\n              <div style=\"font-size: 12px; color: #4E5A51;\">ครั้งก่อนรักษา<\u002Fdiv>\n              <div style=\"font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 26px; font-weight: 700;\">{{ rcqPrev.preTotal }}<\u002Fdiv>\n              <div style=\"font-size: 12px; color: #4E5A51;\">{{ rcqPrev.preBand }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size: 12px; color: #4E5A51;\">ครั้งนี้<\u002Fdiv>\n              <div style=\"font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 26px; font-weight: 700; color: #16543F;\">{{ rcqPrev.postTotal }}<\u002Fdiv>\n              <div style=\"font-size: 12px; color: #4E5A51;\">คะแนนยิ่งต่ำยิ่งดี<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size: 12px; color: #4E5A51;\">ส่วนต่างคะแนน<\u002Fdiv>\n              <div style=\"font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 26px; font-weight: 700; color: {{ rcqPrev.diffColor }};\">{{ rcqPrev.diffText }}<\u002Fdiv>\n              <div style=\"font-size: 12px; color: {{ rcqPrev.diffColor }};\">{{ rcqPrev.note }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-left: auto; text-align: right;\">\n              <div style=\"font-size: 12px; color: #4E5A51;\">ดีขึ้นจากช่วงที่ลดได้จริง<\u002Fdiv>\n              <div style=\"font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 30px; font-weight: 700; color: {{ rcqPrev.pctColor }};\">{{ rcqPrev.pct }}<\u002Fdiv>\n              <div style=\"font-size: 13px; color: {{ rcqPrev.pctColor }}; font-weight: 600;\">{{ rcqPrev.pctLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px;\">\n          <span style=\"flex: 1 1 160px; height: 9px; border-radius: 999px; background: #EFE8D6; overflow: hidden; display: block;\">\n            <span style=\"display: block; height: 100%; width: {{ rcqProgress }}; background: #1E6B54; border-radius: 999px;\"><\u002Fspan>\n          <\u002Fspan>\n          <span style=\"font-size: 12px; color: #6F5A38; font-variant-numeric: tabular-nums;\">ตอบแล้ว {{ rcqAnswered }} / {{ rcqItemCount }} ข้อ<\u002Fspan>\n          <span style=\"padding: 4px 11px; border-radius: 999px; background: #EFE7D3; font-size: 13px; font-weight: 600; color: {{ rcqBandColor }};\">{{ rcqBandLabel }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; gap: 9px;\">\n          <sc-for list=\"{{ rcqDomains }}\" as=\"d\" hint-placeholder-count=\"7\">\n            <div>\n              <button type=\"button\" sc-camel-on-click=\"{{ d.toggle }}\" style=\"{{ d.head }}\">\n                <span style=\"{{ d.badge }}\">{{ d.no }}<\u002Fspan>\n                <span style=\"{{ d.titleStyle }}\">{{ d.title }}<\u002Fspan>\n                <span style=\"{{ d.countStyle }}\">{{ d.count }}<\u002Fspan>\n              <\u002Fbutton>\n              <sc-if value=\"{{ d.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding: 14px 4px 4px;\">\n                  <p style=\"margin: 0 0 12px; font-size: 13px; color: #4E5A51; line-height: 1.6;\">{{ d.q }}<\u002Fp>\n                  <div style=\"display: grid; gap: 12px;\">\n                    <sc-for list=\"{{ d.rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                      <div data-r=\"rcq-row\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, 300px); gap: 10px 14px; align-items: center;\">\n                        <div style=\"display: flex; gap: 8px; font-size: 14px; color: #14201B; line-height: 1.5;\">\n                          <span style=\"color: #8A7250; flex: 0 0 auto;\">{{ r.no }}.<\u002Fspan>\n                          <span>{{ r.label }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;\">\n                          <sc-for list=\"{{ r.levels }}\" as=\"lv\" hint-placeholder-count=\"5\">\n                            <button type=\"button\" sc-camel-on-click=\"{{ lv.on }}\" style=\"{{ lv.style }}\">\n                              <span style=\"{{ lv.numStyle }}\">{{ lv.n }}<\u002Fspan>\n                              <span style=\"{{ lv.wordStyle }}\">{{ lv.word }}<\u002Fspan>\n                            <\u002Fbutton>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top: 9px; display: grid; gap: 9px;\">\n          <div>\n            <button type=\"button\" sc-camel-on-click=\"{{ d8Toggle }}\" style=\"{{ d8Head }}\">\n              <span style=\"display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; flex: 0 0 auto; font-size: 12px; font-weight: 700; background: #0F3327; color: #FFF;\">8<\u002Fspan>\n              <span style=\"font-size: 15px; font-weight: 600; color: #0F3327;\">สุขภาพโดยรวมในขณะนี้<\u002Fspan>\n              <span style=\"margin-left: auto; font-size: 12px; color: #6F5A38;\">{{ d8Count }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ d8Open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div data-r=\"rcq-row\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, 300px); gap: 10px 14px; align-items: center; padding: 14px 4px 4px;\">\n                <div style=\"font-size: 14px; color: #14201B; line-height: 1.5;\">โดยรวมแล้วคุณคิดว่าสุขภาพของคุณในขณะนี้เป็นอย่างไร<\u002Fdiv>\n                <div style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;\">\n                  <sc-for list=\"{{ rcqHealthOptions }}\" as=\"o\" hint-placeholder-count=\"5\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ o.on }}\" style=\"{{ o.chip }}\">\n                      <span style=\"font-size: 14px; font-weight: 700;\">{{ o.n }}<\u002Fspan>\n                      <s rgin-top: 18px; padding: 15px; border-radius: 14px; border: none; background: #1E6B54; color: #F7F2E7; font-weight: 700; font-size: 16px; font-family: inherit; cursor: pointer;\">บันทึกผลประเมินครั้งนี้<\u002Fbutton>\n        <div style=\"margin-top: 10px; text-align: center; font-size: 13px; color: {{ rcqColor }};\">{{ rcqMsg }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ─────────── ผู้ลงทะเบียน ─────────── -->\n  <sc-if value=\"{{ isReg }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-r=\"main\" data-screen-label=\"ผู้ลงทะเบียน\" style=\"max-width: 1240px; margin: 0 auto; padding: 26px 22px 0;\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; margin-bottom: 18px;\">\n        <div style=\"margin-right: auto;\">\n          <div style=\"display: flex; align-items: center; gap: 9px;\">\n            <svg sc-camel-view-box=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"#B08B3E\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n              <path d=\"M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20\"><\u002Fpath>\n              <circle cx=\"9.5\" cy=\"7\" r=\"3.5\"><\u002Fcircle>\n              <path d=\"M18 7h4M20 5v4\"><\u002Fpath>\n            <\u002Fsvg>\n            <span style=\"font-size: 12px; letter-spacing: 2.4px; text-transform: uppercase; color: #8A7250; font-weight: 600;\">Patient Registry<\u002Fspan>\n          <\u002Fdiv>\n          <h1 data-r=\"h1\" style=\"margin: 4px 0 6px; font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.15;\">ทะเบียนผู้ลงทะเบียน<\u002Fh1>\n          <p style=\"margin: 0; max-width: 62ch; color: #4E5A51; font-size: 15px;\">ข้อมูลจากชีต patients · ลงทะเบียนครั้งเดียวต่อผู้ป่วย ใช้ HN เป็นคีย์เชื่อมกับบันทึกหัตถการ<\u002Fp>\n        <\u002Fdiv>\n        <div data-r=\"hero-actions\" style=\"display: flex; gap: 8px;\">\n \n            <div style=\"position: absolute; z-index: 30; top: calc(100% + 5px); left: 0; right: 0; max-height: 268px; overflow-y: auto; border-radius: 12px; background: #FFFDF7; border: 1px solid #D9C89E; box-shadow: 0 14px 34px rgba(11,43,33,.16);\">\n              <sc-for list=\"{{ regSuggestions }}\" as=\"sg\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-mouse-down=\"{{ sg.pick }}\" style=\"display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 13px; border: none; border-bottom: 1px solid #EFE8D6; background: none; cursor: pointer; font-family: inherit; text-align: left;\">\n                  <span style=\"display: grid; place-items: center; width: 27px; height: 27px; border-radius: 8px; flex: 0 0 auto; background: #E6F0EA; color: #1E6B54; font-size: 11px; font-weight: 700;\">HN<\u002Fspan>\n                  <span style=\"display: grid; gap: 1px; min-width: 0;\">\n                    <span style=\"font-size: 14px; font-weight: 700; color: #14201B; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ sg.name }}<\u002Fspan>\n                    <span style=\"font-size: 12px; color: #6F5A38; font-variant-numeric: tabular-nums;\">HN {{ sg.hn }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"margin-left: auto; font-size: 11px; color: #8A7250; flex: 0 0 auto;\">{{ sg.meta }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <span data-r=\"range-note\" style=\"margin-left: auto; font-size: 13px; color: {{ regColor }};\">{{ regMsg }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ regEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 26px; border-radius: 16px; background: #FDF4E6; border: 1px dashed #EBD9BC; text-align: center; font-size: 14px; color: #7A5A18; line-height: 1.7;\">ยังไม่มีผู้ลงทะเบียนในชีต patients<br>กด \"เพิ่มการลงทะเบียน\" เพื่อเริ่มรายการแรก<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <section style=\"border-radius: 18px; background: #FFFDF7; border: 1px solid #E0D5B8; overflow: hidden;\">\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 18px 20px 14px;\">\n          <h2 style=\"margin: 0; margin-right: auto; font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 18px; font-weight: 600;\">รายการทั้งหมด ({{ regCount }})<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"overflow-x: auto;\">\n          <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 14px; min-width: 860px;\">\n            <sc-raw-thead>\n              <sc-raw-tr style=\"background: #EFE7D3; text-align: center; color: #4E5A51;\">\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">HN<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">ชื่อ-นามสกุล<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">อายุ<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">เพศ<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">ธาตุเจ้าเรือน<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">วันที่ลงทะเบียน<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">คลินิก/หน่วยบริการ<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">consentID<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">ยินยอมรักษา<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">ยินยอมวิจัย R2R<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">ลายเซ็น<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ regRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                <sc-raw-tr style=\"border-top: 1px solid #EFE8D6; text-align: center;\">\n                  <sc-raw-td style=\"padding: 11px 16px; font-weight: 500; font-variant-numeric: tabular-nums;\">{{ r.hn }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; text-align: left;\">{{ r.name }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; font-variant-numeric: tabular-nums;\">{{ r.age }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; color: #4E5A51;\">{{ r.sex }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; color: #4E5A51;\">{{ r.thatu }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; color: #4E5A51;\">{{ r.date }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; text-align: left; color: #4E5A51;\">{{ r.clinic }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; font-size: 12px; color: #6F5A38; font-variant-numeric: tabular-nums;\">{{ r.consentId }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; font-weight: 600; color: {{ r.consentColor }};\">{{ r.consent }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; font-weight: 600; color: {{ r.researchColor }};\">{{ r.research }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px;\"><a href=\"{{ r.sigUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"color: #1E6B54;\">{{ r.sigText }}<\u002Fa><\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasPager }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid #EFE8D6; background: #FDFAF1;\">\n            <span style=\"font-size: 13px; color: #6F5A38; margin-right: auto;\">{{ pageInfo }}<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ prevPage }}\" disabled=\"{{ atFirst }}\" style=\"{{ pagerBtnPrev }}\">\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n              ก่อนหน้า\n            <\u002Fbutton>\n            <span style=\"font-size: 13px; font-weight: 700; color: #0F3327; font-variant-numeric: tabular-nums;\">{{ pageLabel }}<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ nextPage }}\" disabled=\"{{ atLast }}\" style=\"{{ pagerBtnNext }}\">\n              ถัดไป\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fmain>\n\n    <sc-if value=\"{{ regForm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position: fixed; inset: 0; z-index: 50; background: rgba(11,43,33,.48); display: grid; place-items: center; padding: 20px; overflow-y: auto;\">\n        <div style=\"width: min(620px, 100%); padding: 26px; border-radius: 20px; background: #FFFDF7; border: 1px solid #D9C89E; box-shadow: 0 22px 60px rgba(11,43,33,.3); animation: suma-rise .2s ease-out;\">\n          <div style=\"display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px;\">\n            <div style=\"margin-right: auto;\">\n              <h3 style=\"margin: 0 0 4px; font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 22px; font-weight: 700;\">เพิ r-top: 1px dashed #DCCDA8;\">\n              <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 8px;\">\n                <span style=\"font-size: 13px; font-weight: 600; color: #4E5A51;\">ลายเซ็นผู้ป่วย<\u002Fspan>\n                <span style=\"font-size: 12px; color: #8A7250;\">ไม่บังคับ · เซ็นด้วยนิ้วหรือเมาส์<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ rsigClear }}\" style=\"margin-left: auto; padding: 7px 13px; border-radius: 9px; border: 1px solid #C9C0AB; background: #FFF; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer;\">ล้างลายเซ็น<\u002Fbutton>\n              <\u002Fdiv>\n              <canvas ref=\"{{ rsigRef }}\" width=\"640\" height=\"180\" style=\"width: 100%; max-width: 100%; height: 150px; border-radius: 12px; border: 1px solid #D6CDB8; background: #FFF; touch-action: none; cursor: crosshair;\"><\u002Fcanvas>\n              <div style=\"margin-top: 7px; font-size: 12px; color: #6F5A38;\">{{ consentStamp }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 20px;\">\n            <span style=\"font-size: 13px; color: {{ regColor }}; margin-right: auto;\">{{ regMsg }}<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ closeReg }}\" style=\"padding: 12px 18px; border-radius: 12px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; font-family: inherit; cursor: pointer;\">ยกเลิก<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ saveReg }}\" style=\"padding: 12px 22px; border-radius: 12px; border: none; background: #1E6B54; color: #F7F2E7; font-weight: 700; font-family: inherit; cursor: pointer;\">บันทึกลงชีต patients<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <!-- ─────────── ตั้งค่า ─────────── -->\n  <sc-if value=\"{{ isSet }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-r=\"main\" data-screen-label=\"ตั้งค่า\" style=\"max-width: 1240px; margin: 0 auto; padding: 26px 22px 0;\">\n      <section data-r=\"card\" style=\"padding: 24px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E0D5B8;\">\n        <h2 style=\"margin: 0 0 4px; font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 22px; font-weight: 700;\">การเชื่อมต่อ Google Sheet<\u002Fh2>\n        <p style=\"margin: 0 0 18px; font-size: 14px; color: #8A7F66; line-height: 1.7;\">แอปตั้งค่าการเชื่อมต่อมาให้ในตัวแล้ว และดึงข้อมูลจากชีตอัตโนมัติทุกครั้งที่เปิด — ปกติไม่ต้องแก้อะไรในหน้านี้<\u002Fp>\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 14px; background: #EFE7D3; border: 1px solid #E0D5B8;\">\n          <span style=\"width: 10px; height: 10px; border-radius: 50%; background: {{ cfgDot }};\"><\u002Fspan>\n          <span style=\"font-size: 14px; font-weight: 600; color: {{ cfgStatusColor }}; margin-right: auto;\">{{ cfgStatus }}<\u002Fspan>\n          <button type=\"button\" sc-camel-on-click=\"{{ loadSheet }}\" style=\"padding: 10px 16px; border-radius: 11px; border: none; background: #0F3327; color: #F7F2E7; font-weight: 600; font-family: inherit; cursor: pointer;\">ดึงข้อมูลใหม่<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleCfg }}\" style=\"padding: 10px 16px; border-radius: 11px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; font-family: inherit; cursor: pointer;\">{{ cfgToggleLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"margin-top: 9px; font-size: 13px; color: {{ submitColor }};\">{{ submitMsg }}<\u002Fdiv>\n\n        <sc-if value=\"{{ showCfg }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top: 16px; padding: 18px; border-radius: 14px; background: #FFF; border: 1px dashed #D9C89E;\">\n            <p style=\"margin: 0 0 14px; font-size: 13px; color: #8A7F66; line-height: 1.7;\">แก้เฉพาะเมื่อ Deploy Apps Script ใหม่แล้วได้ URL เปลี่ยน หรือเปลี่ยน <code>CONFIG.API_KEY<\u002Fcode><\u002Fp>\n            <div style=\"display: grid; gap: 14px;\">\n              <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">Web App URL\n                <input value=\"{{ url }}\" sc-camel-on-input=\"{{ onUrl }}\" placeholder=\"https://script.google.com/macros/s/.../exec\" style=\"padding: 12px 14px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF; font-family: ui-monospace, monospace; font-size: 13px;\">\n              <\u002Flabel>\n              <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">API Key (ต้องตรงกับ CONFIG.API_KEY)\n                <input value=\"{{ key }}\" sc-camel-on-input=\"{{ onKey }}\" style=\"padding: 12px 14px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF; font-family: ui-monospace, monospace; font-size: 13px;\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ testLink }}\" style=\"margin-top: 16px; padding: 12px 18px; border-radius: 11px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; font-family: inherit; cursor: pointer;\">ทดสอบการเชื่อมต่อ<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top: 24px; padding-top: 20px; border-top: 1px dashed #DCCDA8;\">\n          <h3 style=\"margin: 0 0 12px; font-family: Anuphan, 'Noto Sans Thai', sans-serif; font-size: 17px; font-weight: 600;\">โครงสร้างข้อมูล 5 ชีต<\u002Fh3>\n          <div style=\"display: grid; gap: 12px;\">\n            <sc-for list=\"{{ sheetDocs }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <div style=\"padding: 15px; border-radius: 13px; background: #F4EEDE;\">\n                <div style=\"display: flex; gap: 10px; align-items: baseline; margin-bottom: 5px;\">\n                  <span style=\" าธิต&quot;},&quot;safeMinCm&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:12,&quot;max&quot;:30,&quot;unit&quot;:&quot;ซม.&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;ความปลอดภัย&quot;}}\">\nconst HERBS = [\n  { key: 'ginger', th: 'ขิง', sci: 'Zingiber officinale', def: 30 },\n  { key: 'makhwaen', th: 'มะแขวน', sci: 'Zanthoxylum limonella', def: 25 },\n  { key: 'kha', th: 'ข่า', sci: 'Alpinia galanga', def: 20 },\n  { key: 'makrut', th: 'ผิวมะกรูด', sci: 'Citrus hystrix', def: 15 },\n  { key: 'peep', th: 'ดอกปีบ', sci: 'Millingtonia hortensis', def: 10 }\n];\nconst TNSS_KEYS = [\n  { key: 'rhino', label: 'น้ำมูกไหล', color: '#1E6B54', soft: '#E6F0EA' },\n  { key: 'itch', label: 'คันจมูก', color: '#7F6122', soft: '#F6EDD8' },\n  { key: 'block', label: 'คัดจมูก', color: '#6B3E8C', soft: '#EFE4F5' },\n  { key: 'sneeze', label: 'จาม', color: '#2F6B7A', soft: '#E3EEF1' }\n];\n/** เกณฑ์ TNSS ฉบับภาษาไทย 0-3 คะแนน */\nconst WORDS = ['ไม่มีอาการ', 'มีอาการเล็กน้อย', 'มีอาการปานกลางถึงมาก', 'มีอาการรุนแรงมาก'];\nconst WORDS_SHORT = ['ไม่มี', 'เล็กน้อย', 'ปานกลาง-มาก', 'รุนแรงมาก'];\n/** แปลผลคะแนนรวม 0-12 ตามเกณฑ์มาตรฐาน */\nconst TNSS_BANDS = [\n  { max: 2, label: 'อาการเล็กน้อยมาก', color: '#1E6B54' },\n  { max: 6, label: 'อาการเล็กน้อย', color: '#24735A' },\n  { max: 9, label: 'อาการปานกลาง', color: '#8E5214' },\n  { max: 12, label: 'อาการรุนแรง', color: '#96301C' }\n];\nfunction tnssBand(total) {\n  return TNSS_BANDS.find(b => total <= b.max) || TNSS_BANDS[TNSS_BANDS.length - 1];\n}\n\n/* ── เวชศาสตร์แผนไทย: ธาตุเจ้าเรือน & สมุฏฐานการเกิดโรค ── */\nconst THATU_NOTE = {\n  ไฟ: 'ธาตุไฟ · ปิตตะเป็นเจ้าเรือน มักแสบร้อน เยื่อจมูกแดงบวม',\n  ลม: 'ธาตุลม · วาตะเป็นเจ้าเรือน มักแห้ง คัน จามถี่',\n  'น้ำ': 'ธาตุน้ำ · เสมหะเป็นเจ้าเรือน มักน้ำมูกมาก คัดแน่น',\n  ดิน: 'ธาตุดิน · ธาตุหนักแน่น อาการเรื้อรังค่อยเป็นค่อยไป'\n};\nconst UTU = [\n  { v: 'คิมหันตฤดู (ปิตตะสมุฏฐาน)', label: 'คิมหันตฤดู · ฤดูร้อน (ปิตตะ)', months: [2, 3, 4, 5] },\n  { v: 'วสันตฤดู (วาตะสมุฏฐาน)', label: 'วสันตฤดู · ฤดูฝน (วาตะ)', months: [6, 7, 8, 9] },\n  { v: 'เหมันตฤดู (เสมหะสมุฏฐาน)', label: 'เหมันตฤดู · ฤดูหนาว (เสมหะ)', months: [10, 11, 12, 1] }\n];\nconst KALA = [\n  { v: '06.00-10.00 / 18.00-22.00 (เสมหะกระทำ)', label: '06–10 / 18–22 น. · เสมหะกระทำ', tri: 'เสมหะเด่น' },\n  { v: '10.00-14.00 / 22.00-02.00 (ปิตตะกระทำ)', label: '10–14 / 22–02 น. · ปิตตะกระทำ', tri: 'ปิตตะเด่น' },\n  { v: '14.00-18.00 / 02.00-06.00 (วาตะกระทำ)', label: '14–18 / 02–06 น. · วาตะกระทำ', tri: 'วาตะเด่น' }\n];\nconst TRI = {\n  วาตะเด่น: { note: 'แห้ง คัน จาม ลมพัดขึ้นสูง', bump: [['ginger', 10], ['kha', 5], ['peep', -10], ['makrut', -5]] },\n  ปิตตะเด่น: { note: 'แสบ ร้อน บวม แดง ความร้อนสะสม', bump: [['peep', 10], ['makrut', 8], ['ginger', -12], ['makhwaen', -6]] },\n  เสมหะเด่น: { note: 'น้ำมูกมาก เหนียวข้น คัดจมูก', bump: [['makhwaen', 10], ['ginger', 6], ['peep', -10], ['kha', -6]] }\n};\n/** TNSS → ตรีธาตุที่กระทำ (ตามลักษณะอาการทางเวชกรรมไทย) */\nconst TRI_BY_SYMPTOM = { block: 'เสมหะเด่น', rhino: 'เสมหะเด่น', sneeze: 'วาตะเด่น', itch: 'วาตะเด่น' };\n\n/* ── RCQ-36 · แบบสอบถามคุณภาพชีวิตเฉพาะโรคจมูกและตาอักเสบจากภูมิแพ้ ── */\nconst RCQ_SCALE = ['ไม่มีเลย', 'เล็กน้อย', 'ปานกลาง', 'มาก', 'มากที่สุด'];\nconst RCQ_DOMAINS = [\n  { id: 'd1', no: 1, title: 'อาการทางจมูก', color: '#1E6B54', soft: '#E6F0EA',\n    q: 'ในช่วง 2 สัปดาห์ที่ผ่านมา อาการเหล่านี้สร้างความรำคาญแก่คุณมากน้อยเพียงใด',\n    items: ['น้ำมูกไหล', 'คันจมูก', 'คัดแน่นจมูก', 'จาม', 'ไอ', 'คอแห้งปากแห้ง', 'มีเสมหะ'] },\n  { id: 'd2', no: 2, title: 'อาการทางตาและร่างกาย', color: '#2F6B7A', soft: '#E3EEF1',\n    q: 'ในช่วง 2 สัปดาห์ที่ผ่านมา อาการเหล่านี้สร้างความรำคาญแก่คุณมากน้อยเพียงใด',\n    items: ['คันตา', 'เคืองตา', 'น้ำตาไหล', 'ไม่สบายตา', 'สมองไม่โล่ง', 'อ่อนเพลีย', 'เหนื่อยง่าย', 'ปวดเมื่อยตามตัว', 'ปวดศีรษะ', 'ง่วงนอนตลอดเวลา'] },\n  { id: 'd3', no: 3, title: 'ปัญหาในการทำงานหรือการเรียน', color: '#6B3E8C', soft: '#EFE4F5',\n    q: 'อาการในด้านที่ 1
