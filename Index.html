document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 f.sus }}\" sc-camel-on-input=\"{{ h.sus }}\" style=\"width: 100%; min-width: 0; box-sizing: border-box; padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">บันทึกเพิ่มเติม\n              <input value=\"{{ f.note }}\" sc-camel-on-input=\"{{ h.note }}\" style=\"width: 100%; min-width: 0; box-sizing: border-box; padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 18px; padding: 18px; border-radius: 16px; background: #FDF4E6; border: 1px solid #EBD9BC;\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 10px;\">\n              <div style=\"font-size: 12px; font-weight: 700; color: #9A5A16; letter-spacing: 1.2px;\">คำแนะนำจาก AI<\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ askAI }}\" style=\"display: inline-flex; align-items: center; gap: 8px; margin-left: auto; padding: 10px 16px; border-radius: 11px; border: 1px solid #D9C89E; background: #FFF; font-weight: 600; font-family: inherit; cursor: pointer;\">{{ aiBtnLabel }}<\u002Fbutton>\n              <div title=\"{{ aiUsdTitle }}\" style=\"display: inline-flex; align-items: center; gap: 9px; padding: 5px 12px 5px 6px; border-radius: 11px; border: 1px solid #E0D5B8; background: #F4EEDE;\">\n                <span style=\"display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: #FFFDF7; color: #B08B3E; flex: 0 0 auto;\">\n                  <svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                    <circle cx=\"12\" cy=\"12\" r=\"8.5\"><\u002Fcircle>\n                    <path d top: 5px; font-size: 13px; color: #4E5A51; line-height: 1.6;\"><strong style=\"color: #B08B3E;\">มาจาก:<\u002Fstrong> ตารางค่าปรับตามตรีธาตุ (ดูข้อ 3 ด้านล่าง)<\u002Fdiv>\n                <div style=\"margin-top: 3px; font-size: 13px; color: #4E5A51; line-height: 1.6;\"><strong style=\"color: #B08B3E;\">คิดอย่างไร:<\u002Fstrong> ตรีธาตุแต่ละแบบมีรสยาที่ช่วยปรับสมดุลต่างกัน ระบบจึงเพิ่มสมุนไพรที่มีรสยาเหมาะสม และลดสมุนไพรที่มีรสยาเสริมธาตุที่กำเริบอยู่ คำแนะนำจะแสดงเฉพาะสมุนไพรที่ควรเพิ่ม<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 13px 14px; border-radius: 13px; background: #FFF; border: 1px solid #E6DEC9;\">\n              <span style=\"display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #6B3E8C; color: #FFF; font-size: 13px; font-weight: 700;\">4<\u002Fspan>\n              <div style=\"min-width: 0;\">\n                <div style=\"font-size: 14px; font-weight: 700; color: #14201B; line-height: 1.55;\">คำนวณตำรับครั้งถัดไป<\u002Fdiv>\n                <div style=\"margin-top: 5px; font-size: 13px; color: #4E5A51; line-height: 1.6;\"><strong style=\"color: #6B3E8C;\">มาจาก:<\u002Fstrong> สัดส่วนตำรับครั้งนี้ ในขั้นที่ 3 + ค่าปรับของบรรทัดที่ 3<\u002Fdiv>\n                <div style=\"margin-top: 3px; font-size: 13px; color: #4E5A51; line-height: 1.6;\"><strong style=\"color: #6B3E8C;\">คิดอย่างไร:<\u002Fstrong> นำตำรับครั้งนี้มาเพิ่ม-ลดตามรสยาที่เลือก จำกัดแต่ละชนิดไม่เกิน 60% แล้วปรับสัดส่วนรวมให้ได้ 100% · <strong>ผลส่วนนี้เท่านั้นที่บันทึกลงชีต<\u002Fstrong> ในคอลัมน์ \"สูตรแนะนำครั้งถัดไป\"<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top: 12px; font-size: 12.5px; color: #8A7250; line-height: 1.6;\">ตำรับที่แนะนำจะต่างกันในแต่ละเคส เพราะคำนวณจากตำรับที่ พท. ใช้จริงในครั้งนี้ ไม่ใช่จากสูตรตายตัว<\u002Fdiv>\n        <\u002Fdiv>\n older-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 60; background: rgba(11,43,33,.5); display: grid; place-items: center; padding: 20px;\">\n      <div style=\"width: min(450px, 100%); padding: 26px; border-radius: 20px; background: #FFFDF7; border: 1px solid #EBD9BC; box-shadow: 0 22px 60px rgba(11,43,33,.3); animation: suma-rise .2s ease-out;\">\n        <h3 style=\"margin: 0 0 8px; font-family: 'Bai Jamjuree', sans-serif; font-size: 20px; font-weight: 700; color: #9A5A16;\">{{ dupAsk.title }}<\u002Fh3>\n        <p style=\"margin: 0 0 20px; font-size: 14px; color: #4E5A51; line-height: 1.65;\">{{ dupAsk.body }}<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ dupAsk.cancel }}\" style=\"padding: 11px 20px; border-radius: 12px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; font-family: inherit; cursor: pointer;\">ยกเลิก<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ dupAsk.ok }}\" style=\"padding: 11px 20px; border-radius: 12px; border: none; background: #9A5A16; color: #FFF8EC; font-weight: 700; font-family: inherit; cursor: pointer;\">บันทึกต่อไป<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;demoTimer&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;การสาธิต&quot;},&quot;sumaMinutes&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:15,&quot;min&quot;:5,&quot;max&quot;:20,&quot;unit&quot;:&quot;นาที&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;การสาธิต&quot;},&quot;safeMinCm&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:12,&quot;max&quot;:30,&quot;unit&quot;:&quot;ซม.&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;ความปลอดภัย&quot;}}\">\nconst HERBS = [\n  { key: 'ginger', th: 'ขิง', sci: 'Zingiber officinale', def: 30 },\n  { key: 'makhwaen', th: 'มะแขว่น', sci: 'Zanthoxylum limonella', def: 25 },\n  { key: 'kha', th: 'ข่า', sci: 'Alpinia galanga', def: 20 },\n  { key: 'makrut', th: 'ผิวมะกรูด', sci: 'Citrus hystrix', def: 15 },\n  { key: 'peep', th: 'ดอกปีบ', sci: 'Millingtonia hortensis', def: 10 }\n];\nconst TNSS_KEYS = [\n  { key: 'rhino', label: 'น้ำมูกไหล', color: '#1E6B54', soft: '#E6F0EA' },\n  { key: 'itch', label: 'คันจมูก', color: '#7F6122', soft: '#F6EDD8' },\n  { key: 'block', label: 'คัดจมูก', color: '#6B3E8C', soft: '#EFE4F5' },\n  { key: 'sneeze', label: 'จาม', color: '#2F6B7A', soft: '#E3EEF1' }\n];\n/** เกณฑ์ TNSS ฉบับภาษาไทย 0-3 คะแนน */\nconst WORDS = ['ไม่มีอาการ', 'มีอาการเล็กน้อย', 'มีอาการปานกลางถึงมาก', 'มีอาการรุนแรงมาก'];\nconst WORDS_SHORT = ['ไม่มี', 'เล็กน้อย', 'ปานกลาง-มาก', 'รุนแรงมาก'];\n/** แปลผลคะแนนรวม 0-12 ตามเกณฑ์มาตรฐาน */\nconst TNSS_BANDS = [\n  { max: 2, label: 'อาการเล็กน้อยมาก', color: '#1E6B54' },\n  { max: 6, label: 'อาการเล็กน้อย', color: '#24735A' },\n  { max: 9, label: 'อาการปานกลาง', color: '#8E5214' },\n  { max: 12, label: 'อาการรุนแรง', color: '#96301C' }\n];\nfunction tnssBand(total) {\n  return TNSS_BANDS.find(b => total <= b.max) || TNSS_BANDS[TNSS_BANDS.length - 1];\n}\n\n/** แสดง HN ให้ครบ 7 หลัก (เติม 0 ด้านหน้า) — เฉพาะการแสดงผล */\nfunction fmtHN(v) {\n  const s = String(v == null ? '' : v).trim();\n  return /^\\d+$/.test(s) && s.length < 7 ? s.padStart(7, '0') : s;\n}\n\n/** ข้อมูลอ้างอิงงานวิชาการสมุนไพร 5 ชนิด — ส่งให้ AI เฉพาะโหมดหน้าตัวอย่าง (ระบบจริงเก็บไว้ใน Code.gs) */\nconst HERB_REFS = \"ข้อมูลอ้างอิงทางวิชาการของสมุนไพรในตำรับ (ใช้ประกอบเหตุผลเท่านั้น ห้ามอ้างเกินกว่าที่ระบุ):\\n1) ขิง (เหง้า) — ตำรายาไทย: รสเผ็ดร้อน แก้หวัด แก้ไอ ขับเสมหะ แก้หอบ บำรุงธาตุไฟ · สาร gingerols, shogaols ต้านการอักเสบ · หลักฐานทางคลินิก (RCT ในผู้ป่วยโรคจมูกอักเสบจากภูมิแพ้ เทียบ loratadine): สารสกัด 95% เอทานอลจากเหง้าขิงลด TNSS ได้ เพิ่มปริมาตรโพรงจมูกจาก acoustic rhinometry ช่วยอาการคัดแน่นจมูก คุณภาพชีวิต (RQLQ) ดีขึ้น ไม่มีผลต่อตับ ไต และความดันโลหิต [BMC Complement Med Ther 2020;20:119] · ระดับหลักฐาน: สูงสุดในตำรับ ตรงกับโรคโดยตรง\\n2) ข่า (เหง้าแก่) — ตำรายาไทย: รสเผ็ดร้อน ขม ขับลม บำรุงไฟธาตุ แก้หลอดลมอักเสบ แก้ลมแน่นหน้าอก · สาร galangin (ฟลาโวนอยด์) ยับยั้งการหลั่งฮีสตามีนและลดการอักเสบที่เกี่ยวกับภูมิแพ้ ร่วมกับน้ำมันหอมระเหย cineole · ระดับหลักฐาน: ฤทธิ์ทางเภสัชวิทยา ยังไม่มีการศึกษาทางคลินิกในโรคนี้ [ฐานข้อมูลสมุนไพรไทยเขตอีสานใต้ คณะเภสัชศาสตร์ ม.อุบลราชธานี]\\n3) มะแขว่น (ผล/เมล็ด) — ตำรายาไทย: รสเผ็ดสุขุม กลิ่นหอม แก้ลม แก้วิงเวียน ขับลม บำรุงหัวใจ · น้ำมันหอมระเหย (geranial, citral, limonene, linalool, sabinene) ต้านจุลินทรีย์และต้านการอักเสบ [Negi et al. 2012; Donald et al. 2016] · ระดับหลักฐาน: ในหลอดทดลองและสัตว์ทดลอง\\n4) ผิวมะกรูด — ตำรายาไทย: รสปร่าหอมร้อน ขับลม แก้แน่น แก้เสมหะ บำรุงหัวใจ · สารคูมาริน (bergamottin, oxypeucedanin, psoralen) ยับยั้งการสร้างไนตริกออกไซด์ซึ่งเป็นตัวกลางการอักเสบในเซลล์แมคโครฟาจ [Murakami et al. 1999; Tangyuenyongwatana & Gritsanapan 2014] · ระดับหลักฐาน: ในหลอดทดลอง\\n5) ดอกปีบ — ตำรายาไทย: กลิ่นหอม รสหวานขม ขยายหลอดลม ใช้สูบแก้ริดสีดวงจมูก ไซนัสอักเสบ หืด · การศึกษากึ่งทดลองยาพ่นดอกปีบสกัดเอทานอลในผู้ป่วยหืด 30 ราย และปอดอุดกั้นเรื้อรัง 30 ราย: PEFR เพิ่มขึ้น 21.09% และ 29.81% ตามลำดับ คุณภาพชีวิตดีขึ้น ชีพจรไม่เปลี่ยน [Srinagarind Med J 2017;32(suppl)] · ระดับหลักฐาน: ทางคลินิกแต่ในโรคทางเดินหายใจส่วนล่าง ไม่ใช่โรคจมูกอักเสบโดยตรง\\nวิธีใช้ข้อมูลนี้: ในหัวข้อเหตุผลการปรับตำรับ ให้อ้างหลักฐานของสมุนไพรที่เปลี่ยนสัดส่วนสั้นๆ พร้อมที่มาในวงเล็บ ระบุระดับหลักฐานตามจริง ห้ามกล่าวว่าสมุนไพรที่มีหลักฐานระดับหลอดทดลองรักษาโรคได้\";\n\n/** ปิดบังนามสกุล 2 ตัวอักษรท้ายเป็น xx (เฉพาะการแสดงผล — ข้อมูลในชีตยังเป็นชื่อเต็ม) */\nfunction maskName(v) {\n  const s = String(v == null ? '' : v).trim();\n  if (!s) return s;\n  const parts = s.split(/\\s+/);\n  if (parts.length < 2) return s;\n  const last = parts[parts.length - 1];\n  let g;\n  try { g = Array.from(new Intl.Segmenter('th', { granularity: 'grapheme' }).segment(last), x => x.segment); }\n  catch (e) { g = Array.from(last); }\n  parts[parts.length - 1] = (g.length > 2 ? g.slice(0, g.length - 2).join('') : '') + 'xx';\n  return parts.join(' ');\n}\n\n/* ── เวชศาสตร์แผนไทย: ธาตุเจ้าเรือน & สมุฏฐานการเกิดโรค ── */\nconst THATU_NOTE = {\n  ไฟ: 'ธาตุไฟ · ปิตตะเป็นเจ้าเรือน มักแสบร้อน เยื่อจมูกแดงบวม',\n  ลม: 'ธาตุลม · วาตะเป็นเจ้าเรือน มักแห้ง คัน จามถี่',\n  'น้ำ': 'ธาตุน้ำ · เสมหะเป็นเจ้าเรือน มักน้ำมูกมาก คัดแน่น',\n  ดิน: 'ธาตุดิน · ธาตุหนักแน่น อาการเรื้อรังค่อยเป็นค่อยไป'\n};\nconst UTU = [\n  { v: 'คิมหันตฤดู (ปิตตะสมุฏฐาน)', label: 'คิมหันตฤดู · ฤดูร้อน (ปิตตะ)', months: [2, 3, 4, 5] },\n  { v: 'วสันตฤดู (วาตะสมุฏฐาน)', label: 'วสันตฤดู · ฤดูฝน (วาตะ)', months: [6, 7, 8, 9] },\n  { v: 'เหมันตฤดู (เสมหะสมุฏฐาน)', label: 'เหมันตฤดู · ฤดูหนาว (เสมหะ)', months: [10, 11, 12, 1] }\n];\nconst KALA = [\n  { v: '06.00-10.00 / 18.00-22.00 (เสมหะกระทำ)', label: '06–10 / 18–22 น. · เสมหะกระทำ', tri: 'เสมหะเด่น' },\n  { v: '10.00-14.00 / 22.00-02.00 (ปิตตะกระทำ)', label: '10–14 / 22–02 น. · ปิตตะกระทำ', tri: 'ปิตตะเด่น' },\n  { v: '14.00-18.00 / 02.00-06.00 (วาตะกระทำ)', label: '14–18 / 02–06 น. · วาตะกระทำ', tri: 'วาตะเด่น' }\n];\nconst TRI = {\n  วาตะเด่น: { note: 'แห้ง คัน จาม ลมพัดขึ้นสูง', bump: [['ginger', 10], ['kha', 5], ['peep', -10], ['makrut', -5]] },\n  ปิตตะเด่น: { note: 'แสบ ร้อน บวม แดง ความร้อนสะสม', bump: [['peep', 10], ['makrut', 8], ['ginger', -12], ['makhwaen', -6]] },\n  เสมหะเด่น: { note: 'น้ำมูกมาก เหนียวข้น คัดจมูก', bump: [['makhwaen', 10], ['ginger', 6], ['peep', -10], ['kha', -6]] }\n};\n/** TNSS → ตรีธาตุที่กระทำ (ตามลักษณะอาการทางเวชกรรมไทย) */\nconst TRI_BY_SYMPTOM = { block: 'เสมหะเด่น', rhino: 'เสมหะเด่น', sneeze: 'วาตะเด่น', itch: 'วาตะเด่น' };\n\n/* ── RCQ-36 · แบบสอบถามคุณภาพชีวิตเฉพาะโรคจมูกและตาอักเสบจากภูมิแพ้ ── */\nconst RCQ_SCALE = ['ไม่มีเลย', 'เล็กน้อย', 'ปานกลาง', 'มาก', 'มากที่สุด'];\nconst RCQ_DOMAINS = [\n  { id: 'd1', no: 1, title: 'อาการทางจมูก', color: '#1E6B54', soft: '#E6F0EA',\n    q: 'ในช่วง 2 สัปดาห์ที่ผ่านมา อาการเหล่านี้สร้างความรำคาญแก่คุณมากน้อยเพียงใด',\n    items: ['น้ำมูกไหล', 'คันจมูก', 'คัดแน่นจมูก', 'จาม', 'ไอ', 'คอแห้งปากแห้ง', 'มีเสมหะ'] },\n  { id: 'd2', no: 2, title: 'อาการทางตาและร่างกาย', color: '#2F6B7A', soft: '#E3EEF1',\n    q: 'ในช่วง 2 สัปดาห์ที่ผ่านมา อาการเหล่านี้สร้างความรำคาญแก่คุณมากน้อยเพียงใด',\n    items: ['คันตา', 'เคืองตา', 'น้ำตาไหล', 'ไม่สบายตา', 'สมองไม่โล่ง', 'อ่อนเพลีย', 'เหนื่อยง่าย', 'ปวดเมื่อยตามตัว', 'ปวดศีรษะ', 'ง่วงนอนตลอดเวลา'] },\n  { id: 'd3', no: 3, title: 'ปัญหาในการทำงานหรือการเรียน', color: '#6B3E8C', soft: '#EFE4F5',\n    q: 'อาการในด้านที่ 1 และ/หรือ ด้านที่ 2 ทำให้คุณมีปัญหาเหล่านี้มากน้อยเพียงใด',\n    items: ['ต้องหยุดงาน หรือ หยุดเรียนหนังสือ', 'ไม่มีสมาธิในการทำงาน หรือ เรียนหนังสือ', 'เป็นอุปสรรคต่อการทำงาน เช่น ทำให้ทำงานติด ๆ ขัด ๆ'] },\n  { id: 'd4', no: 4, title: 'ปัญหาในการทำกิจกรรม', color: '#8E5214', soft: '#FBEBD9',\n    q: 'อาการที่เป็นอยู่ทำให้คุณมีปัญหาในการทำกิจกรรมต่อไปนี้มากน้อยเพียงใด',\n    items: ['เล่นกีฬาหรือออกกำลังกายหนัก ๆ หรือ ทำกิจกรรมที่ต้องใช้แรงมาก ๆ', 'เล่นกีฬาหรือออกกำลังกายปานกลาง หรือ ทำกิจกรรมที่ต้องใช้แรงปานกลาง', 'เดินเป็นระยะทางครึ่งกิโลเมตร'] },\n  { id: 'd5', no: 5, title: 'ปัญหาการนอนหลับ', color: '#2E5C8A', soft: '#E4EBF4',\n    q: 'อาการที่เป็นอยู่มีผลกระทบต่อการนอนหลับของคุณมากเพียงใด',\n    items: ['ต้องตื่นกลางดึกบ่อย ๆ', 'นอนหลับยาก', 'นอนหลับไม่สนิท'] },\n  { id: 'd6', no: 6, title: 'ปัญหาการเข้าสังคม', color: '#7F6122', soft: '#F6EDD8',\n    q: 'อาการที่เป็นอยู่ทำให้คุณมีปัญหาเหล่านี้เวลาเข้าสังคมและพบปะสังสรรค์กับผู้อื่นมากน้อยเพียงใด',\n    items: ['รู้สึกสูญเสียความมั่นใจในการพบปะคนอื่น', 'พบปะสังสรรค์กับเพื่อน หรือคนอื่น ๆ น้อยลง', 'รู้สึกไม่อยากออกไปไหน'] },\n  { id: 'd7', no: 7, title: 'ด้านอารมณ์', color: '#96301C', soft: '#FBE7E2',\n    q: 'อาการที่เป็นอย า Apps Script มาก (ใช้อ่านเท่านั้น) */\nconst PUB_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1fg_K6UigDWFU5vPf6vK_4rfQT7nLKvdQEzSupf_fFUb_2ebB1lIcH_AGwLbdvVeijeCYXpmzkZeL/pub?gid=0&single=true&output=csv';\n\n/* อ่านทุกชีตเป็น CSV ผ่าน gviz (เร็วกว่า Apps Script) — ต้องตั้งสเปรดชีตเป็น \"ผู้ที่มีลิงก์ = ผู้อ่าน\" */\nconst CONSENT_VERSION = 'v1.0';\nconst SHEET_ID = '1FAs-T5YqJPzKB1utX-bGuPhCFQOrE240Z0uKAoa1umg';\nconst CSV_BY_NAME = {};\n['sumary', 'rcq36', 'tnss_daily', 'patients', 'lookup'].forEach(n => {\n  CSV_BY_NAME[n] = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(n);\n});\n\n/** แปลง CSV (รองรับเครื่องหมายคำพูดและคอมมาในเซลล์) → array ของ object */\nfunction parseCSV(text) {\n  const rows = [];\n  let row = [], cell = '', q = false;\n  for (let i = 0; i < text.length; i++) {\n    const c = text[i];\n    if (q) {\n      if (c === '\"') { if (text[i + 1] === '\"') { cell += '\"'; i++; } else q = false; }\n      else cell += c;\n    } else if (c === '\"') q = true;\n    else if (c === ',') { row.push(cell); cell = ''; }\n    else if (c === '\\n') { row.push(cell); rows.push(row); row = []; cell = ''; }\n    else if (c !== '\\r') cell += c;\n  }\n  if (cell || row.length) { row.push(cell); rows.push(row); }\n  const head = (rows.shift() || []).map(h => h.trim());\n  return rows\n    .filter(r => r.some(v => String(v).trim()))\n    .map(r => { const o = {}; head.forEach((h, i) => o[h] = (r[i] || '').trim()); return o; });\n}\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\nconst r1 = v => Math.round(v * 10) / 10;\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const herb = {};\n    HERBS.forEach(h => herb[h.key] = h.def);\n    this.state = {\n      auth: this.readAuth(), authSkip: this.isPatientLink(),\n      loginUser: '', loginPass: '', loginBusy: false, loginMsg: '', loginStage: '', showPass: false,\n      screen: 'dash', step: 1, sel: null kStep: -1, speakLoading: false }); return; }\n      this.setState({ speakStep: talk[i].step }); this.scrollToStep(talk[i].step);\n      const get = () => fetchStep(i).then(url => {\n        // เตรียมขั้นถัดไปหลังขั้นนี้พร้อมแล้ว (ทีละขั้น ไม่แย่งเวลากัน)\n        if (i + 1 < talk.length) fetchStep(i + 1).catch(() => {});\n        return url;\n      });\n      // ถ้าหมดเวลา ลองอีกครั้ง — ฝั่งเซิร์ฟเวอร์มักสร้างเสร็จและเก็บไฟล์ไว้แล้ว รอบสองจึงได้ทันที\n      get().catch(() => { if (run !== this._speakRun) throw new Error('stop'); this.setState({ speakLoading: true }); return get(); }).then(url => {\n        if (run !== this._speakRun) return;\n        this.setState({ speakLoading: false, speakEngine: 'gemini', speakWarn: '' });\n        au.onended = () => setTimeout(() => play(i + 1), 350);\n        au.onerror = () => setTimeout(() => play(i + 1), 200);\n        au.src = url;\n        const p = au.play();\n        if (p && p.catch) p.catch(() => {\n          if (run !== this._speakRun) return;\n          this.setState({ speakOn: false, speakStep: -1, speakLoading: false, speakWarn: 'เบราว์เซอร์บล็อกการเล่นเสียง · กดปุ่มฟังอีกครั้ง' });\n        });\n      }).catch(err => {\n        if (run !== this._speakRun) return;\n        // ใช้เสียงของเครื่องเฉพาะขั้นนี้ แล้วกลับไปใช้ Gemini ในขั้นถัดไป\n        this.setState({ speakLoading: false, speakEngine: 'browser', speakWarn: 'ขั้นนี้ใช้เสียงของเครื่องแทน · สาเหตุ: ' + err.message });\n        this.speakOneBrowser(talk[i].say.join(' '), () => { if (run === this._speakRun) setTimeout(() => play(i + 1), 250); });\n      });\n    };\n    play(0);\n  }\n\n  speakOneBrowser(text, done) {\n    const ss = window.speechSynthesis;\n    if (!ss || !window.SpeechSynthesisUtterance) { done(); return; }\n    const u = new SpeechSynthesisUtterance(text);\n    const th = (ss.getVoices() || []).find(v => /^th/i.test(v.lang));\n    if (th) u.voice = th;\n    u.lang = 'th-TH'; u.rate = 1;\n    u.onend = done; u.onerror = done;\n    ss.spea ath.sqrt(n));\n      return { n, t, p: this.tTwoTailP(t, n - 1), md: mean(d) };\n    };\n    const pTxt = p => p == null ? 'คำนวณไม่ได้' : p < 0.001 ? '< 0.001' : r2(p * 1000) / 1000 >= 0.01 ? p.toFixed(3) : p.toFixed(4);\n    const thatuOf = t => { t = String(t || ''); return ['ไฟ', 'ลม', 'น้ำ', 'ดิน'].find(x => t.includes(x)) || 'ไม่ระบุ'; };\n    const band = a => { a = Number(a); if (!a) return 'ไม่ระบุ'; return a < 20 ? '< 20 ปี' : a < 40 ? '20–39 ปี' : a < 60 ? '40–59 ปี' : '60 ปีขึ้นไป'; };\n    const all = (s.cases || []).filter(c => c.tnssPre > 0 || c.tnssPost > 0);\n    const pairs = all.filter(c => c.tnssPre > 0 && c.tnssPost >= 0 && c.tnssPost !== '' && c.tnssPost != null && Number.isFinite(Number(c.tnssPost)) && (c.tnssPost > 0 || c.tnssDrop));\n    const count = (arr, fn) => { const o = {}; arr.forEach(x => { const k = fn(x); o[k] = (o[k] || 0) + 1; }); return o; };\n    const pre = pairs.map(c => Number(c.tnssPre)), post = pairs.map(c => Number(c.tnssPost));\n    const tt = paired(pre, post);\n    const drop = pairs.map(c => c.tnssPre ? (c.tnssPre - c.tnssPost) / c.tnssPre * 100 : 0);\n    const resp = drop.filter(v => v >= 50).length;\n    const worse = pairs.filter(c => c.tnssPost > c.tnssPre).length;\n    const byGroup = fn => {\n      const g = {};\n      pairs.forEach((c, i) => { const k = fn(c); (g[k] = g[k] || []).push({ pre: pre[i], post: post[i], drop: drop[i] }); });\n      return Object.keys(g).map(k => ({ k, n: g[k].length, pre: r1(mean(g[k].map(x => x.pre))), post: r1(mean(g[k].map(x => x.post))), drop: r1(mean(g[k].map(x => x.drop))) }))\n        .sort((a, b) => b.n - a.n);\n    };\n    // RCQ-36 จับคู่ก่อน–หลังด้วย HN\n    const rp = {}, rq = {};\n    (s.rcqRows || []).forEach(r => {\n      const hn = this.hnKeyOf(r['HN']), tot = Number(r['คะแนนรวม (34-170)']);\n      if (!hn || !tot) return;\n      if (String(r['ครั้งที่ประเมิน']).includes('หลัง')) rq[hn] = r; else rp[hn] = r;\n    });\n    const rh = Object.keys(rq).filter(h => rp[h]);\n    const rPre = rh.map(h => Number(rp[h]['คะแนนรวม (34-170)'])), rPost = rh.map(h => Number(rq[h]['คะแนนรวม (34-170)']));\n    const rt = paired(rPre, rPost);\n    const rDom = RCQ_DOMAINS.map(d => {\n      const col = 'คะแนนด้าน ' + d.no + ' ' + d.title;\n      const a = rh.map(h => Number(rp[h][col])).filter(v => v > 0), b = rh.map(h => Number(rq[h][col])).filter(v => v > 0);\n      const k = d.items.length || 1;\n      return { k: 'ด้าน ' + d.no + ' ' + d.title, pre: a.length ? r2(mean(a) / k) : null, post: b.length ? r2(mean(b) / k) : null };\n    }).filter(x => x.pre != null && x.post != null);\n    const ae = all.filter(c => c.ae && c.ae !== 'ไม่มี');\n    const dates = all.map(c => c.date).filter(Boolean).sort();\n    return {\n      n: all.length, nPair: pairs.length,\n      period: dates.length ? this.thaiDate(dates[0]) + ' – ' + this.thaiDate(dates[dates.length - 1]) : 'ไม่ระบุ',\n      sex: count(all, c => c.sex || 'ไม่ระบุ'), age: count(all, c => band(c.age)), thatu: count(all, c => thatuOf(c.thatu)), predom: count(all, c => c.predom || 'ไม่ระบุ'),\n      ageMean: r1(mean(all.map(c => Number(c.age)).filter(v => v > 0))),\n      tnss: { pre: r2(mean(pre)), preSd: r2(sd(pre)), post: r2(mean(post)), postSd: r2(sd(post)), md: r2(tt.md), t: tt.t == null ? null : r2(tt.t), p: tt.p, pTxt: pTxt(tt.p), drop: r1(mean(drop)), resp, respPct: pairs.length ? r1(resp / pairs.length * 100) : 0, worse },\n      byThatu: byGroup(c => thatuOf(c.thatu)), byPredom: byGroup(c => c.predom || 'ไม่ระบุ'),\n      rcq: { n: rh.length, pre: r1(mean(rPre)), preSd: r1(sd(rPre)), post: r1(mean(rPost)), postSd: r1(sd(rPost)), md: r1(rt.md), t: rt.t == null ? null : r2(rt.t), p: rt.p, pTxt: pTxt(rt.p), dom: rDom },\n      ae: { n: ae.length, pct: all.length ? r1(ae.length / all.length * 100) : 0, list: count(ae, c => c.ae) }\n    };\n  }\n\n  /** ตารางผลการศึกษา (Markdown) จากสถิติที่โค้ดคำนวณ */\n  r2rTablesMd(st) {\n    const pct = (v, n) => n ? Math.round(v / n * 1000) / 10 : 0;\n    const dist = (o, n) => Object.keys(o).sort((a, b) => o[b] - o[a]).map(k => '| ' + k + ' | ' + o[k] + ' | ' + pct(o[k], n) + ' |').join('\\n');\n    const T = st.tnss, R = st.rcq;\n    let md = '### ตารางที่ 1 ข้อมูลทั่วไปของผู้ป่วย (n = ' + st.n + ')\\n| ลักษณะ | จำนวน | ร้อยละ |\\n|---|---|---|\\n'\n      + '| **เพศ** | | |\\n' + dist(st.sex, st.n) + '\\n| **ช่วงอายุ** (เฉลี่ย ' + st.ageMean + ' ปี) | | |\\n' + dist(st.age, st.n)\n      + '\\n| **ธาตุเจ้าเรือน** | | |\\n' + dist(st.thatu, st.n) + '\\n| **อาการเด่น** | | |\\n' + dist(st.predom, st.n) + '\\n\\n'\n      + '### ตารางที่ 2 เปรียบเทียบคะแนน TNSS ก่อนและหลังการสุมยา (n = ' + st.nPair + ')\\n| ตัวแปร | ก่อน (Mean ± SD) | หลัง (Mean ± SD) | ผลต่างเฉลี่ย | t | p-value |\\n|---|---|---|---|---|---|\\n'\n      + '| TNSS (0–12) | ' + T.pre + ' ± ' + T.preSd + ' | ' + T.post + ' ± ' + T.postSd + ' | ' + T.md + ' | ' + (T.t == null ? '—' : T.t) + ' | ' + T.pTxt + ' |\\n\\n'\n      + 'TNSS ลดลงเฉลี่ยร้อยละ ' + T.drop + ' · ผู้ป่วยที่ TNSS ลดลงอย่างน้อยร้อยละ 50 จำนวน ' + T.resp + ' ราย (ร้อยละ ' + T.respPct + ') · อาการแย่ลง ' + T.worse + ' ราย\\n\\n'\n      + '### ตารางที่ 3 ผลการรักษาแยกตามธาตุเจ้าเรือน\\n| ธาตุ | n | TNSS ก่อน | TNSS หลัง | ลดลง (%) |\\n|---|---|---|---|---|\\n'\n      + st.byThatu.map(g => '| ' + g.k + ' | ' + g.n + ' | ' + g.pre + ' | ' + g.post + ' | ' + g.drop + ' |').join('\\n') + '\\n\\n'\n      + '### ตารางที่ 4 ผลการรักษาแยกตามอาการเด่น\\n| อาการเด่น | n | TNSS ก่อน | TNSS หลัง | ลดลง (%) |\\n|---|---|---|---|---|\\n'\n      + st.byPredom.map(g => '| ' + g.k + ' | ' + g.n + ' | ' + g.pre + ' | ' + g.post + ' | ' + g.drop + ' |').join('\\n') + '\\n\\n';\n    if (R.n) {\n      md += '### ตารางที่ 5 เปรียบเทียบคุณภาพชีวิต RCQ-36 ก่อนและหลังการรักษา (n = ' + R.n + ')\\n| ตัวแปร | ก่อน (Mean ± SD) | หลัง (Mean ± SD) | ผลต่างเฉลี่ย | t | p-value |\\n|---|---|---|---|---|---|\\n'\n        + '| คะแนนรวม (34–170) | ' + R.pre + ' ± ' + R.preSd + ' | ' + R.post + ' ± ' + R.postSd + ' | ' + R.md + ' | ' + (R.t == null ? '—' : R.t) + ' | ' + R.pTxt + ' |\\n'\n        + R.dom.map(d => '| ' + d.k + ' (เฉลี่ยต่อข้อ) | ' + d.pre + ' | ' + d.post + ' | ' + Math.round((d.pre - d.post) * 100) / 100 + ' | | |').join('\\n') + '\\n\\nคะแนน RCQ-36 ยิ่งต่ำยิ่งดี (ผลกระทบต่อคุณภาพชีวิตน้อย)\\n\\n';\n    } else {\n      md += '### ตารางที่ 5 คุณภาพชีวิต RCQ-36\\nยังไม่มีผู้ป่วยที่ประเมิน RCQ-36 ครบทั้งก่อนและหลังการรักษา\\n\\n';\n    }\n    md += '### ตารางที่ 6 เหตุการณ์ไม่พึงประสงค์\\n' + (st.ae.n\n      ? '| เหตุการณ์ | จำนวน |\\n|---|---|\\n' + Object.keys(st.ae.list).map(k => '| ' + k + ' | ' + st.ae.list[k] + ' |').join('\\n') + '\\n\\nรวม ' + st.ae.n + ' ราย (ร้อยละ ' + st.ae.pct + ')\\n'\n      : 'ไม่พบเหตุการณ์ไม่พึงประสงค์\\n');\n    md += '\\n*สถิติ: paired t-test สองทาง ระดับนัยสำคัญ 0.05 · ตัวเลขทั้งหมดคำนวณโดยระบบจากข้อมูลในชีต*';\n    return md;\n  }\n\n  async buildR2R() {\n    if (this.state.r2rBusy) return;\n    const st = this.researchStats();\n    if (!st.n) { this.setState({ r2rMsg: 'ยังไม่มีข้อมูลเคสในชีตให้สร้างรายงาน', r2rMd: '# ร่างรายงาน R2R\\nยังไม่มีข้อมูลเคสในชีต', r2rModal: true }); return; }\n    this.setState({ r2rModal: false });\n    const tables = this.r2rTablesMd(st);\n    const facts = JSON.stringify({\n      จำนวนผู้ป่วย: st.n, จับคู่TNSSได้: st.nPair, ช่วงเวลา: st.period, อายุเฉลี่ย: st.ageMean,\n      เพศ: st.sex, ธาตุ: st.thatu, อาการเด่น: st.predom,\n      TNSS: { ก่อน: st.tnss.pre + '±' + st.tnss.preSd, หลัง: st.tnss.post + '±' + st.tnss.postSd, ผลต่าง: st.tnss.md, t: st.tnss.t, p: st.tnss.pTxt, ลดลงเฉลี่ยร้อยละ: st.tnss.drop, ลดลงอย่างน้อย50: st.tnss.resp + ' ราย (' + st.tnss.respPct + '%)', แย่ลง: st.tnss.worse },\n      แยกตามธาตุ: st.byThatu, แยกตามอาการเด่น: st.byPredom,\n      RCQ36: st.rcq.n ? { n: st.rcq.n, ก่อน: st.rcq.pre + '±' + st.rcq.preSd, หลัง: st.rcq.post + '±' + st.rcq.postSd, ผลต่าง: st.rcq.md, p: st.rcq.pTxt, รายด้าน: st.rcq.dom } : 'ไม่มีข้อมูลจับคู่',\n      เหตุการณ์ไม่พึงประสงค์: st.ae\n    });\n    const ctx = 'เขียนร่างผลงานวิจัย R2R ภาษาไทยเชิงวิชาการ เรื่องการสุมยาสมุนไพร 5 ชนิด (ขิง มะแขว่น ข่า ผิวมะกรูด ดอกปีบ) '\n      + 'ในผู้ป่วยโรคจมูกอักเสบภูมิแพ้ คลินิกแพทย์แผนไทย รพ.ปากชม จ.เลย ใช้แบบวัด TNSS และ RCQ-36 การศึกษาแบบกลุ่มเดียววัดก่อน–หลัง\\n'\n      + 'ใช้คำว่า \"สุมยา\" เท่านั้น ห้ามใช้ \"สุ่มยา\" · ใช้เฉพาะตัวเลขต่อไปนี้ ห้ามแต่งตัวเลขใหม่ · ถ้า p ≥ 0.05 ห้ามสรุปว่าได้ผล · ถ้า n < 30 ให้ระบุเป็นข้อจำกัด\\n'\n      + 'ข้อมูล: ' + facts + '\\n\\nตอบเป็น Markdown เฉพาะหัวข้อที่ขอ ห้ามใส่ตาราง ห้ามเกริ่นนำ เขียนให้จบประโยคสมบูรณ์ และพิมพ์ [จบ] เป็นบรรทัดสุดท้ายเสมอ\\n';\n    // แบ่งเป็นส่วนเล็ก ส่วนละ 1–2 หัวข้อ กันคำตอบยาวเกินขีดจำกัดแล้วถูกตัด\n    const SECTIONS = [\n      { h: ['บทคัดย่อ'], ask: w => '# ชื่อเรื่อง (1 บรรทัด)\\n## บทคัดย่อ (ไม่เกิน ' + w + ' คำ ครอบคลุมวัตถุประสงค์ วิธีการ ผล สรุป)', w: 150 },\n      { h: ['ความเป็นมา', 'วัตถุประสงค์'], ask: w => '## ความเป็นมาและความสำคัญ (ไม่เกิน ' + w + ' คำ)\\n## วัตถุประสงค์ (2–3 ข้อสั้นๆ)', w: 90 },\n      { h: ['วิธีการศึกษา'], ask: w => '## วิธีการศึกษา (ไม่เกิน ' + w + ' คำ: กลุ่มตัวอย่าง เครื่องมือ TNSS และ RCQ-36 การสุมยา สถิติ paired t-test)', w: 90 },\n      { h: ['ผลการศึกษา'], ask: w => '## ผลการศึกษา (ไม่เกิน ' + w + ' คำ อ้างถึงตารางที่ 1–6)', w: 80 },\n      { h: ['อภิปรายผล'], ask: w => '## อภิปรายผล (ไม่เกิน ' + w + ' คำ อ้างหลักรสยาและตรีธาตุตามเวชกรรมไทย)', w: 110 },\n      { h: ['สรุป', 'ข้อจำกัด'], ask: w => '## สรุปและข้อเสนอแนะ (ไม่เกิน ' + w + ' คำ)\\n## ข้อจำกัด (3 ข้อสั้นๆ)', w: 70 }\n    ];\n    this.setState({ r2rBusy: true, r2rMsg: '', r2rStart: Date.now(), r2rElapsed: 0, r2rDone: 0, r2rTotal: SECTIONS.length });\n    clearInterval(this._r2rTick);\n    this._r2rTick = setInterval(() => this.setState({ r2rElapsed: Math.floor((Date.now() - this.state.r2rStart) / 1000) }), 1000);\n    const withTimeout = (p, ms, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('หมดเวลารอ ' + label)), ms))]);\n    const call = async prompt => {\n      let why = '';\n      if (window.claude && window.claude.complete) {\n        try { const c = await withTimeout(Promise.resolve(window.claude.complete(prompt)), 120000, 'Claude'); if (c) return { out: String(c).trim(), via: 'Claude' }; }\n        catch (e) { why = e.message; }\n      }\n      if (this.state.url) {\n        try {\n          const r = await withTimeout(this.post({ action: 'ai', mode: 'report', prompt }), 120000, 'Apps Script');\n          if (r && r.ok && r.text) return { out: String(r.text).trim(), via: r.via || 'AI' };\n          if (r && r.error) why = r.error;\n        } catch (e) { why = e.message; }\n      }\n      return { out: '', via: '', why };\n    };\n    let out = '', via = '', why = '';\n    const hasHead = (t, k) => new RegExp('^#{1,3}\\\\s*' + k, 'm').test(t);\n    // ตัดประโยคที่ขาดท้ายทิ้ง ย้อนไปถึงช่องว่าง/จุด/บรรทัดสุดท้ายที่สมบูรณ์\n    const trimTail = t => {\n      const cut = Math.max(t.lastIndexOf('\\n'), t.lastIndexOf(' '), t.lastIndexOf('.'), t.lastIndexOf(')'));\n      return cut > t.length * 0.6 ? t.slice(0, cut).trim() : t.trim();\n    };\n    const runSection = async sec => {\n      let w = sec.w, last = null;\n      for (let attempt = 0; attempt < 2; attempt++) {\n        const r = await call(ctx + sec.ask(w));\n        if (!r.out) { last = r; break; }\n        const complete = /\\[จบ\\]\\s*$/.test(r.out) && sec.h.every(k => hasHead(r.out, k));\n        const text = r.out.replace(/\\n?\\s*\\[จบ\\]\\s*$/, '').trim();\n        last = { out: text, via: r.via, complete };\n        if (complete) break;\n        w = Math.round(w * 0.6); // ถูกตัด → ขอใหม่ให้สั้นลง\n      }\n      this.setState(s => ({ r2rDone: (s.r2rDone || 0) + 1 }));\n      if (last && last.out && !last.complete) last.out = trimTail(last.out);\n      return last || { out: '' };\n    };\n    try {\n      // เรียกพร้อมกันทีละ 3 ส่วน\n      const res = [];\n      for (let i = 0; i < SECTIONS.length; i += 3) {\n        const batch = await Promise.all(SECTIONS.slice(i, i + 3).map(runSection));\n        res.push(...batch);\n      }\n      via = (res.find(r => r.via) || {}).via || '';\n      why = (res.find(r => r.why) || {}).why || '';\n      out = res.map((r, i) => r.out || SECTIONS[i].ask(SECTIONS[i].w).split('\\n').map(l => l.replace(/\\s*\\(.*\\)\\s*$/, '')).join('\\n(ให้ผู้วิจัยเขียนเพิ่ม)\\n') + '\\n(ให้ผู้วิจัยเขียนเพิ่ม)')\n        .join('\\n\\n').replace(/สุ่มยา/g, 'สุมยา').replace(/\\[จบ\\]/g, '');\n      if (!res.some(r => r.out)) via = 'แม่แบบของระบบ (AI ไม่ตอบ' + (why ? ': ' + why : '') + ')';\n      const need = ['บทคัดย่อ', 'ความเป็นมา', 'วัตถุประสงค์', 'วิธีการศึกษา', 'ผลการศึกษา', 'อภิปรายผล', 'สรุป', 'ข้อจำกัด'];\n      const miss = need.filter(k => !hasHead(out, k));\n      const cutN = res.filter(r => r.out && r.complete === false).length;\n      const warn = [];\n      if (miss.length) warn.push('ไม่มีหัวข้อ: ' + miss.join(', '));\n      if (cutN) warn.push(cutN + ' ส่วนถูกตัดท้าย ระบบตัดประโยคที่ขาดออกแล้ว');\n      if (warn.length) this.setState({ r2rMsg: 'ควรตรวจทาน — ' + warn.join(' · ') });\n      // แทรกตารางที่ระบบคำนวณไว้หลังหัวข้อผลการศึกษา\n      const lines = out.split('\\n');\n      const at = lines.findIndex(l => /^#{1,3}\\s*ผลการศึกษา/.test(l.trim()));\n      let md;\n      if (at >= 0) {\n        let end = lines.findIndex((l, i) => i > at && /^#{1,2}\\s/.test(l.trim()));\n        if (end < 0) end = lines.length;\n        md = lines.slice(0, end).join('\\n') + '\\n\\n' + tables + '\\n\\n' + lines.slice(end).join('\\n');\n      } else md = out + '\\n\\n## ผลการศึกษา\\n' + tables;\n      this.setState({ r2rMd: md, r2rVia: via, r2rModal: true });\n    } finally {\n      clearInterval(this._r2rTick);\n      this.setState({ r2rBusy: false });\n    }\n  }\n\n  downloadR2RPdf() {\n    const esc = x => String(x == null || x === '' ? '—' : x).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n    const today = this.thaiDate(new Date().toISOString().slice(0, 10));\n    const body = '<div class=\"draft\">ร่างรายงานจาก AI — ต้องตรวจทานโดยผู้วิจัยก่อนนำไปใช้<\u002Fdiv><div class=\"adv r2r\">' + this.adviceToHtml(this.state.r2rMd || '', esc) + '<\u002Fdiv>'\n      + '<div class=\"foot\">สร้างโดย PCH-SumYa AI · ' + esc(today) + ' · เรียบเรียงโดย ' + esc(this.state.r2rVia) + ' · ตัวเลขและสถิติคำนวณโดยระบบจากข้อมูลในชีต ไม่ได้ส่งชื่อและ HN ให้ AI<\u002Fdiv>';\n    const css = '*{box-sizing:border-box}body{margin:0;font-family:\"Bai Jamjuree\",sans-serif;font-size:12.5pt;color:#14201B;line-height:1.6}'\n      + '.draft{text-align:center;font-size:10pt;color:#9A5A16;border:1px dashed #D9A45A;background:#FDF4E6;border-radius:6px;padding:5px;margin-bottom:12px}'\n      + '.r2r h1{font-family:\"Bai Jamjuree\",sans-serif;font-size:17pt;text-align:center;color:#0F3327;margin:4px 0 14px;line-height:1.4}'\n      + '.r2r h2{font-family:\"Bai Jamjuree\",sans-serif;font-size:13.5pt;color:#0F3327;border-bottom:1.5px solid #D9C89E;padding-bottom:3px;margin:22px 0 8px}'\n      + '.r2r h3{font-family:\"Bai Jamjuree\",sans-serif;font-size:12pt;color:#16543F;margin:16px 0 6px}'\n      + '.r2r p{margin:0 0 8px;text-align:justify}.r2r ul,.r2r ol{margin:0 0 8px;padding-left:22px}'\n      + '.r2r table.md{width:100%;border-collapse:collapse;margin:6px 0 10px;border:1px solid #D9C89E}.r2r table.md th,.r2r table.md td{border:1px solid #E6DAB9;padding:5px 8px;text-align:center;vertical-align:middle}'\n      + '.r2r table.md thead th{background:#0F3327;color:#F7F2E7;font-weight:600}.r2r table.md tbody tr:nth-child(even) td{background:#FAF6EC}.r2r table.md td.num{text-align:center;font-variant-numeric:tabular-nums}'\n      + '.foot{margin-top:22px;font-size:9.5pt;color:#8A7F66;border-top:1px solid #EFE8D6;padding-top:6px}'\n      + 'h2,h3{break-after:avoid;page-break-after:avoid}tr{break-inside:avoid}p,li{orphans:3;widows:3}';\n    let view = null;\n    try {\n      view = window.open('', '_blank');\n      if (view && view.document) { view.document.write('<!doctype html><meta charset=\"utf-8\"><title>กำลังสร้าง PDF…<\u002Ftitle><body style=\"margin:0;display:grid;place-items:center;height:100vh;font-family:sans-serif;color:#0F3327;background:#F4EEDE\">กำลังสร้างไฟล์ PDF…<\u002Fbody>'); view.document.close(); }\n    } catch (e) { view = null; }\n    this.savePdfDirect(body, css, 'ร่างรายงาน R2R ' + today, view).catch(err => {\n      try { if (view) view.close(); } catch (e) {}\n      this.setState({ pdfBusy: false, r2rMsg: 'สร้าง PDF ไม่สำเร็จ: ' + (err && err.message || '') });\n    });\n  }\n\n  async askData(qText) {\n    const q = String(qText != null ? qText : this.state.dq).trim();\n    if (!q || this.state.dqBusy) return;\n    const d = this.dataDigest();\n    if (!d.n) { this.setState({ dqAns: '', dqNote: 'ยังไม่มีข้อมูลเคสในชีตให้วิเคราะห์' }); return; }\n    const prompt = 'คำถาม: ' + q + '\\n\\nข้อมูลเคสทั้งหมด ' + d.n + ' เคส (ไม่ระบุตัวตน · คั่นด้วย |):\\n' + d.text;\n    this.setState({ dq: q, dqBusy: true, dqAns: '', dqNote: '', dqFolded: false, dqStart: Date.now(), dqElapsed: 0 });\n    clearInterval(this._dqTick);\n    this._dqTick = setInterval(() => this.setState({ dqElapsed: Math.floor((Date.now() - this.state.dqStart) / 1000) }), 1000);\n    const withTimeout = (p, ms, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('หมดเวลารอ ' + label)), ms))]);\n    let out = '', via = '', why = '';\n    try {\n      if (window.claude && window.claude.complete) {\n        try {\n          const sys = 'คุณเป็นนักวิเคราะห์ข้อมูลงานวิจัย R2R ของคลินิกแพทย์แผนไทย ตอบจากข้อมูลที่แนบเท่านั้น ห้ามแต่งตัวเลข บอก n ของแต่ละกลุ่ม เตือนถ้า n<5 ตอบภาษาไทยไม่เกิน 180 คำ Markdown บรรทัดแรกคำตอบสรุปตัวหนา ตามด้วยหัวข้อย่อยหรือตารางเล็ก TNSS ยิ่งน้อยยิ่งดี TNSSลด% และ RCQดีขึ้น% ยิ่งมากยิ่งดี\\n\\n';\n          const c = await withTimeout(Promise.resolve(window.claude.complete(sys + prompt)), 90000, 'Claude');\n          if (c) { out = String(c).trim(); via = 'Claude'; }\n        } catch (e) { why = n      + '## 3. เหตุผลการปรับตำรับ (อ้างหลักฐานวิชาการพร้อมที่มา) · ## 4. ข้อควรระวังและการติดตามผล · ห้ามใช้อีโมจิและ code block · ข้อมูลเคส: ' + JSON.stringify(ctx);\n    const previewPrompt = prompt + '\\n\\n' + HERB_REFS;\n    const withTimeout = (p, ms, label) => Promise.race([\n      p, new Promise((_, rej) => setTimeout(() => rej(new Error('หมดเวลารอ ' + label)), ms))\n    ]);\n    let out = '', via = '', why = '';\n    try {\n      // 0) เปิดในโหมด Claude (หน้าตัวอย่าง) → ใช้ Claude ก่อน\n      if (window.claude && window.claude.complete) {\n        this.setState({ aiStage: 'claude' });\n        try {\n          const c = await withTimeout(Promise.resolve(window.claude.complete(previewPrompt)), 90000, 'Claude');\n          if (c) { out = String(c).trim(); via = 'Claude'; }\n        } catch (e) { why = e.message; }\n      }\n      // 1) Claude (สำรอง Gemini) ผ่าน Apps Script — ช่องทางหลักในระบบจริง\n      if (!out && this.state.url) {\n        this.setState({ aiStage: 'server' });\n        try {\n          const r = await withTimeout(this.post({ action: 'ai', prompt: prompt }), 90000, 'Apps Script');\n          if (r && r.ok && r.text) { out = r.text; via = r.via || 'AI'; }\n          else if (r && r.error) why = r.error;\n        } catch (e) { why = e.message; }\n      }\n      if (out) {\n        this.setState({ advice: String(out).trim(), aiNote: 'วิเคราะห์โดย ' + via + ' · คำแนะนำจากกฎถูกบันทึกลงชีตเป็นหลักฐาน' });\n      } else {\n        this.setState({ aiNote: 'ใช้คำแนะนำจากกฎ' + (why ? ' · ' + why : '') });\n      }\n    } finally {\n      clearInterval(this._aiTick);\n      this.setState({ aiBusy: false, aiStage: '' });\n    }\n  }\n\n  /** ข้อความคำแนะนำสำหรับคัดลอก/แชร์ — ไม่มีชื่อหรือ HN */\n  adviceText() {\n    const rule = this._next ? this._next : this.ruleAdvice().next;\n    return ['คำแนะนำปรับตำรับยาสุมยา · PCH-SumYa AI',\n      'วันที่ ' + this.thaiDate(new Date().toISOString().slice(0, 10)),\n      '',\n      this.state.advice || this.ruleAdvice().text,\n      '',\n      'ตำรับครั้งถัดไป: ' + this.formulaText(rule)\n    ].join('\\n');\n  }\n\n  /** คัดลอกข้อความอย่างปลอดภัย — ถอยไปใช้ textarea ถ้า clipboard API ถูกบล็อก */\n  copyText(text, flag, failNote) {\n    const ok = () => { this.setState({ [flag]: true }); setTimeout(() => this.setState({ [flag]: false }), 2200); };\n    const legacy = () => {\n      try {\n        const ta = document.createElement('textarea');\n        ta.value = text;\n        ta.style.cssText = 'position:fixed;top:-9999px;opacity:0;';\n        document.body.appendChild(ta);\n        ta.focus(); ta.select();\n        const done = document.execCommand('copy');\n        document.body.removeChild(ta);\n        if (done) { ok(); return; }\n      } catch (e) {}\n      this.setState({ [flag]: false });\n      if (failNote) this.setState({ [failNote.key]: failNote.msg });\n    };\n    try {\n      if (navigator.clipboard && navigator.clipboard.writeText) {\n        navigator.clipboard.writeText(text).then(ok, legacy);\n      } else legacy();\n    } catch (e) { legacy(); }\n  }\n\n  /** HTML คำแนะนำสำหรับการ์ดในแอป — ใส่สไตล์ในแท็กโดยตรง */\n  adviceCardHtml(src) {\n    const esc = x => String(x == null ? '' : x).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n    return this.adviceToHtml(src, esc)\n      .replace(/<table class=\"md\">/g, '<table style=\"width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13.5px;background:#FFF;border:1px solid #E0D5B8;border-radius:10px;overflow:hidden\">')\n      .replace(/<th>/g, '<th style=\"text-align:center;vertical-align:middle;padding:8px 11px;background:#E6F0EA;color:#16543F;font-weight:600;border-bottom:1px solid #CFE0D5\">')\n      .replace(/<td class=\"num\">/g, '<td style=\"padding:8px 11px;border-top:1px solid #EFE8D6;text-align:center;vertical-align:middle;font-variant-numeric:tabular-nums;white-space:nowrap\">')\n      .replace(/<td>/g, '<td style=\"padding:8px 11px;border-top:1px solid #EFE8D6;text-align:center;vertical-align:middle\">')\n      .replace(/<h3>/g, '<h3 style=\"margin:16px 0 6px;font-size:15.5px;font-weight:700;color:#0F3327\">')\n      .replace(/<p>/g, '<p style=\"margin:0 0 9px\">')\n      .replace(/<ul>/g, '<ul style=\"margin:0 0 10px;padding-left:20px\">')\n      .replace(/<ol>/g, '<ol style=\"margin:0 0 10px;padding-left:20px\">')\n      .replace(/<li>/g, '<li style=\"margin:2px 0\">')\n      .replace(/<b>/g, '<b style=\"color:#0F3327;font-weight:600\">');\n  }\n\n  /** แปลงข้อความคำแนะนำ (Markdown แบบง่าย) เป็น HTML — ตาราง · หัวข้อ · รายการ · ตัวหนา */\n  adviceToHtml(src, esc) {\n    const inline = s => esc(s).replace(/\\*\\*(.+?)\\*\\*/g, '<b>$1<\u002Fb>').replace(/(^|[^*])\\*(?!\\s)(.+?)\\*(?!\\*)/g, '$1<i>$2<\u002Fi>').replace(/`(.+?)`/g, '$1');\n    const cells = l => l.trim().replace(/^\\|/, '').replace(/\\|$/, '').split('|').map(c => c.trim());\n    const isSep = l => /^\\s*\\|?\\s*:?-{2,}:?\\s*(\\|\\s*:?-{2,}:?\\s*)*\\|?\\s*$/.test(l);\n    const isRow = l => /^\\s*\\|.*\\|\\s*$/.test(l) || (l.split('|').length >= 3 && /\\|/.test(l.trim().slice(1, -1)));\n    const numLike = c => /^[-+]?\\d[\\d,.]*\\s*(%|คะแนน|ครั้ง|กรัม|ซม\\.?|นาที)?$/.test(c);\n    const lines = String(src || '').replace(/\\r/g, '').split('\\n');\n    const out = [];\n    let i = 0, list = null, para = [];\n    const flushPara = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '<\u002Fp>'); para = []; } };\n    const flushList = () => { if (list) { out.push('<' + list.tag + '>' + list.items.map(x => '<li>' + inline(x) + '<\u002Fli>').join('') + '<\u002F' + list.tag + '>'); list = null; } };\n    while (i < lines.length) {\n      const l = lines[i];\n      // ตาราง: แถวหัว + แถวคั่น (---) หรือ แถว | ต่อกันตั้งแต่ 2 แถว\n      if (isRow(l) && i + 1 < lines.length && (isSep(lines[i + 1]) || isRow(lines[i + 1]))) {\n        flushPara(); flushList();\n        const head = cells(l);\n        let j = i + 1;\n        const hasSep = isSep(lines[j]);\n        if (hasSep) j++;\n        const body = [];\n        while (j < lines.length && isRow(lines[j]) && !isSep(lines[j])) { body.push(cells(lines[j])); j++; }\n        const n = Math.max(head.length, ...body.map(r => r.length));\n        const pad = r => { const a = r.slice(); while (a.length < n) a.push(''); return a; };\n        const hRow = hasSep ? pad(head) : null;\n        const rows = hasSep ? body : [head].concat(body);\n        let h = '<table class=\"md\">';\n        if (hRow) h += '<thead><tr>' + hRow.map(c => '<th>' + inline(c) + '<\u002Fth>').join('') + '<\u002Ftr><\u002Fthead>';\n        h += '<tbody>' + rows.map(r => '<tr>' + pad(r).map(c => '<td' + (numLike(c) ? ' class=\"num\"' : '') + '>' + inline(c) + '<\u002Ftd>').join('') + '<\u002Ftr>').join('') + '<\u002Ftbody><\u002Ftable>';\n        out.push(h);\n        i = j;\n        continue;\n      }\n      if (isSep(l) || /^\\s*```/.test(l)) { i++; continue; }\n      const hm = l.match(/^\\s*#{1,6}\\s+(.*)$/);\n      if (hm) { flushPara(); flushList(); out.push('<h3>' + inline(hm[1]) + '<\u002Fh3>'); i++; continue; }\n      const bm = l.match(/^\\s*(?:[-*•·]|\\u2022)\\s+(.*)$/);\n      const om = l.match(/^\\s*(\\d+)[.)]\\s+(.*)$/);\n      if (bm || om) {\n        flushPara();\n        const tag = bm ? 'ul' : 'ol';\n        if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }\n        list.items.push(bm ? bm[1] : om[2]);\n        i++; continue;\n      }\n      if (!l.trim()) { flushPara(); flushList(); i++; continue; }\n      flushList();\n      para.push(l.trim());\n      i++;\n    }\n    flushPara(); flushList();\n    // ผูกหัวข้อกับตาราง/รายการที่ตามมา ไม่ให้หัวข้อค้างท้ายหน้า · ตารางยาวเกิน 14 แถวให้ตัดหน้าได้ (หัวตารางซ้ำให้)\n    const merged = [];\n    for (let k = 0; k < out.length; k++) {\n      const cur = out[k], nx = out[k + 1] || '';\n      if (/^<h3>/.test(cur) && nx && !/^<h3>/.test(nx)) {\n        const rowsN = (nx.match(/<tr>/g) ||
