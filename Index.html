document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ity: 0; transform: translateY(-26px) scaleX(1.25); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height: 100vh; background: #F2EDE1; color: #14201B; font-family: Sarabun, 'Noto Sans Thai', sans-serif; padding-bottom: 64px;\">\n\n  <header style=\"position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 14px 22px; background: #0F3327; color: #F7F2E7; box-shadow: 0 2px 18px rgba(15,51,39,.28);\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-right: auto;\">\n      <div style=\"width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(150deg, #C4772C, #1E6B54); display: grid; place-items: center; font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 700; font-size: 17px; color: #0F3327;\">ส<\u002Fdiv>\n      <div style=\"line-height: 1.25;\">\n        <div style=\"font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: .2px;\">Thai-SumaAI<\u002Fdiv>\n        <div style=\"font-size: 12px; opacity: .72;\">โรงพยาบาลปากชม จังหวัดเลย · กลุ่มงานแพทย์แผนไทย<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"display: flex; flex-wrap: wrap; gap: 6px; padding: 4px; background: rgba(247,242,231,.1); border-radius: 12px;\">\n      <button type=\"button\" sc-camel-on-click=\"{{ goDash }}\" style=\"{{ tabDash }}\">แดชบอร์ด R2R<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ goTp }}\" style=\"{{ tabTp }}\">โหมด พท.<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ goPatient }}\" style=\"{{ tabPatient }}\">โหมดผู้ป่วย<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ goSet }}\" style=\"{{ tabSet }}\">ตั้งค่า<\u002Fbutton>\n    <\u002Fnav>\n    <div style=\"display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 7px 12px; border-radius: 999px; background: rgba(247,242,231,.12);\">\n      <span style=\"width: 9px; height: 9px; border-radius: 50%; background: {{ linkDot }}; animation: suma-pulse 2.4s ease-in-out infinite;\"><\u002Fspan>\n      <span>{{ linkText }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ─────────── แดชบอร์ด R2R ─────────── -->\n  <sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ true }}\">\n    <main data-screen-label=\"แดชบอร์ด R2R\" style=\"max-width: 1240px; margin: 0 auto; padding: 26px 22px 0;\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; margin-bottom: 20px;\">\n        <div style=\"margin-right: auto;\">\n          <div style=\"font-size: 12px; letter-spacing: 2.4px; text-transform: uppercase; color: #8A7F66; font-weight: 600;\">Routine to Research<\u002Fdiv>\n          <h1 style=\"margin: 4px 0 6px; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 34px; font-weight: 700; line-height: 1.15;\">ผลลัพธ์หัตถการสุ่มยาสมุนไพร<\u002Fh1>\n          <p style=\"margin: 0; max-width: 62ch; color: #4E5A51; font-size: 15px;\">วัดผลก่อน–หลังด้วย AI Nasal Acoustic ร่วมกับคะแนน TNSS รายวัน เพื่อสร้างหลักฐานเชิงประจักษ์ของเวชกรรมไทย<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 8px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ loadSheet }}\" style=\"padding: 11px 16px; border-radius: 11px; border: 1px solid #C9C0AB; background: #FFFDF7; font-weight: 600; cursor: pointer;\">ดึงข้อมูลจากชีต<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ goTp }}\" style=\"padding: 11px 18px; border-radius: 11px; border: none; background: #0F3327; color: #F7F2E7; font-weight: 600; cursor: pointer;\">เริ่มเคสใหม่<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px;\">\n        <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n          <div style=\"padding: 18px; border-radius: 16px; background: #FFFDF7; border: 1px solid #E4DCC8; box-shadow: 0 1px 0 rgba(20,32,27,.04);\">\n            <div style=\"font-size: 13px; color: #6B7A6F; font-weight: 500; margin-bottom: 8px;\">{{ k.label }}<\u002Fdiv>\n            <div style=\"font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 30px; font-weight: 700; color: {{ k.color }}; line-height: 1;\">{{ k.value }}<\u002Fdiv>\n            <div style=\"margin-top: 8px; font-size: 12px; color: #8A7F66;\">{{ k.note }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 18px;\">\n        <section style=\"padding: 20px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E4DCC8;\">\n          <h2 style=\"margin: 0 0 4px; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 18px; font-weight: 600;\">Nasal Patency ก่อน–หลังสุ่มยา<\u002Fh2>\n          <p style=\"margin: 0 0 18px; font-size: 13px; color: #8A7F66;\">แท่งซ้าย = ก่อน · แท่งขวา = หลัง 15 นาที<\u002Fp>\n          <div style=\"display: flex; align-items: flex-end; gap: 10px; height: 178px; padding-bottom: 6px; border-bottom: 1px solid #E4DCC8; overflow: hidden;\">\n            <sc-for list=\"{{ patencyBars }}\" as=\"b\" hint-placeholder-count=\"12\">\n              <div style=\"flex: 1 1 0; min-width: 0; display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 100%;\">\n                <div title=\"{{ b.tipPre }}\" style=\"width: 44%; height: {{ b.preH }}; border-radius: 4px 4px 0 0; background: #C9C0AB;\"><\u002Fdiv>\n                <div title=\"{{ b.tipPost }}\" style=\"width: 44%; height: {{ b.postH }}; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, #2E8C6E, #1E6B54);\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: #8A7F66;\">\n            <span>เคสที่ 1<\u002Fspan>\n            <span>ค่าเฉลี่ยเพิ่มขึ้น {{ avgGain }}% (เป้า &gt; 25%)<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"padding: 20px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E4DCC8;\">\n          <h2 style=\"margin: 0 0 4px; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 18px; font-weight: 600;\">แนวโน้ม TNSS เฉลี่ย 14 วัน<\u002Fh2>\n          <p style=\"margin: 0 0 14px; font-size: 13px; color: #8A7F66;\">คะแนนรวม 0–12 · ยิ่งต่ำยิ่งดี<\u002Fp>\n          <svg sc-camel-view-box=\"0 0 320 170\" style=\"width: 100%; height: 186px; overflow: visible;\">\n            <line x1=\"0\" y1=\"10\" x2=\"320\" y2=\"10\" stroke=\"#EFE8D6\"><\u002Fline>\n            <line x1=\"0\" y1=\"60\" x2=\"320\" y2=\"60\" stroke=\"#EFE8D6\"><\u002Fline>\n            <line x1=\"0\" y1=\"110\" x2=\"320\" y2=\"110\" stroke=\"#EFE8D6\"><\u002Fline>\n            <line x1=\"0\" y1=\"160\" x2=\"320\" y2=\"160\" stroke=\"#E4DCC8\"><\u002Fline>\n            <polyline points=\"{{ tnssArea }}\" fill=\"rgba(30,107,84,.12)\" stroke=\"none\"><\u002Fpolyline>\n            <polyline points=\"{{ tnssPoints }}\" fill=\"none\" stroke=\"#1E6B54\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpolyline>\n            <sc-for list=\"{{ tnssDots }}\" as=\"d\" hint-placeholder-count=\"14\">\n              <circle cx=\"{{ d.x }}\" cy=\"{{ d.y }}\" r=\"3.4\" fill=\"#FFFDF7\" stroke=\"#1E6B54\" stroke-width=\"2\"><\u002Fcircle>\n            <\u002Fsc-for>\n          <\u002Fsvg>\n          <div style=\"display: flex; justify-content: space-between; font-size: 12px; color: #8A7F66;\">\n            <span>วันที่ 1 · {{ tnssStart }} คะแนน<\u002Fspan>\n            <span>วันที่ 14 · {{ tnssEnd }} คะแนน ({{ tnssDrop }}%)<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n      <section style=\"padding: 20px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E4DCC8; margin-bottom: 18px;\">\n        <h2 style=\"margin: 0 0 14px; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 18px; font-weight: 600;\">กลุ่มอาการเด่น &amp; สูตรที่ AI แนะนำ<\u002Fh2>\n        <div style=\"display: grid; gap: 12px;\">\n          <sc-for list=\"{{ predomRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"display: grid; grid-template-columns: 130px 1fr 54px; align-items: center; gap: 12px;\">\n              <span style=\"font-size: 14px; font-weight: 500;\">{{ r.label }}<\u002Fspan>\n              <span style=\"height: 12px; border-radius: 999px; background: #EFE8D6; overflow: hidden; display: block;\">\n                <span style=\"display: block; height: 100%; width: {{ r.w }}; background: {{ r.color }}; border-radius: 999px;\"><\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-size: 13px; color: #4E5A51; text-align: right;\">{{ r.n }} เคส<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-radius: 18px; background: #FFFDF7; border: 1px solid #E4DCC8; overflow: hidden;\">\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 18px 20px 14px;\">\n          <h2 style=\"margin: 0; margin-right: auto; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 18px; font-weight: 600;\">ทะเบียนเคส ({{ caseCount }})<\u002Fh2>\n          <span style=\"font-size: 12px; color: #8A7F66;\">คลิกแถวเพื่อดูรายละเอียดเคส<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"overflow-x: auto;\">\n          <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px;\">\n            <sc-raw-thead>\n              <sc-raw-tr style=\"background: #F2EDE1; text-align: left; color: #4E5A51;\">\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">รหัสบันทึก<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">HN<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">ธาตุเจ้าเรือน<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600; text-align: right;\">Patency ก่อน<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600; text-align: right;\">หลัง<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600; text-align: right;\">ผลต่าง<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600; text-align: right;\">TNSS ลด<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 11px 16px; font-weight: 600;\">AE<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ caseRows }}\" as=\"c\" hint-placeholder-count=\"8\">\n                <sc-raw-tr sc-camel-on-click=\"{{ c.open }}\" style=\"border-top: 1px solid #EFE8D6; cursor: pointer;\" style-hover=\"background:#F7F2E7;\">\n                  <sc-raw-td style=\"padding: 11px 16px; font-variant-numeric: tabular-nums; color: #4E5A51;\">{{ c.id }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; font-weight: 500;\">{{ c.hn }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; color: #4E5A51;\">{{ c.thatu }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; text-align: right; font-variant-numeric: tabular-nums;\">{{ c.pre }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; text-align: right; font-variant-numeric: tabular-nums;\">{{ c.post }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; text-align: right; font-weight: 600; color: #1E6B54; font-variant-numeric: tabular-nums;\">+{{ c.gain }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; text-align: right; font-variant-numeric: tabular-nums;\">{{ c.tnssDrop }}%<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 11px 16px; color: {{ c.aeColor }};\">{{ c.ae }}<\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n\n    <sc-if value=\"{{ sel }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ closeSel }}\" style=\"position: fixed; inset: 0; z-index: 40; background: rgba(15,51,39,.44); display: flex; justify-content: flex-end;\">\n        <aside sc-camel-on-click=\"{{ stop }}\" style=\"width: min(460px, 100%); height: 100%; overflow-y: auto; background: #FFFDF7; padding: 26px; animation: suma-rise .22s ease-out;\">\n          <div style=\"display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px;\">\n            <div style=\"margin-right: auto;\">\n              <div style=\"font-size: 12px; letter-spacing: 1.6px; color: #8A7F66; font-weight: 600;\">{{ sel.id }}<\u002Fdiv>\n              <h2 style=\"margin: 4px 0 0; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 24px; font-weight: 700;\">HN {{ sel.hn }}<\u002Fh2>\n              <div style=\"font-size: 14px; color: #4E5A51;\">{{ sel.meta }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ closeSel }}\" style=\"border: 1px solid #C9C0AB; background: none; border-radius: 10px; width: 34px; height: 34px; cursor: pointer;\">✕<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px;\">\n            <div style=\"padding: 14px; border-radius: 13px; background: #F2EDE1;\">\n              <div style=\"font-size: 12px; color: #6B7A6F;\">Patency ก่อน<\u002Fdiv>\n              <div style=\"font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 25px; font-weight: 700;\">{{ sel.pre }}%<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 14px; border-radius: 13px; background: #E6F0EA;\">\n              <div style=\"font-size: 12px; color: #1E6B54;\">Patency หลัง<\u002Fdiv>\n              <div style=\"font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 25px; font-weight: 700; color: #16543F;\">{{ sel.post }}%<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; gap: 11px; font-size: 14px;\">\n            <sc-for list=\"{{ selRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n              <div style=\"display: flex; gap: 12px; padding-bottom: 9px; border-bottom: 1px dashed #E4DCC8;\">\n                <span style=\"color: #8A7F66; min-width: 150px;\">{{ r.k }}<\u002Fspan>\n                <span style=\"font-weight: 500; text-align: right; margin-left: auto;\">{{ r.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top: 18px; padding: 16px; border-radius: 14px; background: #FDF4E6; border: 1px solid #EBD9BC;\">\n            <div style=\"font-size: 12px; font-weight: 700; color: #9A5A16; letter-spacing: 1.2px; margin-bottom: 7px;\">คำแนะนำจาก AI<\u002Fdiv>\n            <div style=\"font-size: 14px; line-height: 1.65; color: #4A3A22;\">{{ sel.advice }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Faside>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <!-- ─────────── โหมด พท. ─────────── -->\n  <sc-if value=\"{{ isTp }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"โหมด พท.\" style=\"max-width: 1060px; margin: 0 auto; padding: 26px 22px 0;\">\n      <sc-if value=\"{{ inIframe }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 14px; background: #FDF4E6; border: 1px solid #EBD9BC; margin-bottom: 16px;\">\n          <span style=\"font-size: 14px; color: #7A5A18; line-height: 1.6; flex: 1 1 320px;\"><strong>ไมโครโฟนและกล้องถูกบล็อก<\u002Fstrong> เพราะหน้านี้แสดงอยู่ในกรอบ iframe — เปิดในแท็บใหม่แล้วกดอนุญาต จะใช้โมดูลอัดเสียงและ AR ได้ครบ<\u002Fspan>\n          <button type=\"button\" sc-camel-on-click=\"{{ openTop }}\" style=\"padding: 11px 17px; border-radius: 11px; border: none; background: #9A5A16; color: #FFF8EC; font-weight: 700; cursor: pointer;\">เปิดในแท็บใหม่<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px;\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <button type=\"button\" sc-camel-on-click=\"{{ s.go }}\" style=\"{{ s.style }}\">\n            <span style=\"{{ s.numStyle }}\">{{ s.n }}<\u002Fspan>\n            <span>{{ s.label }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- ขั้นที่ 1 คัดกรอง -->\n      <sc-if value=\"{{ step1 }}\" hint-placeholder-val=\"{{ true }}\">\n        <section style=\"padding: 24px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E4DCC8;\">\n          <h2 style=\"margin: 0 0 4px; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 22px; font-weight: 700;\">คัดกรองและลงทะเบียนผู้ป่วย<\u002Fh2>\n          <p style=\"margin: 0 0 20px; font-size: 14px; color: #8A7F66;\">ตรวจประเมินธาตุเจ้าเรือนตามเวชปฏิบัติ แล้วบันทึกข้อมูลพื้นฐานก่อนทำหัตถการ<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px;\">\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">HN\n              <input value=\"{{ f.hn }}\" sc-camel-on-input=\"{{ h.hn }}\" placeholder=\"เช่น 00123456\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">ชื่อ-นามสกุล\n              <input value=\"{{ f.name }}\" sc-camel-on-input=\"{{ h.name }}\" placeholder=\"ชื่อ นามสกุล\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">อายุ (ปี)\n              <input type=\"number\" value=\"{{ f.age }}\" sc-camel-on-input=\"{{ h.age }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">เพศ\n              <sc-raw-select value=\"{{ f.sex }}\" sc-camel-on-change=\"{{ h.sex }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n                <option value=\"หญิง\">หญิง<\u002Foption>\n                <option value=\"ชาย\">ชาย<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">ธาตุเจ้าเรือน\n              <sc-raw-select value=\"{{ f.thatu }}\" sc-camel-on-change=\"{{ h.thatu }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n                <option value=\"ดิน\">ดิน<\u002Foption>\n                <option value=\"น้ำ\">น้ำ<\u002Foption>\n                <option value=\"ลม\">ลม<\u002Foption>\n                <option value=\"ไฟ\">ไฟ<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">รหัส ICD-10\n              <sc-raw-select value=\"{{ f.icd }}\" sc-camel-on-change=\"{{ h.icd }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n                <option value=\"J30.1\">J30.1 · แพ้เกสรพืช<\u002Foption>\n                <option value=\"J30.2\">J30.2 · แพ้ตามฤดูกาลอื่น<\u002Foption>\n                <option value=\"J30.3\">J30.3 · แพ้จากสาเหตุอื่น<\u002Foption>\n                <option value=\"J30.4\">J30.4 · ไม่ระบุสาเหตุ<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">คลินิก/หน่วยบริการ\n              <input value=\"{{ f.clinic }}\" sc-camel-on-input=\"{{ h.clinic }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">ผู้ทำหัตถการ (พท.)\n              <input value=\"{{ f.provider }}\" sc-camel-on-input=\"{{ h.provider }}\" placeholder=\"ชื่อ พท.\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">ครั้งที่\n              <input type=\"number\" value=\"{{ f.visit }}\" sc-camel-on-input=\"{{ h.visit }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 20px; padding: 18px; border-radius: 14px; background: #FFF; border: 1px solid #E4DCC8;\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 16px;\">\n              <h3 style=\"margin: 0; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 17px; font-weight: 600;\">TNSS ก่อนทำหัตถการ<\u002Fh3>\n              <span style=\"font-size: 13px; color: #8A7F66; margin-right: auto;\">ประเมินร่วมกับผู้ป่วย ข้อละ 0–3 คะแนน<\u002Fspan>\n              <span style=\"font-size: 14px; font-weight: 700; color: #1E6B54;\">รวม {{ tnssTotal }} / 12<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px;\">\n              <sc-for list=\"{{ tnssItems }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div>\n                  <div style=\"display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px;\">\n                    <span style=\"font-weight: 600; font-size: 14px;\">{{ t.label }}<\u002Fspan>\n                    <span style=\"margin-left: auto; font-size: 12px; color: #1E6B54; font-weight: 600;\">{{ t.word }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <input type=\"range\" min=\"0\" max=\"3\" step=\"1\" value=\"{{ t.v }}\" sc-camel-on-input=\"{{ t.on }}\" style=\"width: 100%;\">\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top: 14px; font-size: 13px; color: #6B7A6F;\">กลุ่มอาการเด่นที่ระบบจับได้: <strong>{{ predomLabel }}<\u002Fstrong> — ใช้เป็นฐานให้ AI เสนอสัดส่วนตำรับยาในขั้นที่ 5<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 18px; padding: 16px; border-radius: 14px; background: #F2EDE1; border: 1px solid #E4DCC8;\">\n            <label style=\"display: flex; gap: 11px; align-items: flex-start; cursor: pointer;\">\n              <input type=\"checkbox\" checked=\"{{ f.consent }}\" sc-camel-on-change=\"{{ h.consent }}\" style=\"width: 20px; height: 20px; margin-top: 2px; accent-color: #1E6B54;\">\n              <span style=\"font-size: 14px; line-height: 1.6;\">ผู้ป่วยรับทราบและ<strong>ยินยอม<\u002Fstrong>ให้เก็บข้อมูลสุขภาพ เสียงลมหายใจ และผลประเมิน เพื่อใช้ในการรักษาและงานวิจัย R2R ตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล (PDPA)<br><span style=\"color: #8A7F66; font-size: 13px;\">ระบบจะไม่ส่งข้อมูลเข้า Google Sheet หากไม่ได้ติ๊กช่องนี้<\u002Fspan><\u002Fspan>\n            <\u002Flabel>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; align-items: center;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"padding: 13px 22px; border-radius: 12px; border: none; background: #0F3327; color: #F7F2E7; font-weight: 600; cursor: pointer;\">ถัดไป · วัดค่าก่อนสุ่มยา<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ savePatient }}\" style=\"padding: 13px 18px; border-radius: 12px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; cursor: pointer;\">บันทึกทะเบียนผู้ป่วย<\u002Fbutton>\n            <span style=\"font-size: 13px; color: #8A7F66;\">{{ qrHint }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ขั้นที่ 2 Pre-test -->\n      <sc-if value=\"{{ step2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"padding: 24px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E4DCC8;\">\n          <h2 style=\"margin: 0 0 4px; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 22px; font-weight: 700;\">Pre-Suma Test · อัดเสียงลมหายใจ<\u002Fh2>\n          <p style=\"margin: 0 0 20px; font-size: 14px; color: #8A7F66;\">ถือไมโครโฟนห่างใต้จมูกประมาณ 5 ซม. หายใจเข้า–ออกลึกทางจมูก 10 วินาที<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; align-items: start;\">\n            <div style=\"padding: 20px; border-radius: 16px; background: #0F3327; color: #F7F2E7;\">\n              <div style=\"display: flex; align-items: flex-end; gap: 2px; height: 96px; margin-bottom: 16px;\">\n                <sc-for list=\"{{ waveBars }}\" as=\"w\" hint-placeholder-count=\"48\">\n                  <span style=\"flex: 1 1 0; min-width: 0; height: {{ w.h }}; background: {{ w.c }}; border-radius: 2px;\"><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 14px;\">\n                <button type=\"button\" sc-camel-on-click=\"{{ recPre }}\" style=\"{{ recBtn }}\">{{ recLabel }}<\u002Fbutton>\n                <div style=\"font-size: 13px; opacity: .8;\">{{ recStatus }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 20px; border-radius: 16px; background: #F2EDE1; border: 1px solid #E4DCC8;\">\n              <div style=\"font-size: 13px; color: #6B7A6F; margin-bottom: 6px;\">Nasal Patency Index (ก่อนสุ่มยา)<\u002Fdiv>\n              <div style=\"font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 52px; font-weight: 700; line-height: 1; color: #0F3327;\">{{ preIndex }}<span style=\"font-size: 22px;\">%<\u002Fspan><\u002Fdiv>\n              <div style=\"display: grid; gap: 9px; margin-top: 18px; font-size: 13px;\">\n                <sc-for list=\"{{ preMetrics }}\" as=\"m\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; gap: 10px;\">\n                    <span style=\"color: #8A7F66;\">{{ m.k }}<\u002Fspan>\n                    <span style=\"margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums;\">{{ m.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top: 16px; font-size: 12px; color: #8A7F66; line-height: 1.6;\">สูตร: ค่าผสมของพลังงานเสียงรวม (RMS), จุดศูนย์ถ่วงความถี่ (Spectral Centroid) และสัดส่วนพลังงานย่านปั่นป่วน 1.5–6 kHz → ยิ่งจมูกอุดกั้น เสียงยิ่งปั่นป่วนและแหลม ค่าดัชนีจึงยิ่งต่ำ<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; margin-top: 20px;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"padding: 13px 18px; border-radius: 12px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; cursor: pointer;\">ย้อนกลับ<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"padding: 13px 22px; border-radius: 12px; border: none; background: #0F3327; color: #F7F2E7; font-weight: 600; cursor: pointer;\">ถัดไป · ตั้งตำรับยาสุ่ม<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ขั้นที่ 3 ตำรับยา -->\n      <sc-if value=\"{{ step3 }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"padding: 24px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E4DCC8;\">\n          <h2 style=\"margin: 0 0 4px; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 22px; font-weight: 700;\">ตำรับยาสุ่ม 5 ชนิด<\u002Fh2>\n          <p style=\"margin: 0 0 20px; font-size: 14px; color: #8A7F66;\">สูตรมาตรฐาน ขิง 30 / มะแขวน 25 / ข่า 20 / ผิวมะกรูด 15 / ดอกปีบ 10 — ปรับได้ตามธาตุและอาการเด่น<\u002Fp>\n          <div style=\"display: grid; gap: 16px;\">\n            <sc-for list=\"{{ herbs }}\" as=\"hb\" hint-placeholder-count=\"5\">\n              <div style=\"display: grid; grid-template-columns: minmax(150px, 210px) 1fr 62px; gap: 14px; align-items: center;\">\n                <div>\n                  <div style=\"font-weight: 600; font-size: 15px;\">{{ hb.th }}<\u002Fdiv>\n                  <div style=\"font-size: 12px; color: #8A7F66; font-style: italic;\">{{ hb.sci }}<\u002Fdiv>\n                <\u002Fdiv>\n                <input type=\"range\" min=\"0\" max=\"60\" step=\"5\" value=\"{{ hb.v }}\" sc-camel-on-input=\"{{ hb.on }}\" style=\"width: 100%;\">\n                <div style=\"text-align: right; font-weight: 700; font-variant-numeric: tabular-nums;\">{{ hb.v }}%<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 18px; padding: 15px; border-radius: 13px; background: {{ totalBg }};\">\n            <span style=\"font-weight: 600;\">รวม {{ herbTotal }}%<\u002Fspan>\n            <span style=\"font-size: 13px; color: #4E5A51; margin-right: auto;\">{{ totalMsg }}<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ normalize }}\" style=\"padding: 9px 14px; border-radius: 10px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; cursor: pointer;\">ปรับให้ครบ 100%<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-top: 18px;\">\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">น้ำหนักยารวม (กรัม)\n              <input type=\"number\" value=\"{{ f.weight }}\" sc-camel-on-input=\"{{ h.weight }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">อุณหภูมิไอน้ำ (°C)\n              <input type=\"number\" value=\"{{ f.temp }}\" sc-camel-on-input=\"{{ h.temp }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">ต้นทุนรวม/ครั้ง (บาท)\n              <input type=\"number\" value=\"{{ f.cost }}\" sc-camel-on-input=\"{{ h.cost }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">รหัสหัตถการ\n              <input value=\"{{ f.proc }}\" sc-camel-on-input=\"{{ h.proc }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; margin-top: 20px;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"padding: 13px 18px; border-radius: 12px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; cursor: pointer;\">ย้อนกลับ<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"padding: 13px 22px; border-radius: 12px; border: none; background: #0F3327; color: #F7F2E7; font-weight: 600; cursor: pointer;\">ถัดไป · เริ่มหัตถการ<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ขั้นที่ 4 หัตถการ + AR -->\n      <sc-if value=\"{{ step4 }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"padding: 24px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E4DCC8;\">\n          <h2 style=\"margin: 0 0 4px; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 22px; font-weight: 700;\">หัตถการสุ่มยา · ผู้ช่วยเฝ้าระยะปลอดภัย<\u002Fh2>\n          <p style=\"margin: 0 0 20px; font-size: 14px; color: #8A7F66;\">วางแท็บเล็ตข้างชามสุ่มยาให้กล้องเห็นใบหน้า ระบบจะเตือนเมื่อก้มใกล้ไอร้อนน้อยกว่า {{ safeMin }} ซม.<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; align-items: start;\">\n            <div style=\"position: relative; border-radius: 16px; overflow: hidden; background: #0F3327; aspect-ratio: 4 / 3;\">\n              <video ref=\"{{ videoRef }}\" sc-camel-auto-play=\"{{ true }}\" muted=\"{{ true }}\" sc-camel-plays-inline=\"{{ true }}\" style=\"width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);\"><\u002Fvideo>\n              <div style=\"position: absolute; inset: 0; border: {{ ringW }} solid {{ ringColor }}; border-radius: 16px; pointer-events: none; transition: border-color .2s;\"><\u002Fdiv>\n              <div style=\"position: absolute; left: 14px; top: 14px; padding: 8px 13px; border-radius: 999px; background: rgba(15,51,39,.72); color: #F7F2E7; font-size: 13px; backdrop-filter: blur(6px);\">{{ camStatus }}<\u002Fdiv>\n              <div style=\"position: absolute; left: 14px; bottom: 14px; padding: 12px 16px; border-radius: 14px; background: rgba(15,51,39,.78); color: #F7F2E7; backdrop-filter: blur(6px);\">\n                <div style=\"font-size: 12px; opacity: .78;\">ระยะห่างจากชามสุ่มยา<\u002Fdiv>\n                <div style=\"font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.1;\">{{ di dding: 15px; border-radius: 13px; background: #FDF4E6; border: 1px solid #EBD9BC;\">\n                  <div style=\"font-size: 13px; color: #9A5A16; margin-bottom: 9px;\">เบราว์เซอร์นี้ไม่รองรับการตรวจจับใบหน้า — โหมดสำรอง ปรับระยะด้วยมือเพื่อสาธิตการแจ้งเตือน<\u002Fdiv>\n                  <input type=\"range\" min=\"10\" max=\"45\" step=\"1\" value=\"{{ manualDist }}\" sc-camel-on-input=\"{{ onManualDist }}\" style=\"width: 100%;\">\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; margin-top: 20px;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"padding: 13px 18px; border-radius: 12px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; cursor: pointer;\">ย้อนกลับ<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"padding: 13px 22px; border-radius: 12px; border: none; background: #0F3327; color: #F7F2E7; font-weight: 600; cursor: pointer;\">ถัดไป · วัดค่าหลังสุ่มยา<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ขั้นที่ 5 Post-test + ส่งชีต -->\n      <sc-if value=\"{{ step5 }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"padding: 24px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E4DCC8;\">\n          <h2 style=\"margin: 0 0 4px; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 22px; font-weight: 700;\">Post-Suma Test &amp; สรุปผลลง OPD Card<\u002Fh2>\n          <p style=\"margin: 0 0 20px; font-size: 14px; color: #8A7F66;\">อัดเสียงลมหายใจอีก 10 วินาที ระบบจะเทียบผลก่อน–หลังและส่งเข้า Google Sheet ชีต sumary<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; align-items: start;\">\n            <div style=\"padding: 20px; border-radius: 16px; background: #0F3327; color: #F7F2E7;\">\n              <div style=\"disp Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px;\">\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">เหตุการณ์ไม่พึงประสงค์\n              <sc-raw-select value=\"{{ f.ae }}\" sc-camel-on-change=\"{{ h.ae }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n                <option value=\"ไม่มี\">ไม่มี<\u002Foption>\n                <option value=\"ระคายเคืองตา\">ระคายเคืองตา<\u002Foption>\n                <option value=\"ระคายเคืองผิวหนัง\">ระคายเคืองผิวหนัง<\u002Foption>\n                <option value=\"ลวก/พองแดง\">ลวก/พองแดง<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">ความพึงพอใจผู้ป่วย (1–5)\n              <input type=\"number\" min=\"1\" max=\"5\" value=\"{{ f.satis }}\" sc-camel-on-input=\"{{ h.satis }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">คะแนน SUS ของ พท. (0–100)\n              <input type=\"number\" min=\"0\" max=\"100\" value=\"{{ f.sus }}\" sc-camel-on-input=\"{{ h.sus }}\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n            <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">หมายเหตุ\n              <input value=\"{{ f.note }}\" sc-camel-on-input=\"{{ h.note }}\" placeholder=\"สังเกตการณ์เพิ่มเติม\" style=\"padding: 11px 13px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF;\">\n            <\u002Flabel>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 18px; padding: 18px; border-radius: 15px; background: #FDF4E6; border: 1px solid      <div style=\"display: flex; align-items: center; gap: 13px; margin-bottom: 18px;\">\n          <div style=\"width: 46px; height: 46px; border-radius: 14px; background: #E6F0EA; display: grid; place-items: center; font-size: 22px;\">🌿<\u002Fdiv>\n          <div>\n            <h2 style=\"margin: 0; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 21px; font-weight: 700;\">สวัสดีค่ะ วันนี้จมูกเป็นอย่างไรบ้าง<\u002Fh2>\n            <div style=\"font-size: 13px; color: #8A7F66;\">บันทึกอาการวันละครั้ง ใช้เวลาไม่ถึงนาที<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; gap: 9px; margin-bottom: 18px;\">\n          <input value=\"{{ f.hn }}\" sc-camel-on-input=\"{{ h.hn }}\" placeholder=\"กรอก HN หรือสแกน QR จาก พท.\" style=\"flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #D6CDB8; background: #FFF;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ scanQR }}\" style=\"padding: 12px 15px; border-radius: 12px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; cursor: pointer;\">สแกน QR<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; gap: 18px;\">\n          <sc-for list=\"{{ tnssItems }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div>\n              <div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 7px;\">\n                <span style=\"font-weight: 600; font-size: 16px;\">{{ t.label }}<\u002Fspan>\n                <span style=\"margin-left: auto; font-size: 13px; color: #1E6B54; font-weight: 600;\">{{ t.word }}<\u002Fspan>\n              <\u002Fdiv>\n              <input type=\"range\" min=\"0\" max=\"3\" step=\"1\" value=\"{{ t.v }}\" sc-camel-on-input=\"{{ t.on }}\" style=\"width: 100%;\">\n              <div style=\"display: flex; justify-content: space-between; font-size: 11px; color: #A59A80; margin-top: 3px;\">\n                <span>ไม่มี<\u002Fspan><span>เล็กน้อย<\u002Fspan><span>ปานกลาง<\u002Fspan><span>มาก<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: 20px; padding: 18px; border-radius: 16px; background: linear-gradient(150deg, #E6F0EA, #F2EDE1); display: flex; align-items: center; gap: 16px;\">\n          <div>\n            <div style=\"font-size: 12px; color: #6B7A6F;\">คะแนนรวมวันนี้ (TNSS)<\u002Fdiv>\n            <div style=\"font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 40px; font-weight: 700; line-height: 1; color: #16543F;\">{{ tnssTotal }}<span style=\"font-size: 17px; color: #6B7A6F;\"> / 12<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-left: auto; text-align: right; font-size: 14px; color: #16543F; max-width: 190px; line-height: 1.55;\">{{ tnssWord }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <label style=\"display: flex; gap: 10px; align-items: center; margin-top: 16px; font-size: 14px; cursor: pointer;\">\n          <input type=\"checkbox\" checked=\"{{ f.sumaToday }}\" sc-camel-on-change=\"{{ h.sumaToday }}\" style=\"width: 19px; height: 19px; accent-color: #1E6B54;\">\n          <span>วันนี้สุ่มยาสมุนไพรที่บ้านแล้ว<\u002Fspan>\n        <\u002Flabel>\n\n        <button type=\"button\" sc-camel-on-click=\"{{ submitTNSS }}\" style=\"width: 100%; margin-top: 18px; padding: 15px; border-radius: 14px; border: none; background: #1E6B54; color: #F7F2E7; font-weight: 700; font-size: 16px; cursor: pointer;\">บันทึกอาการวันนี้<\u002Fbutton>\n        <div style=\"margin-top: 10px; text-align: center; font-size: 13px; color: {{ submitColor }};\">{{ submitMsg }}<\u002Fdiv>\n\n        <div style=\"margin-top: 22px; padding-top: 18px; border-top: 1px dashed #E4DCC8;\">\n          <div style=\"font-size: 13px; font-weight: 600; color: #4E5A51; margin-bottom: 12px;\">7 วันที่ผ่านมา<\u002Fdiv>\n          <div style=\"display: flex; align-items: flex-end; gap: 7px; height: 76px;\">\n            <sc-for list=\"{{ myWeek }}\" as=\"d\" hint-placeholder-count=\"7\">\n              <div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end;\">\n                <span style=\"width: 100%; height: {{ d.h }}; background: {{ d.c }}; border-radius: 5px 5px 0 0;\"><\u002Fspan>\n                <span style=\"font-size: 11px; color: #A59A80;\">{{ d.label }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ─────────── ตั้งค่า ─────────── -->\n  <sc-if value=\"{{ isSet }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"ตั้งค่า\" style=\"max-width: 760px; margin: 0 auto; padding: 26px 22px 0;\">\n      <section style=\"padding: 24px; border-radius: 18px; background: #FFFDF7; border: 1px solid #E4DCC8;\">\n        <h2 style=\"margin: 0 0 4px; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 22px; font-weight: 700;\">เชื่อมต่อ Google Sheet<\u002Fh2>\n        <p style=\"margin: 0 0 18px; font-size: 14px; color: #8A7F66; line-height: 1.7;\">วางไฟล์ <strong>apps-script/Code.gs<\u002Fstrong> ในโครงการนี้ลงใน Apps Script ของชีต → รัน <code>setupSheets()<\u002Fcode> → Deploy เป็น Web app (Anyone) → นำ URL ที่ลงท้าย <code>/exec<\u002Fcode> มาวางด้านล่าง<\u002Fp>\n        <div style=\"display: grid; gap: 14px;\">\n          <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">Web App URL\n            <input value=\"{{ url }}\" sc-camel-on-input=\"{{ onUrl }}\" placeholder=\"https://script.google.com/macros/s/.../exec\" style=\"padding: 12px 14px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF; font-family: ui-monospace, monospace; font-size: 13px;\">\n          <\u002Flabel>\n          <label style=\"display: grid; gap: 6px; font-size: 13px; color: #4E5A51;\">API Key (ต้องตรงกับ CONFIG.API_KEY)\n            <input value=\"{{ key }}\" sc-camel-on-input=\"{{ onKey }}\" style=\"padding: 12px 14px; border-radius: 11px; border: 1px solid #D6CDB8; background: #FFF; font-family: ui-monospace, monospace; font-size: 13px;\">\n          <\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; align-items: center;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ testLink }}\" style=\"padding: 12px 18px; border-radius: 11px; border: none; background: #0F3327; color: #F7F2E7; font-weight: 600; cursor: pointer;\">ทดสอบการเชื่อมต่อ<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ loadSheet }}\" style=\"padding: 12px 18px; border-radius: 11px; border: 1px solid #C9C0AB; background: #FFF; font-weight: 600; cursor: pointer;\">ดึงข้อมูล sumary<\u002Fbutton>\n          <span style=\"font-size: 13px; color: {{ submitColor }};\">{{ submitMsg }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: 24px; padding-top: 20px; border-top: 1px dashed #E4DCC8;\">\n          <h3 style=\"margin: 0 0 12px; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 17px; font-weight: 600;\">โครงสร้างข้อมูล 4 ชีต<\u002Fh3>\n          <div style=\"display: grid; gap: 12px;\">\n            <sc-for list=\"{{ sheetDocs }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"padding: 15px; border-radius: 13px; background: #F2EDE1;\">\n                <div style=\"display: flex; gap: 10px; align-items: baseline; margin-bottom: 5px;\">\n                  <span style=\"font-family: ui-monospace, monospace; font-weight: 700; color: #0F3327;\">{{ s.name }}<\u002Fspan>\n                  <span style=\"font-size: 12px; color: #8A7F66;\">{{ s.cols }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size: 13px; color: #4E5A51; line-height: 1.6;\">{{ s.desc }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;demoTimer&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;การสาธิต&quot;},&quot;sumaMinutes&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:15,&quot;min&quot;:5,&quot;max&quot;:20,&quot;unit&quot;:&quot;นาที&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;การสาธิต&quot;},&quot;safeMinCm&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:12,&quot;max&quot;:30,&quot;unit&quot;:&quot;ซม.&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;ความปลอดภัย&quot;}}\">\nconst HERBS = [\n  { key: 'ginger', th: 'ขิง', sci: 'Zingiber officinale', def: 30 },\n  { key: 'makhwaen', th: 'มะแขวน', sci: 'Zanthoxylum limonella', def: 25 },\n  { key: 'kha', th: 'ข่า', sci: 'Alpinia galanga', def: 20 },\n  { key: 'makrut', th: 'ผิวมะกรูด', sci: 'Citrus hystrix', def: 15 },\n  { key: 'peep', th: 'ดอกปีบ', sci: 'Millingtonia hortensis', def: 10 }\n];\nconst TNSS_KEYS = [\n  { key: 'sneeze', label: 'จาม' },\n  { key: 'rhino', label: 'น้ำมูกไหล' },\n  { key: 'block', label: 'คัดจมูก' },\n  { key: 'itch', label: 'คันจมูก' }\n];\nconst WORDS = ['ไม่มีอาการ', 'เล็กน้อย', 'ปานกลาง', 'มาก'];\nconst APP_VERSION = 'v1.0';\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\nconst r1 = v => Math.round(v * 10) / 10;\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const herb = {};\n    HERBS.forEach(h => herb[h.key] = h.def);\n    this.state = {\n      screen: 'dash', step: 1, sel: null,\n      cases: this.seedCases(30), fromSheet: false,\n      form: {\n        hn: '', name: '', age: 38, sex: 'หญิง', thatu: 'น้ำ', icd: 'J30.4',\n        clinic: 'คลินิกแพทย์แผนไทย รพ.ปากชม', provider: '', visit: 1,\n        consent: false, weight: 120, temp: 60, cost: 35, proc: '9999510',\n        ae: 'ไม่มี', satis: 5, sus: 85, note: '', sumaToday: true\n      },\n      herb,\n      tnss: { sneeze: 2, rhino: 2, block: 3, itch: 1 },\n      pre: null, post: null, rec: '', recSec: 0, recErr: '', wave: [],\n      camOn: false, dist: null, minDist: null, alerts: 0, manualMode: false, manualDist: 30, camErr: '', detMsg: '',\n      running: false, elapsed: 0, advice: '', aiBusy: false,\n      url: '', key: 'pakchom-suma-2569', submitMsg: '', submitOk: true, linked: false,\n      myWeek: this.seedWeek()\n    };\n    this._hc = {};\n  }\n\n  componentDidMount() {\n    try {\n      const saved = JSON.parse(localStorage.getItem('sumaai.cfg') || '{}');\n      if (saved.url || saved.key) this.setState({ url: saved.url || '', key: saved.key || this.state.key });\n    } catch (e) {}\n  }\n\n  componentWillUnmount() { this.stopCam(); this.stopTimer(); }\n\n  /* ───────── seed data ───────── */\n  seedCases(n) {\n    let s = 20260917;\n    const rnd = () => ((s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);\n    const thatus = ['ดิน', 'น้ำ', 'ลม', 'ไฟ'];\n    const predom = ['คัดจมูกเด่น', 'น้ำมูกเด่น', 'จามเด่น', 'คันจมูกเด่น'];\n    const out = [];\n    for (let i = 0; i < n; i++) {\n      const pre = Math.round(34 + rnd() * 22);\n      const gain = Math.round(19 + rnd() * 26);\n      const post = clamp(pre + gain, 0, 97);\n      const t0 = 7 + Math.round(rnd() * 5);\n      const t1 = clamp(Math.round(t0 * (0.32 + rnd() * 0.3)), 0, 12);\n      out.push({\n        id: 'SUMA-2609' + String(10 + i).padStart(2, '0') + '-' + String(101 + i),\n        hn: '00' + (128400 + i * 37),\n        thatu: thatus[Math.floor(rnd() * 4)],\n        age: 22 + Math.round(rnd() * 45),\n        sex: rnd() > 0.45 ? 'หญิง' : 'ชาย',\n        pre, post, gain: post - pre,\n        tnssPre: t0, tnssPost: t1,\n        tnssDrop: Math.round((1 - t1 / t0) * 100),\n        predom: predom[Math.floor(rnd() * 4)],\n        ae: 'ไม่มี',\n        minDist: 22 + Math.round(rnd() * 12),\n        alerts: Math.round(rnd() * 3),\n        adherence: 78 + Math.round(rnd() * 22),\n        visit: 1 + Math.round(rnd() * 3)\n      });\n    }\n    return out;\n  }\n\n  seedWeek() {\n    const base = [9, 8, 8, 6, 6, 5, 4];\n    const days = ['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา'];\n    return base.map((v, i) => ({ v, label: days[i] }));\n  }\n\n  /* ───────── helpers ───────── */\n  h(field) {\n    if (!this._hc[field]) {\n      this._hc[field] = e => {\n        const t = e.target;\n        const v = t.type === 'checkbox' ? t.checked : (t.type === 'number' ? Number(t.value) : t.value);\n        this.setState(s => ({ form: { ...s.form, [field]: v } }));\n      };\n    }\n    return this._hc[field];\n  }\n\n  setHerb(key, v) { this.setState(s => ({ herb: { ...s.herb, [key]: Number(v) } })); }\n  herbTotal() { return HERBS.reduce((a, h) => a + (Number(this.state.herb[h.key]) || 0), 0); }\n  normalizeHerbs() {\n    const tot = this.herbTotal() || 1;\n    const next = {};\n    HERBS.forEach(h => next[h.key] = Math.round(this.state.herb[h.key] / tot * 100));\n    const diff = 100 - HERBS.reduce((a, h) => a + next[h.key], 0);\n    next[HERBS[0].key] += diff;\n    this.setState({ herb: next });\n  }\n  formulaText(obj) {\n    const o = obj || this.state.herb;\n    return HERBS.map(h => h.th + ' ' + o[h.key]).join(' / ');\n  }\n\n  /* ───────── AI acoustic ───────── */\n  async record(phase) {\n    if (this.state.rec) return;\n    this.setState({ rec: phase, recSec: 0, recErr: '', wave: [] });\n    let stream, ctx;\n    try {\n      stream = await navigator.mediaDevices.getUserMedia({\n        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }\n      });\n      ctx = new (window.AudioContext || window.webkitAudioContext)();\n      const src = ctx.createMediaStreamSource(stream);\n      const an = ctx.createAnalyser();\n      an.fftSize = 2048;\n      src.connect(an);\n      const buf = new Float32Array(an.fftSize);\n      const freq = new Uint8Array(an.frequencyBinCount);\n      const binHz = ctx.sampleRate / an.fftSize;\n      const samples = [];\n      let chunks = [], mr = null;\n      try {\n        mr = new MediaRecorder(stream);\n        mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };\n        mr.start();\n      } catch (e) { mr = null; }\n      const DUR = 10;\n      const t0 = performance.now();\n      await new Promise(res => {\n        this._recTick = setInterval(() => {\n          const el = (performance.now() - t0) / 1000;\n          an.getFloatTimeDomainData(buf);\n          an.getByteFrequencyData(freq);\n          let sum = 0;\n          for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];\n          const rms = Math.sqrt(sum / buf.length);\n          let num = 0, den = 0, hf = 0, tot = 0;\n          for (let i = 1; i < freq.length; i++) {\n            const m = freq[i] / 255, f = i * binHz;\n            num += f * m; den += m; tot += m;\n            if (f >= 1500 && f <= 6000) hf += m;\n          }\n          samples.push({ rms, centroid: den ? num / den : 0, turb: tot ? hf / tot : 0 });\n          const lvl = clamp(rms * 9, 0.02, 1);\n          this.setState(s => ({ recSec: Math.min(DUR, el), wave: [...s.wave, lvl].slice(-56) }));\n          if (el >= DUR) { clearInterval(this._recTick); res(); }\n        }, 90);\n      });\n      if (mr && mr.state !== 'inactive') mr.stop();\n      const act = samples.filter(x => x.rms > 0.004);\n      const use = act.length > 6 ? act : samples;\n      const avg = k => use.reduce((a, x) => a + x[k], 0) / (use.length || 1);\n      const rms = avg('rms'), centroid = avg('centroid'), turb = avg('turb');\n      const penalty = 0.45 * clamp(turb / 0.55, 0, 1)\n        + 0.35 * clamp((centroid - 300) / 2200, 0, 1)\n        + 0.20 * clamp(rms / 0.2, 0, 1);\n      const index = Math.round(clamp(100 - penalty * 100, 5, 97));\n      const result = { index, rms: r1(rms * 1000), centroid: Math.round(centroid), turb: Math.round(turb * 100), at: new Date().toISOString() };\n      this.setState({ [phase]: result, rec: '' });\n      if (chunks.length) this.uploadAudio(phase, new Blob(chunks, { type: 'audio/webm' }));\n    } catch (err) {\n      this.setState({ rec: '', recErr: this.mediaHint('ไมโครโฟน', err) });\n    } finally {\n      if (this._recTick) clearInterval(this._recTick);\n      if (stream) stream.getTracks().forEach(t => t.stop());\n      if (ctx) try { ctx.close(); } catch (e) {}\n    }\n  }\n\n  async uploadAudio(phase, blob) {\n    if (!this.state.url) return;\n    try {\n      const b64 = await new Promise(res => {\n        const fr = new FileReader();\n        fr.onload = () => res(String(fr.result).split(',')[1]);\n        fr.readAsDataURL(blob);\n      });\n      const r = await this.post({\n        action: 'audio', filename: (this.state.form.hn || 'HN') + '-' + phase + '-' + Date.now() + '.webm',\n        mimeType: 'audio/webm', base64: b64\n      });\n      if (r && r.ok && r.url) this.setState(s => ({ [phase]: { ...s[phase], url: r.url } }));\n    } catch (e) {}\n  }\n\n  /* ───────── AR distance ───────── */\n  async initDetector() {\n    if (this._fd || this._mp) return true;\n    if (typeof window.FaceDetector === 'function') {\n      try {\n        this._fd = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 1 });\n        this._fdKind = 'FaceDetector (เนทีฟ)';\n        return true;\n      } catch (e) { this._fd = null; }\n    }\n    this.setState({ detMsg: 'กำลังโหลดโมเดลตรวจจับใบหน้า MediaPipe…' });\n    try {\n      const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';\n      const m = await import(base + '/vision_bundle.mjs');\n      const vision = await m.FilesetResolver.forVisionTasks(base + '/wasm');\n      this._mp = await m.FaceDetector.createFromOptions(vision, {\n        baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' },\n        runningMode: 'VIDEO'\n      });\n      this._fdKind = 'MediaPipe BlazeFace';\n      this.setState({ detMsg: '' });\n      return true;\n    } catch (e) {\n      this.setState({ detMsg: 'โหลดโมเดลไม่ได้ (ต้องต่ออินเทอร์เน็ต) — ใช้โหมดสำรอง' });\n      return false;\n    }\n  }\n\n  async toggleCam() {\n    if (this.state.camOn) return this.stopCam();\n    try {\n      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640 } });\n      this._stream = stream;\n      if (this._video) { this._video.srcObject = stream; await this._video.play().catch(() => {}); }\n      const ok = await this.initDetector();\n      this.setState({ camOn: true, manualMode: !ok });\n      this._camLoop = setInterval(() => this.tickCam(), 320);\n    } catch (err) {\n      this.setState({ camErr: this.mediaHint('กล้อง', err), manualMode: true, camOn: false });\n    }\n  }\n\n  mediaHint(what, err) {\n    const name = (err && (err.name || err.message)) || String(err);\n    if (/denied|NotAllowed/i.test(name)) {\n      return window.self !== window.top\n        ? 'เบราว์เซอร์บล็อก' + what + 'เพราะแอปรันอยู่ในกรอบ iframe — กด \"เปิดในแท็บใหม่\" ด้านล่างแล้วกดอนุญาตอีกครั้ง'\n        : 'คุณกดปฏิเสธสิทธิ์' + what + ' — กดไอคอนรูปกล้อง/ไมค์ในแถบที่อยู่ของเบราว์เซอร์ แล้วเลือก \"อนุญาต\" จากนั้นรีเฟรช';\n    }\n    if (/NotFound|DevicesNotFound/i.test(name)) return 'ไม่พบอุปกรณ์' + what + 'ในเครื่องนี้';\n    if (/NotReadable|TrackStart/i.test(name)) return what + 'ถูกโปรแกรมอื่นใช้งานอยู่ (เช่น Zoom/Meet) — ปิดก่อนแล้วลองใหม่';\n    if (!window.isSecureContext) return 'ต้องเปิดผ่าน https:// เท่านั้นจึงจะใช้' + what + 'ได้';\n    return 'เปิด' + what + 'ไม่ได้: ' + name;\n  }\n\n  stopCam() {\n    if (this._camLoop) clearInterval(this._camLoop);\n    if (this._stream) this._stream.getTracks().forEach(t => t.stop());\n    this._stream = null;\n    this.setState({ camOn: false });\n  }\n\n  async tickCam() {\n    const v = this._video;\n    if (!v || !v.videoWidth) return;\n    let w = 0;\n    if (this._mp) {\n      try {\n        const res = this._mp.detectForVideo(v, performance.now());\n        const d = res && res.detections && res.detections[0];\n        if (d && d.boundingBox) w = d.boundingBox.width;\n      } catch (e) { this._mp = null; this.setState({ manualMode: true }); }\n    } else if (this._fd) {\n      try {\n        const faces = await this._fd.detect(v);\n        if (faces && faces[0]) w = faces[0].boundingBox.width;\n      } catch (e) { this._fd = null; this.setState({ manualMode: true }); }\n    }\n    let cm;\n    if (w > 4) {\n      const focal = v.videoWidth * 0.88;\n      cm = clamp((14 * focal) / w, 6, 90);\n    } else if (this.state.manualMode) {\n      cm = this.state.manualDist;\n    } else return;\n    this.registerDist(cm);\n  }\n\n  registerDist(cm) {\n    const safe = Number(this.props.safeMinCm ?? 20);\n    this.setState(s => {\n      const min = s.minDist === null ? cm : Math.min(s.minDist, cm);\n      let alerts = s.alerts;\n      if (cm < safe && !this._alerting) {\n        alerts += 1;\n        this._alerting = true;\n        this.warn();\n        setTimeout(() => { this._alerting = false; }, 4000);\n      }\n      if (cm > safe + 4) this._alerting = false;\n      return { dist: cm, minDist: min, alerts };\n    });\n  }\n\n  warn() {\n    try {\n      const ctx = new (window.AudioContext || window.webkitAudioContext)();\n      const o = ctx.createOscillator(), g = ctx.createGain();\n      o.type = 'triangle'; o.frequency.value = 660;\n      g.gain.value = 0.16;\n      o.connect(g); g.connect(ctx.destination);\n      o.start(); o.stop(ctx.currentTime + 0.22);\n      setTimeout(() => ctx.close(), 500);\n    } catch (e) {}\n    try {\n      const u = new SpeechSynthesisUtterance('ก้มใกล้เกินไป อาจเกิดการระคายเคือง กรุณาถอยห่างเล็กน้อย');\n      u.lang = 'th-TH'; u.rate = 1.05;\n      speechSynthesis.speak(u);\n    } catch (e) {}\n  }\n\n  /* ───────── timer ───────── */\n  targetSec() {\n    const min = Number(this.props.sumaMinutes ?? 15);\n    return this.props.demoTimer ? 60 : min * 60;\n  }\n  startSuma() {\n    if (this.state.running) { this.stopTimer(); return; }\n    this.setState({ running: true });\n    this._timer = setInterval(() => {\n      this.setState(s => {\n        const el = s.elapsed + 1;\n        if (el >= this.targetSec()) { this.stopTimer(); return { elapsed: this.targetSec() }; }\n        return { elapsed: el };\n      });\n    }, 1000);\n  }\n  stopTimer() { if (this._timer) clearInterval(this._timer); this._timer = null; this.setState({ running: false }); }\n\n  /* ───────── AI recommendation ───────── */\n  predominant() {\n    const t = this.state.tnss;\n    const map = [\n      { k: 'block', label: 'คัดจมูกเด่น', v: t.block },\n      { k: 'rhino', label: 'น้ำมูกเด่น', v: t.rhino },\n      { k: 'sneeze', label: 'จามเด่น', v: t.sneeze },\n      { k: 'itch', label: 'คันจมูกเด่น', v: t.itch }\n    ];\n    map.sort((a, b) => b.v - a.v);\n    return map[0];\n  }\n\n  ruleAdvice() {\n    const p = this.predominant();\n    const base = { ...this.state.herb };\n    const bump = {\n      block: [['makhwaen', 10], ['makrut', 5], ['peep', -10], ['kha', -5]],\n      rhino: [['ginger', 10], ['kha', 5], ['peep', -10], ['makrut', -5]],\n      sneeze: [['peep', 10], ['makrut', 5], ['makhwaen', -10], ['ginger', -5]],\n      itch: [['kha', 10], ['peep', 5], ['ginger', -10], ['makhwaen', -5]]\n    }[p.k];\n    bump.forEach(([k, d]) => base[k] = clamp((base[k] || 0) + d, 0, 60));\n    const tot = HERBS.reduce((a, h) => a + base[h.key], 0) || 1;\n    HERBS.forEach(h => base[h.key] = Math.round(base[h.key] / tot * 100));\n    base[HERBS[0].key] += 100 - HERBS.reduce((a, h) => a + base[h.key], 0);\n    const gain = this.state.pre && this.state.post ? this.state.post.index - this.state.pre.index : null;\n    const lines = [\n      'อาการเด่น: ' + p.label + ' (TNSS ร
