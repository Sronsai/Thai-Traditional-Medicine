his.setState({ running: true });\n    this._timer = setInterval(() => {\n      this.setState(s => {\n        const el = s.elapsed + 1;\n        if (el >= this.targetSec()) { this.stopTimer(); return { elapsed: this.targetSec() }; }\n        return { elapsed: el };\n      });\n    }, 1000);\n  }\n  stopTimer() { if (this._timer) clearInterval(this._timer); this._timer = null; this.setState({ running: false }); }\n\n  /* ───────── AI recommendation ───────── */\n  predominant() {\n    const t = this.state.tnss;\n    const map = [\n      { k: 'block', label: 'คัดจมูกเด่น', v: t.block },\n      { k: 'rhino', label: 'น้ำมูกเด่น', v: t.rhino },\n      { k: 'sneeze', label: 'จามเด่น', v: t.sneeze },\n      { k: 'itch', label: 'คันจมูกเด่น', v: t.itch }\n    ];\n    map.sort((a, b) => b.v - a.v);\n    return map[0];\n  }\n\n  /** ตรีธาตุที่กระทำ — ใช้ค่าที่ พท. เลือก ถ้าไม่เลือกให้อนุมานจาก TNSS */\n  triNow() {\n    return this.state.form.tri || TRI_BY_SYMPTOM[this.predominant().k] || 'วาตะเด่น';\n  }\n\n  ruleAdvice() {\n    const p = this.predominant();\n    const tri = this.triNow();\n    const base = { ...this.state.herb };\n    const bump = (TRI[tri] || TRI['วาตะเด่น']).bump;\n    bump.forEach(([k, d]) => base[k] = clamp((base[k] || 0) + d, 0, 60));\n    const tot = HERBS.reduce((a, h) => a + base[h.key], 0) || 1;\n    HERBS.forEach(h => base[h.key] = Math.round(base[h.key] / tot * 100));\n    base[HERBS[0].key] += 100 - HERBS.reduce((a, h) => a + base[h.key], 0);\n    const gain = this.state.pre && this.state.post ? this.state.post.index - this.state.pre.index : null;\n    const f = this.state.form;\n    const ctx = [f.thatu ? 'ธาตุเจ้าเรือน' + f.thatu : '', f.utu, f.kala ? f.kala.replace(/\\s*\\(.*/, '') + ' น.' : ''].filter(Boolean).join(' · ');\n    const lines = [\n      'อาการเด่น: ' + p.label + ' (TNSS รวม ' + this.tnssTotal() + '/12) · ตรีธาตุที่กระทำ: ' + tri + ' (' + (TRI[tri] || {}).note + ')',\n      ctx ? 'สมุฏฐาน: ' + ctx : '',\n      gain !== null ? 'Nasal Patency เปลี่ยนแปลง ' + (gain >= 0 ? '+' : '') + gain + '% หลังสุมยา 15 นาที' : 'ยังไม่มีผลเทียบก่อน–หลัง',\n      'แนะนำปรับสัดส่วน: ' + bump.filter(b => b[1] > 0).map(b => HERBS.find(h => h.key === b[0]).th + ' +' + b[1] + '%').join(' และ ') + ' เพื่อปรับรสยาให้ตรงกับตรีธาตุที่กระทำ'\n    ].filter(Boolean);\n    return { text: lines.join('\\n'), next: base };\n  }\n\n  async askAI() {\n    const rule = this.ruleAdvice();\n    this._next = rule.next;\n    this.setState({ advice: rule.text, aiBusy: true });\n    try {\n      if (window.claude && window.claude.complete) {\n        const p = 'คุณเป็นผู้ช่วยแพทย์แผนไทย สรุปคำแนะนำปรับตำรับยาสุ่มสมุนไพร 5 ชนิด (ขิง ดอกปีบ มะแขวน ผิวมะกรูด ข่า) ให้แพทย์แผนไทยอ่านใน 3 บรรทัดสั้นๆ ภาษาไทย โดยอ้างรสยาและสารสำคัญ ข้อมูลเคส: ' + JSON.stringify({\n          สูตรเดิม: this.formulaText(), สูตรแนะนำ: this.formulaText(rule.next),\n          TNSS: this.state.tnss, patencyก่อน: this.state.pre && this.state.pre.index,\n          patencyหลัง: this.state.post && this.state.post.index,\n          ธาตุเจ้าเรือน: this.state.form.thatu, อุตุสมุฏฐาน: this.state.form.utu || this.autoUtu(),\n          กาลสมุฏฐาน: this.state.form.kala, ตรีธาตุที่กระทำ: this.triNow()\n        });\n        const out = await window.claude.complete(p);\n        if (out) this.setState({ advice: String(out).trim() });\n      }\n    } catch (e) {}\n    this.setState({ aiBusy: false });\n  }\n\n  tnssTotal() { return TNSS_KEYS.reduce((a, k) => a + (this.state.tnss[k.key] || 0), 0); }\n\n  /* ───────── sheet I/O ───────── */\n  saveCfg() {\n    try { localStorage.setItem('sumaai.cfg', JSON.stringify({ url: this.state.url, key: this.state.key })); } catch (e) {}\n  }\n\n  async post(payload) {\n    if (!this.state.url) throw new Error('ยังไม่ได้ตั้งค่า Web App URL (ไปที่แท็บ ตั้งค่า)');\n    const res = await fetch(this.state.url, {\n      method: 'POST', redirect: 'follow',\n      headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n      body: JSON.stringify( (e0) { if (e0 && e0.name === 'AbortError') throw e0; }\n      }\n      // 2) สำรอง: Apps Script\n      if (!raw && !url) throw new Error('ดึงชีตเผยแพร่ (CSV) ไม่สำเร็จ — ตรวจว่าลิงก์เผยแพร่ยังใช้งานได้');\n      if (!raw) {\n        const res = await fetch(url + '?key=' + encodeURIComponent(key) + '&action=sumary', { redirect: 'follow', signal: ac.signal });\n        const txt = await res.text();\n        let j;\n        try { j = JSON.parse(txt); }\n        catch (pe) { throw new Error('ชีตตอบกลับไม่ใช่ JSON — ตรวจว่า Deploy เป็น Web app แบบ Anyone และใช้ URL ที่ลงท้าย /exec'); }\n        if (!j.ok) throw new Error(j.error || 'อ่านชีตไม่ได้');\n        raw = j.rows || [];\n        via = 'Apps Script';\n      }\n      this._via = via;\n      this.loadDaily();\n      // อ่านค่าตัวเลขแบบทนต่อช่องว่าง/เครื่องหมายจุลภาค/หัวคอลัมน์เพี้ยน\n      const norm = k => String(k).replace(/[\\s\\u00A0\\u200B]/g, '').toLowerCase();\n      const cell = (r, names) => {\n        for (const nm of names) { if (r[nm] !== undefined && r[nm] !== '') return r[nm]; }\n        const want = names.map(norm);\n        for (const k in r) { if (want.indexOf(norm(k)) >= 0 && r[k] !== '') return r[k]; }\n        return '';\n      };\n      const num = (r, names) => {\n        const v = cell(r, names);\n        if (v === '' || v === null) return 0;\n        const n = parseFloat(String(v).replace(/[\\s\\u00A0,%]/g, ''));\n        return isFinite(n) ? n : 0;\n      };\n      const sumParts = str => String(str || '').split('/').reduce((a, x) => a + (parseFloat(x) || 0), 0);\n      const rows = raw.map((r, i) => {\n        const pre = num(r, ['Patency ก่อน (%)']), post = num(r, ['Patency หลัง (%)']);\n        const t0 = num(r, ['TNSS รวมก่อน']) || sumParts(cell(r, ['TNSS ก่อน (จาม/น้ำมูก/คัด/คัน)']));\n        const t1 = num(r, ['TNSS รวมหลัง']) || sumParts(cell(r, ['TNSS หลัง (จาม/น้ำมูก/คัด/คัน)']));\n        return {\n          id: r['รหัสบันทึก'] || 'row ' + (i + 2), hn: r['HN'], thatu: r['ธาตุเจ้าเรือน'],\n          date: this.normDate(r['วันที่รับบริการ'] || r['วันที่-เวลาบันทึก']),\n          name: r['ชื่อ-นามสกุล'] || '', provider: r['ผู้ทำหัตถการ (พท.)'] || '',\n          age: r['อายุ (ปี)'], sex: r['เพศ'], pre, post, gain: post - pre,\n          tnssPre: t0, tnssPost: t1,\n          tnssDrop: (t0 && t1) ? Math.round((1 - t1 / t0) * 1000) / 10 : (num(r, ['TNSS ลดลง (%)']) || 0),\n          predom: r['กลุ่มอาการเด่น'] || '—', ae: r['เหตุการณ์ไม่พึงประสงค์'] || 'ไม่มี',\n          minDist: Number(r['ระยะใกล้สุด (ซม.)']) || 0, alerts: Number(r['จำนวนแจ้งเตือนระยะ']) || 0,\n          adherence: Number(r['ทำครบเวลา (%)']) || 0, advice: r['คำแนะนำปรับสูตรจาก AI']\n        };\n      });\n      if (!rows.length) { this.setState({ submitMsg: 'ชีต sumary ยังไม่มีข้อมูล — แสดงเคสตัวอย่างต่อไป', submitOk: false }); return; }\n      this.setState({ cases: rows, fromSheet: true, linked: true, submitMsg: 'ดึงข้อมูลสำเร็จ ' + rows.length + ' แถว · ' + this._via, submitOk: true });\n    } catch (e) {\n      const aborted = e && (e.name === 'AbortError' || /abort/i.test(e.message || ''));\n      this.setState({\n        submitMsg: aborted\n          ? 'เชื่อมต่อชีตไม่สำเร็จภายในเวลาที่กำหนด — ตรวจอินเทอร์เน็ตหรือการ Deploy ของ Apps Script'\n          : 'ดึงข้อมูลไม่ได้: ' + e.message,\n        submitOk: false, linked: false\n      });\n    } finally {\n      clearTimeout(killer);\n      this.setState({ autoLoading: false });\n    }\n  }\n\n  /* ───── RCQ-36 ───── */\n  setRcq(key, v) {\n    this.setState(s => {\n      const rcq = { ...s.rcq, [key]: v };\n      const next = { rcq };\n      // ด้าน 1 ข้อ 1–4 ซ้ำกับ TNSS → เติมให้อัตโนมัติ (พท. แก้ทับได้)\n      const map = { d1_1: 'rhino', d1_2: 'itch', d1_3: 'block', d1_4: 'sneeze' };\n      if (map[key] && s.screen === 'tp') next.tnss = { ...s.tnss, [map[key]]: rcqToTnss(v) };\n      return next;\n    });\n  }\n\n  rcqStats(obj) {\n    const src = obj || this.state.rcq;\n    const vals = RCQ_KEYS.map(k => Number(src[k]) || 0);\n    const answered = vals.filter(v => v > 0).length;\n    const total = vals.reduce((a, b) => a + b, 0);\n    const avg = answered ? total / answered : 0;\n    const domains = RCQ_DOMAINS.map(d => {\n      const dv = d.items.map((_, i) => Number(src[d.id + '_' + (i + 1)]) || 0).filter(v => v > 0);\n      return { no: d.no, title: d.title, color: d.color, sum: dv.reduce((a, b) => a + b, 0), n: dv.length, max: d.items.length * 5 };\n    });\n    return { answered, total, avg: Math.round(avg * 100) / 100, domains, complete: answered === RCQ_N };\n  }\n\n  async submitRcq(phase) {\n    const st = this.rcqStats();\n    const hn = phase === 'หลัง' ? this.state.rcqHN : this.state.form.hn;\n    if (!hn) { this.setState({ rcqMsg: 'กรอก HN ก่อนบันทึก', rcqOk: false }); return; }\n    if (st.answered === 0) { this.setState({ rcqMsg: 'ยังไม่ได้ตอบข้อใดเลย', rcqOk: false }); return; }\n    if (phase === 'ก่อน' && !this.state.form.consent) { this.setState({ rcqMsg: 'ต้องติ๊กความยินยอม PDPA ก่อนส่งข้อมูล', rcqOk: false }); return; }\n    const data = {\n      'HN': hn, 'ชื่อ-นามสกุล': phase === 'ก่อน' ? this.state.form.name : (this.lookupName(hn) || this.state.qrName || ''),\n      'ครั้งที่ประเมิน': phase,\n      'รหัสบันทึก sumary': phase === 'หลัง' ? (this.state.linkedRec || this.lookupRec(hn)) : this.state.recordId,\n      'สุขภาพโดยรวม': this.state.rcqHealth, 'วันหยุดงาน/เรียน (วัน/เดือน)': this.state.rcqDaysOff,\n      'คะแนนรวม (34-170)': st.total, 'เฉลี่ยต่อข้อ': st.avg,\n      'แปลผล RCQ-36': rcqBand(st.avg).label,\n      'ดีขึ้น (%)': (() => {\n        if (phase !== 'หลัง') return '';\n        const p = this.rcqPreTotalOf(hn);\n        const pct = rcqImprovePct(p, st.total);\n        return pct === null ? '' : pct;\n      })(),\n      'แปลผลการเปลี่ยนแปลง': (() => {\n        if (phase !== 'หลัง') return '';\n        const pct = rcqImprovePct(this.rcqPreTotalOf(hn), st.total);\n        return pct === null ? '' : rcqImproveBand(pct).label;\n      })(),\n      'หมายเหตุ': st.complete ? '' : 'ตอบ ' + st.answered + '/' + RCQ_N + ' ข้อ'\n    };\n    RCQ_DOMAINS.forEach(d => d.items.forEach((it, i) => {\n      data[d.id + '_' + (i + 1) + ' ' + it] = this.state.rcq[d.id + '_' + (i + 1)] || '';\n    }));\n    st.domains.forEach(d => data['คะแนนด้าน ' + d.no + ' ' + d.title] = d.sum);\n    this.setState({ rcqBusy: true, rcqMsg: 'กำลังบันทึก…', rcqOk: true });\n    try {\n      const r = await this.post({ action: 'rcq36', data });\n      this.setState({ rcqMsg: r.ok ? 'บันทึก RCQ-36 (' + phase + ') เรียบร้อย · ' + st.total + ' คะแนน' : 'ผิดพลาด: ' + r.error, rcqOk: !!r.ok });\n      if (r.ok) this.okPop('บันทึกแบบสอบถาม RCQ-36 (' + phase + ') สำเร็จ', 'ข้อมูลถูกส่งเข้าชีต rcq36 แล้ว · คะแนนรวม ' + st.total + ' คะแนน');\n      if (r.ok && phase === 'หลัง') this.loadRcq();\n    } catch (e) {\n      this.setState({ rcqMsg: 'บันทึกไม่ได้: ' + e.message, rcqOk: false });\n    } finally {\n      this.setState({ rcqBusy: false });\n    }\n  }\n\n  async loadRcq() {\n    try {\n      const csv = await this.csvRows('rcq36');\n      if (csv) { this.setState({ rcqRows: csv }); return; }\n      const res = await fetch(this.state.url + '?key=' + encodeURIComponent(this.state.key) + '&action=rcq36', { redirect: 'follow' });\n      const j = await res.json();\n      if (j.ok) this.setState({ rcqRows: j.rows || [] });\n    } catch (e) {}\n  }\n\n  /** ป๊อปอัปแจ้งบันทึกสำเร็จ */\n  okPop(title, detail) { this.setState({ okAsk: { title, detail } }); }\n\n  /** % ดีขึ้น RCQ-36 ของ HN จากชีต rcq36 (คอลัมน์ \"ดีขึ้น (%)\" ถ้ามี ไม่มีจึงคำนวณจากคะแนนก่อน–หลัง) */\n  rcqPctOf(hn) {\n    const key = this.hnKeyOf(hn);\n    if (!key) return null;\n    const rows = (this.state.rcqRows || []).filter(r => this.hnKeyOf(r['HN']) === key);\n    if (!rows.length) return null;\n    const posts = rows.filter(r => String(r['ครั้งที่ประเมิน']).indexOf('หลัง') >= 0);\n    const last = posts[posts.length - 1];\n    if (!last) return null;\n    const saved = last['ดีขึ้น (%)'];\n    if (saved !== '' && saved !== undefined && saved !== null && !isNaN(Number(saved))) return Number(saved);\n    const pres = rows.filter(r => String(r['ครั้งที่ประเมิน']).indexOf('ก่อน') >= 0);\n    const pre = pres[pres.length - 1];\n    if (!pre) return null;\n    return rcqImprovePct(Number(pre['คะแนนรวม (34-170)']), Number(last['คะแนนรวม (34-170)']));\n  }\n\n  /** คะแนนรวมชุด \"ก่อน\" ล่าสุดของ HN */\n  rcqPreTotalOf(hn) {\n    const key = this.hnKeyOf(hn);\n    const rows = (this.state.rcqRows || []).filter(r => this.hnKeyOf(r['HN']) === key\n      && String(r['ครั้งที่ประเมิน']).indexOf('ก่อน') >= 0);\n    const byRec = this.state.linkedRec\n      ? rows.filter(r => String(r['รหัสบันทึก sumary'] || '').trim() === String(this.state.linkedRec).trim())\n      : [];\n    const pre = (byRec.length ? byRec : rows).pop();\n    return pre ? Number(pre['คะแนนรวม (34-170)']) || 0 : 0;\n  }\n\n  /** ดึงภาพ QR เป็นไฟล์ PNG */\n  async qrBlob(link) {\n    const url = 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=16&data=' + encodeURIComponent(link);\n    const r = await fetch(url);\n    if (!r.ok) throw new Error('โหลดภาพ QR ไม่ได้');\n    return await r.blob();\n  }\n\n  /** แชร์ลิงก์ + ภาพ QR ผ่านช่องทางของเครื่อง */\n  async shareQr(link, title, text, setMsg) {\n    try {\n      let files = [];\n      try {\n        const b = await this.qrBlob(link);\n        const file = new File([b], 'qr-pch-sumya.png', { type: 'image/png' });\n        if (navigator.canShare && navigator.canShare({ files: [file] })) files = [file];\n      } catch (e) {}\n      if (navigator.share) {\n        await navigator.share(files.length ? { title, text: text + '\\n' + link, files } : { title, text, url: link });\n        setMsg('ส่งต่อเรียบร้อย');\n      } else {\n        await navigator.clipboard.writeText(link);\n        setMsg('เครื่องนี้ไม่รองรับการแชร์โดยตรง — คัดลอกลิงก์ให้แล้ว วางในแชตได้เลย');\n      }\n    } catch (e) {\n      if (e && e.name === 'AbortError') return;\n      setMsg('แชร์ไม่สำเร็จ: ' + e.message);\n    }\n  }\n\n  /** ดาวน์โหลดภาพ QR */\n  async downloadQr(link, name, setMsg) {\n    try {\n      const b = await this.qrBlob(link);\n      const u = URL.createObjectURL(b);\n      const a = document.createElement('a');\n      a.href = u; a.download = name + '.png';\n      document.body.appendChild(a); a.click(); a.remove();\n      setTimeout(() => URL.revokeObjectURL(u), 4000);\n      setMsg('บันทึกภาพ QR ลงเครื่องแล้ว');\n    } catch (e) { setMsg('ดาวน์โหลดไม่สำเร็จ: ' + e.message); }\n  }\n\n  lineShareUrl(link, text) {\n    return 'https://social-plugins.line.me/lineit/share?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(text);\n  }\n\n  /** ลิงก์ Kiosk บันทึกอาการรายวัน (F/U) */\n  fuDailyLinkFor(hn) {\n    const base = location.origin + location.pathname;\n    return base + '?mode=fu&hn=' + encodeURIComponent(String(hn || '').trim())\n      + '&nm=' + encodeURIComponent(this.lookupName(hn) || '');\n  }\n\n  /** สร้างลิงก์ประเมินซ้ำจาก HN ที่เลือก */\n  fuLinkFor(hn) {\n    const base = location.origin + location.pathname;\n    return base + '?mode=rcq&hn=' + encodeURIComponent(String(hn || '').trim())\n      + '&nm=' + encodeURIComponent(this.lookupName(hn) || '')\n      + '&rec=' + encodeURIComponent(this.lookupRec(hn) || '');\n  }\n\n  /** หาชื่อ-นามสกุลของ HN จาก patients → sumary → rcq36 */\n  lookupName(hn) {\n    const k = this.hnKeyOf(hn), s = this.state;\n    if (!k) return '';\n    const hit = (this.state.patientsList || []).find(p => this.hnKeyOf(p['HN']) === k);\n    if (hit && hit['ชื่อ-นามสกุล']) return hit['ชื่อ-นามสกุล'];\n    const c = (s.cases || []).find(c => this.hnKeyOf(c.hn) === k && c.name);\n    if (c) return c.name;\n    const r = (s.rcqRows || []).filter(r => this.hnKeyOf(r['HN']) === k && r['ชื่อ-นามสกุล']).pop();\n    return r ? r['ชื่อ-นามสกุล'] : '';\n  }\n\n  /** หารหัสบันทึก sumary ล่าสุดของ HN (ใช้จับคู่ชุด \"หลัง\" เมื่อไม่ได้เปิดจาก QR) */\n  lookupRec(hn) {\n    const k = this.hnKeyOf(hn), s = this.state;\n    if (!k) return '';\n    const byCase = (s.cases || []).filter(c => this.hnKeyOf(c.hn) === k && c.id)\n      .sort((a, b) => String(a.date || '').localeCompare(String(b.date || ''))).pop();\n    if (byCase && /^SUMA/i.test(String(byCase.id))) return byCase.id;\n    const byRcq = (s.rcqRows || []).filter(r => this.hnKeyOf(r['HN']) === k\n      && String(r['ครั้งที่ประเมิน']).indexOf('ก่อน') >= 0 && r['รหัสบันทึก sumary']).pop();\n    return byRcq ? byRcq['รหัสบันทึก sumary'] : '';\n  }\n\n  /** รวมรายชื่อจากทุกแหล่ง (patients → sumary → rcq36) สำหรับช่องค้นหา HN */\n  hnPool() {\n    const s = this.state, seen = {}, out = [];\n    const push = (hn, name) => {\n      hn = String(hn || '').trim(); name = String(name || '').trim();\n      if (!hn && !name) return;\n      const k = this.hnKeyOf(hn) || name;\n      if (seen[k]) { if (!seen[k].name && name) seen[k].name = name; return; }\n      seen[k] = { hn, name };\n      out.push(seen[k]);\n    };\n    (s.patientsList || []).forEach(p => push(p['HN'], p['ชื่อ-นามสกุล']));\n    (s.cases || []).forEach(c => push(c.hn, c.name));\n    (s.rcqRows || []).forEach(r => push(r['HN'], r['ชื่อ-นามสกุล']));\n    return out;\n  }\n\n  /* ───── ทะเบียนผู้ลงทะเบียน (ชีต patients) ───── */\n  async loadPatients() {\n    this.setState({ regBusy: true, regMsg: 'กำลังดึงทะเบียน…', regOk: true });\n    try {\n      const csv = await this.csvRows('patients');\n      if (csv) {\n        this.setState({ patientsList: csv, regMsg: 'ทะเบียน ' + csv.length + ' รายการ', regOk: true, regBusy: false });\n        return;\n      }\n      const res = await fetch(this.state.url + '?key=' + encodeURIComponent(this.state.key) + '&action=patients', { redirect: 'follow' });\n      const j = await res.json();\n      if (!j.ok) throw new Error(j.error || 'อ่านชีตไม่ได้');\n      this.setState({ patientsList: j.rows || [], regMsg: 'ทะเบียน ' + (j.rows || []).length + ' รายการ', regOk: true });\n    } catch (e) {\n      this.setState({ regMsg: 'ดึงทะเบียนไม่ได้: ' + e.message, regOk: false });\n    } finally {\n      this.setState({ regBusy: false });\n    }\n  }\n\n  openReg() {\n    this.setState({\n      regForm: { hn: '', name: '', age: '', sex: 'หญิง', thatu: 'ไฟ', contact: '', comorbid: '', clinic: 'คลินิกแพทย์แผนไทย รพ.ปากชม', consent: false, research: true },\n      regMsg: '', regOk: true\n    });\n  }\n\n  regField(k) {\n    return e => {\n      const t = e.target;\n      const v = t.type === 'checkbox' ? t.checked : t.value;\n      this.setState(s => ({ regForm: { ...s.regForm, [k]: v } }));\n    };\n  }\n\n  async saveReg() {\n    const r = this.state.regForm;\n    if (!r) return;\n    if (!r.hn) { this.setState({ regMsg: 'กรอก HN ก่อนบันทึก', regOk: false }); return; }\n    if (!r.name) { this.setState({ regMsg: 'กรอกชื่อ-นามสกุลก่อนบันทึก', regOk: false }); return; }\n    if (!r.consent) { this.setState({ regMsg: 'ต้องติ๊ก \"ยินยอมเพื่อการรักษา\" ก่อนส่งข้อมูลเข้า Google Sheet', regOk: false }); return; }\n    const dupN = (this.state.patientsList || []).filter(x => this.hnKeyOf(x['HN']) === this.hnKeyOf(r.hn)).length;\n    if (dupN > 0 && !(await this.askDuplicate('patient', r.hn, dupN))) return;\n    this.setState({ regBusy: true, regMsg: 'กำลังบันทึก…', regOk: true });\n    try {\n      const rCid = this.newConsentId();\n      const rSig = await this.uploadSignature('rsig', r.hn, rCid);\n      const res = await this.post({\n        action: 'patient', data: {\n          'HN': r.hn, 'วันที่ลงทะเบียน': new Date().toISOString().slice(0, 10), 'ชื่อ-นามสกุล': r.name,\n          'อายุ (ปี)': r.age, 'เพศ': r.sex, 'ธาตุเจ้าเรือน': r.thatu, 'เบอร์โทร/LINE': r.contact,\n          'โรคร่วม/ข้อห้าม': r.comorbid, 'คลินิก/หน่วยบริการ': r.clinic,\n          ...this.consentFields(r, rSig, rCid)\n        }\n      });\n      if (res.ok) {\n        this.setState({ regForm: null, regMsg: 'ลงทะเบียน HN ' + r.hn + ' เรียบร้อย', regOk: true });\n        this.okPop('ลงทะเบียนผู้ป่วยสำเร็จ', 'HN ' + r.hn + ' · ' + r.name + ' ถูกบันทึกเข้าชีต patients แล้ว');\n        this.loadPatients();\n      } else this.setState({ regMsg: 'ผิดพลาด: ' + res.error, regOk: false });\n    } catch (e) {\n      this.setState({ regMsg: 'บันทึกไม่ได้: ' + e.message, regOk: false });\n    } finally {\n      this.setState({ regBusy: false });\n    }\n  }\n\n  /** โหลด tnss_daily เพื่อวาดแนวโน้มจากข้อมูลจริง */\n  async loadDaily() {\n    try {\n      const csv = await this.csvRows('tnss_daily');\n      if (csv) { this.setState({ daily: csv }); return; }\n      const res = await fetch(this.state.url + '?key=' + encodeURIComponent(this.state.key) + '&action=tnss', { redirect: 'follow' });\n      const j = await res.json();\n      if (j.ok) this.setState({ daily: j.rows || [] });\n    } catch (e) {}\n  }\n\n  /** เฉลี่ย TNSS ต่อ \"วันที่ n หลังรับบริการ\" จากข้อมูลจริง */\n  dailyTrend(cases) {\n    const svc = {};\n    cases.forEach(c => { const k = this.hnKeyOf(c.hn); if (k && c.date) svc[k] = c.date; });\n    const buckets = {};\n    (this.state.daily || []).forEach(r => {\n      const k = this.hnKeyOf(r['HN']);\n      const d0 = svc[k], d1 = this.normDate(r['วันที่ประเมิน']);\n      if (!d0 || !d1) return;\n      const n = Math.round((new Date(d1) - new Date(d0)) / 86400000);\n      if (n < 0 || n > 14) return;\n      const v = Number(r['TNSS รวม']);\n      if (!isFinite(v)) return;\n      (buckets[n] = buckets[n] || []).push(v);\n    });\n    const days = Object.keys(buckets).map(Number).sort((a, b) => a - b);\n    return days.map(n => ({ n, v: buckets[n].reduce((a, b) => a + b, 0) / buckets[n].length, count: buckets[n].length }));\n  }\n\n  hnKeyOf(v) { return String(v || '').trim().replace(/[^0-9]/g, '').replace(/^0+/, ''); }\n\n  /** รับได้ทั้ง 2026-09-17, 17/09/2026, 17/09/2569 → คืน yyyy-mm-dd */\n  normDate(v) {\n    if (!v) return '';\n    const s = String(v).trim();\n    let m = s.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);\n    if (m) return m[1] + '-' + m[2] + '-' + m[3];\n    m = s.match(/^(\\d{1,2})[/-](\\d{1,2})[/-](\\d{4})/);\n    if (m) {\n      let y = Number(m[3]);\n      if (y > 2400) y -= 543;\n      return y + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');\n    }\n    const d = new Date(s);\n    return isNaN(d) ? '' : d.toISOString().slice(0, 10);\n  }\n\n  /* ───── ปฏิทินไทย (พ.ศ.) ───── */\n  openPicker(which) {\n    const cur = this.state[which];\n    const d = cur ? new Date(cur + 'T00:00:00') : new Date();\n    this.setState({ picker: this.state.picker === which ? null : which, viewY: d.getFullYear(), viewM: d.getMonth() });\n  }\n  shiftMonth(n) {\n    let m = this.state.viewM + n, y = this.state.viewY;\n    if (m < 0) { m = 11; y -= 1; }\n    if (m > 11) { m = 0; y += 1; }\n    this.setState({ viewM: m, viewY: y });\n  }\n  pickDay(iso) {\n    const which = this.state.picker;\n    if (!which) return;\n    const next = { [which]: iso, rangeDays: -1, picker: null };\n    // เลือกวันเริ่มแล้วเปิดปฏิทินวันสิ้นสุดต่อทันที ถ้ายังไม่ได้เลือก\n    if (which === 'from' && !this.state.to) { next.picker = 'to'; }\n    this.setState(next);\n  }\n  thaiDate(iso) {\n    if (!iso) return 'เลือกวันที่';\n    const M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];\n    const d = new Date(iso + 'T00:00:00');\n    if (isNaN(d)) return iso;\n    return d.getDate() + ' ' + M[d.getMonth()] + ' ' + (d.getFullYear() + 543);\n  }\n\n  setRange(days) {\n    if (!days) { this.setState({ from: '', to: '', rangeDays: 0, appliedFrom: '', appliedTo: '' }); return; }\n    const to = new Date();\n    const from = new Date(to.getTime() - (days - 1) * 86400000);\n    const f = from.toISOString().slice(0, 10), t = to.toISOString().slice(0, 10);\n    this.setState({ from: f, to: t, rangeDays: days, appliedFrom: f, appliedTo: t });\n  }\n\n  applyRange() {\n    this.setState({ appliedFrom: this.state.from, appliedTo: this.state.to, appliedQ: this.state.q.trim(), picker: null, casePage: 0 });\n  }\n\n  clearSearch() {\n    this.setState({ from: '', to: '', appliedFrom: '', appliedTo: '', q: '', appliedQ: '', rangeDays: 0, casePage: 0 });\n  }\n\n  filtered() {\n    const { cases, appliedFrom: from, appliedTo: to, appliedQ: q } = this.state;\n    let out = cases;\n    if (from || to) {\n      out = out.filter(c => {\n        const d = c.date || '';\n        if (!d) return false;\n        if (from && d < from) return false;\n        if (to && d > to) return false;\n        return true;\n      });\n    }\n    if (q) {\n      const needle = q.toLowerCase();\n      const hnq = this.hnKeyOf(q);\n      out = out.filter(c =>\n        (hnq && this.hnKeyOf(c.hn) === hnq) ||\n        String(c.hn || '').toLowerCase().includes(needle) ||\n        String(c.name || '').toLowerCase().includes(needle) ||\n        String(c.id || '').toLowerCase().includes(needle)\n      );\n    }\n    return out;\n  }\n\n  /** ฤดูตามเดือนที่รับบริการ */\n  autoUtu() {\n    const m = new Date().getMonth() + 1;\n    const hit = UTU.find(u => u.months.indexOf(m) >= 0);\n    return hit ? hit.v : '';\n  }\n\n  normHN(v) { return String(v || '').trim().replace(/^0+/, ''); }\n\n  /** คืนจำนวนรายการ HN ซ้ำในชีตที่ระบุ */\n  async countHN(which, hn) {\n    const target = this.normHN(hn);\n    if (!target) return 0;\n    if (which === 'sumary') {\n      return this.state.cases.filter(c => this.normHN(c.hn) === target).length;\n    }\n    try {\n      const csvP = await this.csvRows('patients');\n      if (csvP) {\n        const k = this.hnKeyOf(hn);\n        return csvP.filter(r => this.hnKeyOf(r['HN']) === k).length;\n      }\n      const res = await fetch(this.state.url + '?key=' + encodeURIComponent(this.state.key) + '&action=patients', { redirect: 'follow' });\n      const j = await res.json();\n      if (!j.ok) return 0;\n      const rows = j.rows || [];\n      this.setState({ patientsList: rows });\n      return rows.filter(r => this.normHN(r['HN']) === target).length;\n    } catch (e) { return 0; }\n  }\n\n  /** ถามยืนยันเมื่อพบ HN ซ้ำ — คืน true ถ้าให้บันทึกต่อ */\n  askDuplicate(kind, hn, n) {\n    return new Promise(resolve => {\n      this.setState({\n        dupAsk: {\n          hn, n, kind,\n          title: 'มีรายการ HN นี้ในระบบแล้ว',\n          body: kind === 'patient'\n            ? 'HN ' + hn + ' มีอยู่ในทะเบียนผู้ป่วยแล้ว ' + n + ' รายการ — บันทึกซ้ำจะทำให้มีทะเบียนซ้อนกัน'\n            : 'HN ' + hn + ' มีประวัติการสุมยาแล้ว ' + n + ' ครั้ง — บันทึกซ้ำจะทำให้มีทะเบียนซ้อนกัน',\n          ok: () => { this.setState({ dupAsk: null }); resolve(true); },\n          cancel: () => {\n            this.setState(kind === 'session'\n              ? { dupAsk: null, sessionMsg: 'ยกเลิกการบันทึก (HN ซ้ำ)', sessionOk: false }\n              : { dupAsk: null, intakeMsg: 'ยกเลิกการบันทึก (HN ซ้ำ)', intakeOk: false });\n            resolve(false);\n          }\n        }\n      });\n    });\n  }\n\n  /* ───── e-Consent: แผ่นลายเซ็น ───── */\n  bindPad(key) {\n    return el => {\n      if (!el) return;\n      this._pads = this._pads || {};\n      if (this._pads[key] && this._pads[key].el === el) return;\n      const ctx = el.getContext('2d');\n      ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14201B';\n      const pad = { el, ctx, drawing: false, dirty: false };\n      this._pads[key] = pad;\n      const pt = e => {\n        const r = el.getBoundingClientRect();\n        const t = e.touches ? e.touches[0] : e;\n        return [(t.clientX - r.left) * (el.width / r.width), (t.clientY - r.top) * (el.height / r.height)];\n      };\n      const down = e => { e.preventDefault(); pad.drawing = true; pad.dirty = true; const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); };\n      const move = e => { if (!pad.drawing) return; e.preventDefault(); const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); };\n      const up = () => { pad.drawing = false; };\n      el.addEventListener('pointerdown', down);\n      el.addEventListener('pointermove', move);\n      window.addEventListener('pointerup', up);\n    };\n  }\n\n  clearPad(key) {\n    const p = this._pads && this._pads[key];\n    if (!p) return;\n    p.ctx.clearRect(0, 0, p.el.width, p.el.height);\n    p.dirty = false;\n  }\n\n  /** ส่งลายเซ็นขึ้น Drive → คืน URL (ว่างถ้าไม่ได้เซ็น) */\n  async uploadSignature(key, hn, cid) {\n    const p = this._pads && this._pads[key];\n    if (!p || !p.dirty) return '';\n    try {\n      const b64 = p.el.toDataURL('image/png').split(',')[1];\n      const r = await this.post({ action: 'consent', hn: hn, consentId: cid, base64: b64 });\n      return (r && r.url) || '';\n    } catch (e) { return ''; }\n  }\n\n  /** สร้างรหัสความยินยอม CONS-YYMMDD-HHMMSS-xxx */\n  newConsentId() {\n    const d = new Date(), p = n => String(n).padStart(2, '0');\n    return 'CONS-' + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate())\n      + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds())\n      + '-' + Math.random().toString(36).slice(2, 5).toUpperCase();\n  }\n\n  /** ฟิลด์ e-Consent สำหรับส่งลงชีต patients */\n  consentFields(rec, sigUrl, consentId) {\n    return {\n      'consentID': consentId || this.newConsentId(),\n      'ยินยอม PDPA': rec.consent ? 'ยินยอม' : 'ไม่ยินยอม',\n      'ยินยอมเพื่อการรักษา': rec.consent ? 'ยินยอม' : 'ไม่ยินยอม',\n      'ยินยอมเพื่องานวิจัย R2R': rec.research ? 'ยินยอม' : 'ไม่ยินยอม',\n      'วันเวลาที่ให้ความยินยอม': this.stampNow(),\n      'เวอร์ชันข้อความยินยอม': CONSENT_VERSION,\n      'ผู้รับความยินยอม': this.state.form.provider || '',\n      'ลิงก์ลายเซ็น/ภาพยินยอม': sigUrl || ''\n    };\n  }\n\n  stampNow() {\n    const d = new Date(), p = n => String(n).padStart(2, '0');\n    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());\n  }\n\n  /** ล้างข้อมูลหัตถการทั้ง 5 ขั้น แล้วกลับไปหน้าแดชบอร์ด */\n  resetSession() {\n    const herb = {};\n    HERBS.forEach(h => herb[h.key] = h.def);\n    const f = this.state.form;\n    this.stopCam && this.stopCam();\n    this.stopTimer && this.stopTimer();\n    this.setState({\n      screen: 'dash', step: 1, sel: null,\n      form: {\n        ...f, hn: '', name: '', age: 38, sex: 'หญิง', thatu: 'ไฟ',\n        utu: '', kala: KALA[0].v, tri: '', consent: false, research: true,\n        ae: 'ไม่มี', satis: 5, sus: 85, note: ''\n      },\n      herb,\n      tnss: { sneeze: 2, rhino: 2, block: 3, itch: 1 },\n      pre: null, post: null, rec: '', recSec: 0, recErr: '', wave: [],\n      camOn: false, dist: null, minDist: null, alerts: 0, manualMode: false, camErr: '', detMsg: '',\n      running: false, elapsed: 0, advice: '', aiBusy: false,\n      rcq: {}, rcqHealth: '', rcqDaysOff: '', rcqOpen: '',\n      intakeMsg: '', sessionMsg: '', linked: false, linkedRec: '',\n      recordId: 'SUMA-' + new Date().toISOString().slice(2, 19).replace(/[-:T]/g, '').slice(0, 6) + '-' + new Date().toISOString().slice(11, 19).replace(/:/g, '')\n    }, () => this.loadSheet(true));\n  }\n\n  async submitSession() {\n    const f = this.state.form;\n    const say = (m, ok) => this.setState({ sessionMsg: m, sessionOk: ok !== false });\n    if (!f.consent) { say('ต้องติ๊ก \"ยินยอมเพื่อการรักษา\" ในขั้นที่ 1 ก่อน', false); return; }\n    if (!f.hn) { say('กรอก HN ก่อนส่ง', false); return; }\n    const total = this.herbTotal();\n    if (Math.abs(total - 100) > 0.5) { say('สัดส่วนสมุนไพรรวม ' + total + '% (ต้อง 100%)', false); return; }\n    const dupN = await this.countHN('sumary', f.hn);\n    if (dupN > 0 && !(await this.askDuplicate('session', f.hn, dupN))) return;\n    const pre = this.state.pre, post = this.state.post, t = this.state.tnss;\n    const rule = this._next ? { next: this._next } : this.ruleAdvice();\n    const tPre = this.tnssTotal();\n    const data = {\n      'ยินยอม PDPA': 'ยินยอม', 'HN': f.hn, 'ชื่อ-นามสกุล': f.name, 'อายุ (ปี)': f.age, 'เพศ': f.sex,\n      'ธาตุเจ้าเร ังไม่ได้เชื่อมต่อ',\n      cfgStatusColor: s.linked ? '#1E6B54' : s.autoLoading ? '#8A7250' : '#B4462F',\n      cfgDot: s.linked ? '#8FE3B8' : s.autoLoading ? '#E0B36A' : '#E8A79B',\n      onUrl: e => this.setState({ url: e.target.value.trim() }, () => this.saveCfg()),\n      onKey: e => this.setState({ key: e.target.value.trim() }, () => this.saveCfg()),\n      testLink: () => this.testLink(),\n      loadSheet: () => this.loadSheet(),\n      sheetDocs: [\n        { name: 'sumary', cols: 'ตารางเก็บข้อมูลหลัก', desc: '1 แถว = 1 ครั้งการสุมยา · ข้อมูลผู้ป่วย, สมุฏฐานการเกิดโรค, ตำรับยา 5 ชนิด, Patency ก่อน–หลัง, ลิงก์ไฟล์เสียง, ความปลอดภัย AR, TNSS ก่อน/หลัง/ลดลง (ดึงจาก tnss_daily), ผลแปล RCQ-36, คำแนะนำ AI และต้นทุน · เป็นแหล่งข้อมูลของแดชบอร์ด R2R และทะเบียนเคส' },\n        { name: 'rcq36', cols: 'ตารางเก็บข้อมูลแบบประเมิน RCQ-36 (ก่อน/หลังรับบริการ)', desc: '1 แถว = 1 ชุดแบบประเมิน · คะแนนรายด้านทั้ง 9 ด้าน คะแนนรวม ค่าเฉลี่ยต่อข้อ และระดับผลกระทบ · จับคู่ชุดก่อน–หลังด้วย HN และรหัสบันทึก sumary (จาก QR/ลิงก์) ใช้เปรียบเทียบคุณภาพชีวิตก่อน–หลังบนแดชบอร์ด' },\n        { name: 'tnss_daily', cols: 'ตารางเก็บข้อมูล TNSS', desc: '1 แถว = 1 วันของการติดตามอาการ · คะแนน 4 อาการ (จาม/น้ำมูก/คัด/คัน) และคะแนนรวม · ใช้คำนวณ TNSS หลัง และ % การลดลง ส่งกลับไปแสดงในชีต sumary และกราฟแนวโน้ม 7–14 วัน' },\n        { name: 'patients', cols: 'ตารางเก็บข้อมูลการลงทะเบียนผู้ป่วย', desc: '1 แถว = ผู้ป่วย 1 ราย ลงทะเบียนครั้งเดียว · HN, ชื่อ-นามสกุล, อายุ, เพศ, ธาตุเจ้าเรือน, ช่องทางติดต่อ, โรคร่วม/ข้อห้าม, ความยินยอม PDPA · ใช้ HN เป็นคีย์เชื่อมทุกชีตและเป็นฐานของช่องค้นหาผู้ป่วยทั้งระบบ' },\n        { name: 'lookup', cols: 'ตารางเก็บข้อมูลอื่น ๆ', desc: 'ค่าตั้งต้นที่แก้ไขเองได้โดยไม่ต้องแก้โปรแกรม · สูตรยามาตรฐาน, รายชื่อผู้ทำหัตถการ (พท.), คลินิก/หน่วยบริการ, รหัส ICD-10 และต้นทุนต่อครั้ง' }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
