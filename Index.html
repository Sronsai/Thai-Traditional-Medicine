nssTotal() { return TNSS_KEYS.reduce((a, k) => a + (this.state.tnss[k.key] || 0), 0); }\n\n  /* ───────── sheet I/O ───────── */\n  saveCfg() {\n    try { localStorage.setItem('sumaai.cfg', JSON.stringify({ url: this.state.url, key: this.state.key })); } catch (e) {}\n  }\n\n  /** ลิงก์ QR ของผู้ป่วยไม่ต้องเข้าสู่ระบบ */\n  isPatientLink() {\n    try {\n      const q = new URLSearchParams(location.search);\n      const mode = q.get('mode');\n      return (mode === 'fu' || mode === 'rcq' || !!q.get('rec')) && q.get('full') !== '1';\n    } catch (e) { return false; }\n  }\n\n  /** อ่านสถานะเข้าสู่ระบบ (หมดอายุ 12 ชั่วโมง) */\n  readAuth() {\n    try {\n      const a = JSON.parse(localStorage.getItem('suma.auth') || 'null');\n      if (a && a.at && Date.now() - a.at < 12 * 3600 * 1000) return a;\n      localStorage.removeItem('suma.auth');\n    } catch (e) {}\n    return null;\n  }\n\n  async doLogin() {\n    const u = this.state.loginUser.trim(), p = this.state.loginPass;\n    if (!u || !p) { this.setState({ loginMsg: 'กรอกชื่อผู้ใช้และรหัสผ่าน' }); return; }\n    const url = this.state.url || this._url || DEFAULT_URL;\n    const key = this.state.key || this._key || DEFAULT_KEY;\n    this.setState({ loginBusy: true, loginMsg: '', loginStage: 'กำลังตรวจสอบ…' });\n    const attempt = async (ms) => {\n      const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;\n      const timer = setTimeout(() => ctl && ctl.abort(), ms);\n      try {\n        const res = await fetch(url, {\n          method: 'POST', redirect: 'follow', signal: ctl ? ctl.signal : undefined,\n          headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n          body: JSON.stringify({ key: key, action: 'login', user: u, pass: p })\n        });\n        return await res.text();\n      } finally { clearTimeout(timer); }\n    };\n    try {\n      let t;\n      try {\n        t = await attempt(15000);\n      } catch (e1) {\n        // ครั้งแรกมักช้าเพราะ Apps Script เพิ่งตื่น — ลองใหม่อีกครั้งอัตโนมัติ\n        this.setState({ loginStage: 'ระบบกำลังเริ่มทำงาน ลองอีกครั้ง…' });\n        t = await attempt(20000);\n      }\n      let r;\n      try { r = JSON.parse(t); } catch (e) { throw new Error('ระบบยังไม่พร้อม — ตรวจว่า Deploy › New version แล้ว'); }\n      if (!r.ok) { this.setState({ loginMsg: r.error || 'เข้าสู่ระบบไม่สำเร็จ', loginPass: '' }); return; }\n      const auth = { id: r.id || '', fullname: r.fullname || u, user: r.user || u, at: Date.now() };\n      try { localStorage.setItem('suma.auth', JSON.stringify(auth)); } catch (e) {}\n      this.setState({ auth, loginPass: '', loginMsg: '' });\n    } catch (e) {\n      const m = e && e.name === 'AbortError' ? 'ระบบตอบช้าเกินไป กรุณากดเข้าสู่ระบบอีกครั้ง' : ('เชื่อมต่อระบบไม่ได้: ' + e.message);\n      this.setState({ loginMsg: m });\n    } finally {\n      this.setState({ loginBusy: false, loginStage: '' });\n    }\n  }\n\n  /** ปลุก Apps Script ล่วงหน้าตอนเปิดหน้า Login ให้กดเข้าแล้วตอบเร็ว */\n  warmUp() {\n    const url = this.state.url || this._url || DEFAULT_URL;\n    const key = this.state.key || this._key || DEFAULT_KEY;\n    if (!url) return;\n    try {\n      fetch(url, {\n        method: 'POST', redirect: 'follow',\n        headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n        body: JSON.stringify({ key: key, action: 'ping' })\n      }).catch(() => {});\n    } catch (e) {}\n  }\n\n  logout() {\n    try { localStorage.removeItem('suma.auth'); } catch (e) {}\n    this.setState({ auth: null, loginUser: '', loginPass: '', loginMsg: '', navOpen: false, screen: 'dash', step: 1 });\n  }\n\n  refreshUsage() {\n    if (!this.state.url || this._usageBusy) return;\n    this._usageBusy = true;\n    this.post({ action: 'usage' }).then(r => {\n      if (r && r.ok && typeof r.usd === 'number') this.setState({ aiUsd: r.usd, aiUsdWhy: '' });\n      else this.setState({ aiUsdWhy: (r && r.error) ? 'Apps Script: ' + r.error + ' — ต้องวาง Code.gs ใหม่แล้วกด Deploy › New version' : 'Apps Script ไม่ส่งยอดกลับ — ต้องวาง Code.gs ใหม่แล้วกด Deploy › New version' });\n    }).catch(e => this.setState({ aiUsdWhy: 'อ่านยอดไม่ได้: ' + e.message }))\n      .finally(() => { this._usageBusy = false; });\n  }\n\n  async post(payload) {\n    if (!this.state.url) throw new Error('ยังไม่ได้ตั้งค่า Web App URL (ไปที่แท็บ ตั้งค่า)');\n    const res = await fetch(this.state.url, {\n      method: 'POST', redirect: 'follow',\n      headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n      body: JSON.stringify({ key: this.state.key, ...payload })\n    });\n    const t = await res.text();\n    try {\n      const j = JSON.parse(t);\n      if (j && typeof j.usageUsd === 'number') this.setState({ aiUsd: j.usageUsd });\n      return j;\n    } catch (e) {\n      const m = String(t).match(/<title>([^<]*)<\\/title>/i) || String(t).match(/(Exception|Error)[^<]{0,160}/i);\n      throw new Error('Apps Script ตอบกลับไม่ใช่ข้อมูล JSON' + (m ? ' (' + (m[1] || m[0]).trim().slice(0, 140) + ')' : '') + ' — ลองวาง Code.gs ล่าสุดแล้วกด Deploy › New version');\n    }\n  }\n\n  async testLink() {\n    this.saveCfg();\n    this.setState({ submitMsg: 'กำลังทดสอบ…', submitOk: true });\n    try {\n      const r = await this.post({ action: 'ping' });\n      this.setState({ submitMsg: r.ok ? 'เชื่อมต่อสำเร็จ · ' + r.at : ('ผิดพลาด: ' + r.error), submitOk: !!r.ok, linked: !!r.ok });\n    } catch (e) {\n      this.setState({ submitMsg: 'เชื่อมต่อไม่ได้: ' + e.message, submitOk: false, linked: false });\n    }\n  }\n\n  /** ดึงชีตเป็น CSV — คืน array ของ object หรือ null ถ้าอ่านไม่ได้ */\n  async csvRows(name, signal) {\n    const u = CSV_BY_NAME[name];\n    if (!u) return null;\n    try {\n      const r = await fetch(u + '&t=' + Date.now(), { signal });\n      if (!r.ok) return null;\n      const t = await r.text();\n      if (!t || /^\\s*<\u002F.test(t)) return null;\n      return parseCSV(t);\n    } catch (e) { return null; }\n  }\n\n  async loadSheet(auto) {\n    const url = this.state.url || this._url || DEFAULT_URL;\n    const key = this.state.key || this._key || DEFAULT_KEY;\n    if (!url && !PUB_CSV) {\n      if (!auto) this.setState({ screen: 'set', submitMsg: 'ใส่ Web App URL ก่อนดึงข้อมูล', submitOk: false });\n      return;\n    }\n    this.setState({ submitMsg: 'กำลังดึงข้อมูล…', submitOk: true, autoLoading: true });\n    const ac = new AbortController();\n    const killer = setTimeout(() => ac.abort(), 9000);\n    try {\n      let raw = null, via = '';\n      // 1) gviz CSV ตามชื่อชีต — เร็วที่สุด\n      {\n        const c = await this.csvRows('sumary', ac.signal);\n        if (c && c.length) { raw = c; via = 'CSV (sumary)'; }\n      }\n      if (!raw && PUB_CSV) {\n        try {\n          const r0 = await fetch(PUB_CSV + '&t=' + Date.now(), { signal: ac.signal });\n          if (r0.ok) {\n            const t0 = await r0.text();\n            if (t0 && !/^\\s*<\u002F.test(t0)) { raw = parseCSV(t0); via = 'ชีตเผยแพร่ (CSV)'; }\n          }\n        } catch (e0) { if (e0 && e0.name === 'AbortError') throw e0; }\n      }\n      // 2) สำรอง: Apps Script\n      if (!raw && !url) throw new Error('ดึงชีตเผยแพร่ (CSV) ไม่สำเร็จ — ตรวจว่าลิงก์เผยแพร่ยังใช้งานได้');\n      if (!raw) {\n        const res = await fetch(url + '?key=' + encodeURIComponent(key) + '&action=sumary', { redirect: 'follow', signal: ac.signal });\n        const txt = await res.text();\n        let j;\n        try { j = JSON.parse(txt); }\n        catch (pe) { throw new Error('ชีตตอบกลับไม่ใช่ JSON — ตรวจว่า Deploy เป็น Web app แบบ Anyone และใช้ URL ที่ลงท้าย /exec'); }\n        if (!j.ok) throw new Error(j.error || 'อ่านชีตไม่ได้');\n        raw = j.rows || [];\n        via = 'Apps Script';\n      }\n      this._via = via;\n      this.loadDaily();\n      // อ่านค่าตัวเลขแบบทนต่อช่องว่าง/เครื่องหมายจุลภาค/หัวคอลัมน์เพี้ยน\n      const norm = k => String(k).replace(/[\\s\\u00A0\\u200B]/g, '').toLowerCase();\n      const cell = (r, names) => {\n        for (const nm of names) { if (r[nm] !== undefined && r[nm] !== '') return r[nm]; }\n        const want = names.map(norm);\n        for (const k in r) { if (want.indexOf(norm(k)) >= 0 && r[k] !== '') return r[k]; }\n        return '';\n      };\n      const num = (r, names) => {\n        const v = cell(r, names);\n        if (v === '' || v === null) return 0;\n        const n = parseFloat(String(v).replace(/[\\s\\u00A0,%]/g, ''));\n        return isFinite(n) ? n : 0;\n      };\n      const sumParts = str => String(str || '').split('/').reduce((a, x) => a + (parseFloat(x) || 0), 0);\n      const rows = raw.map((r, i) => {\n        const pre = num(r, ['Patency ก่อน (%)']), post = num(r, ['Patency หลัง (%)']);\n        const t0 = num(r, ['TNSS รวมก่อน']) || sumParts(cell(r, ['TNSS ก่อน (จาม/น้ำมูก/คัด/คัน)']));\n        const t1 = num(r, ['TNSS รวมหลัง']) || sumParts(cell(r, ['TNSS หลัง (จาม/น้ำมูก/คัด/คัน)']));\n        return {\n          id: r['รหัสบันทึก'] || 'row ' + (i + 2), hn: r['HN'], thatu: r['ธาตุเจ้าเรือน'],\n          date: this.normDate(r['วันที่รับบริการ'] || r['วันที่-เวลาบันทึก']),\n          name: r['ชื่อ-นามสกุล'] || '', provider: r['ผู้ทำหัตถการ (พท.)'] || '',\n          age: r['อายุ (ปี)'], sex: r['เพศ'], pre, post, gain: post - pre,\n          tnssPre: t0, tnssPost: t1,\n          tnssDrop: (t0 && t1) ? Math.round((1 - t1 / t0) * 1000) / 10 : (num(r, ['TNSS ลดลง (%)']) || 0),\n          predom: r['กลุ่มอาการเด่น'] || '—', ae: r['เหตุการณ์ไม่พึงประสงค์'] || 'ไม่มี',\n          minDist: Number(r['ระยะใกล้สุด (ซม.)']) || 0, alerts: Number(r['จำนวนแจ้งเตือนระยะ']) || 0,\n          adherence: Number(r['ทำครบเวลา (%)']) || 0, advice: r['คำแนะนำปรับสูตรจาก AI']\n        };\n      });\n      if (!rows.length) { this.setState({ submitMsg: 'ชีต sumary ยังไม่มีข้อมูล — แสดงเคสตัวอย่างต่อไป', submitOk: false }); return; }\n      this.setState({ cases: rows, fromSheet: true, linked: true, submitMsg: 'ดึงข้อมูลสำเร็จ ' + rows.length + ' แถว · ' + this._via, submitOk: true });\n    } catch (e) {\n      const aborted = e && (e.name === 'AbortError' || /abort/i.test(e.message || ''));\n      this.setState({\n        submitMsg: aborted\n          ? 'เชื่อมต่อชีตไม่สำเร็จภายในเวลาที่กำหนด — ตรวจอินเทอร์เน็ตหรือการ Deploy ของ Apps Script'\n          : 'ดึงข้อมูลไม่ได้: ' + e.message,\n        submitOk: false, linked: false\n      });\n    } finally {\n      clearTimeout(killer);\n      this.setState({ autoLoading: false });\n    }\n  }\n\n  /* ───── RCQ-36 ───── */\n  setRcq(key, v) {\n    this.setState(s => {\n      const rcq = { ...s.rcq, [key]: v };\n      const next = { rcq };\n      // ด้าน 1 ข้อ 1–4 ซ้ำกับ TNSS → เติมให้อัตโนมัติ (พท. แก้ทับได้)\n      const map = { d1_1: 'rhino', d1_2: 'itch', d1_3: 'block', d1_4: 'sneeze' };\n      if (map[key] && s.screen === 'tp') next.tnss = { ...s.tnss, [map[key]]: rcqToTnss(v) };\n      return next;\n    });\n  }\n\n  rcqStats(obj) {\n    const src = obj || this.state.rcq;\n    const vals = RCQ_KEYS.map(k => Number(src[k]) || 0);\n    const answered = vals.filter(v => v > 0).length;\n    const total = vals.reduce((a, b) => a + b, 0);\n    const avg = answered ? total / answered : 0;\n    const domains = RCQ_DOMAINS.map(d => {\n      const dv = d.items.map((_, i) => Number(src[d.id + '_' + (i + 1)]) || 0).filter(v => v > 0);\n      return { no: d.no, title: d.title, color: d.color, sum: dv.reduce((a, b) => a + b, 0), n: dv.length, max: d.items.length * 5 };\n    });\n    return { answered, total, avg: Math.round(avg * 100) / 100, domains, complete: answered === RCQ_N };\n  }\n\n  async submitRcq(phase) {\n    const st = this.rcqStats();\n    const hn = phase === 'หลัง' ? this.state.rcqHN : this.state.form.hn;\n    if (!hn) { this.setState({ rcqMsg: 'กรอก HN ก่อนบันทึก', rcqOk: false }); return; }\n    if (st.answered === 0) { this.setState({ rcqMsg: 'ยังไม่ได้ตอบข้อใดเลย', rcqOk: false }); return; }\n    if (phase === 'ก่อน' && !this.state.form.consent) { this.setState({ rcqMsg: 'ต้องติ๊กความยินยอม PDPA ก่อนส่งข้อมูล', rcqOk: false }); return; }\n    const data = {\n      'HN': hn, 'ชื่อ-นามสกุล': phase === 'ก่อน' ? this.state.form.name : (this.lookupName(hn) || this.state.qrName || ''),\n      'ครั้งที่ประเมิน': phase,\n      'รหัสบันทึก sumary': phase === 'หลัง' ? (this.state.linkedRec || this.lookupRec(hn)) : this.state.recordId,\n      'สุขภาพโดยรวม': this.state.rcqHealth, 'วันหยุดงาน/เรียน (วัน/เดือน)': this.state.rcqDaysOff,\n      'คะแนนรวม (34-170)': st.total, 'เฉลี่ยต่อข้อ': st.avg,\n      'แปลผล RCQ-36': rcqBand(st.avg).label,\n      'ดีขึ้น (%)': (() => {\n        if (phase !== 'หลัง') return '';\n        const p = this.rcqPreTotalOf(hn);\n        const pct = rcqImprovePct(p, st.total);\n        return pct === null ? '' : pct;\n      })(),\n      'แปลผลการเปลี่ยนแปลง': (() => {\n        if (phase !== 'หลัง') return '';\n        const pct = rcqImprovePct(this.rcqPreTotalOf(hn), st.total);\n        return pct === null ? '' : rcqImproveBand(pct).label;\n      })(),\n      'หมายเหตุ': st.complete ? '' : 'ตอบ ' + st.answered + '/' + RCQ_N + ' ข้อ'\n    };\n    RCQ_DOMAINS.forEach(d => d.items.forEach((it, i) => {\n      data[d.id + '_' + (i + 1) + ' ' + it] = this.state.rcq[d.id + '_' + (i + 1)] || '';\n    }));\n    st.domains.forEach(d => data['คะแนนด้าน ' + d.no + ' ' + d.title] = d.sum);\n    this.setState({ rcqBusy: true, rcqMsg: 'กำลังบันทึก…', rcqOk: true });\n    try {\n      const r = await this.post({ action: 'rcq36', data });\n      this.setState({ rcqMsg: r.ok ? 'บันทึก RCQ-36 (' + phase + ') เรียบร้อย · ' + st.total + ' คะแนน' : 'ผิดพลาด: ' + r.error, rcqOk: !!r.ok });\n      if (r.ok) this.okPop('บันทึกแบบสอบถาม RCQ-36 (' + phase + ') สำเร็จ', 'ข้อมูลถูกส่งเข้าชีต rcq36 แล้ว · คะแนนรวม ' + st.total + ' คะแนน');\n      if (r.ok && phase === 'หลัง') this.loadRcq();\n    } catch (e) {\n      this.setState({ rcqMsg: 'บันทึกไม่ได้: ' + e.message, rcqOk: false });\n    } finally {\n      this.setState({ rcqBusy: false });\n    }\n  }\n\n  async loadRcq() {\n    try {\n      const csv = await this.csvRows('rcq36');\n      if (csv) { this.setState({ rcqRows: csv }); return; }\n      const res = await fetch(this.state.url + '?key=' + encodeURIComponent(this.state.key) + '&action=rcq36', { redirect: 'follow' });\n      const j = await res.json();\n      if (j.ok) this.setState({ rcqRows: j.rows || [] });\n    } catch (e) {}\n  }\n\n  /** ป๊อปอัปแจ้งบันทึกสำเร็จ */\n  okPop(title, detail) { this.setState({ okAsk: { title, detail } }); }\n\n  /** % ดีขึ้น RCQ-36 ของ HN จากชีต rcq36 (คอลัมน์ \"ดีขึ้น (%)\" ถ้ามี ไม่มีจึงคำนวณจากคะแนนก่อน–หลัง) */\n  rcqPctOf(hn) {\n    const key = this.hnKeyOf(hn);\n    if (!key) return null;\n    const rows = (this.state.rcqRows || []).filter(r => this.hnKeyOf(r['HN']) === key);\n    if (!rows.length) return null;\n    const posts = rows.filter(r => String(r['ครั้งที่ประเมิน']).indexOf('หลัง') >= 0);\n    const last = posts[posts.length - 1];\n    if (!last) return null;\n    const saved = last['ดีขึ้น (%)'];\n    if (saved !== '' && saved !== undefined && saved !== null && !isNaN(Number(saved))) return Number(saved);\n    const pres = rows.filter(r => String(r['ครั้งที่ประเมิน']).indexOf('ก่อน') >= 0);\n    const pre = pres[pres.length - 1];\n    if (!pre) return null;\n    return rcqImprovePct(Number(pre['คะแนนรวม (34-170)']), Number(last['คะแนนรวม (34-170)']));\n  }\n\n  /** คะแนนรวมชุด \"ก่อน\" ล่าสุดของ HN */\n  rcqPreTotalOf(hn) {\n    const key = this.hnKeyOf(hn);\n    const rows = (this.state.rcqRows || []).filter(r => this.hnKeyOf(r['HN']) === key\n      && String(r['ครั้งที่ประเมิน']).indexOf('ก่อน') >= 0);\n    const byRec = this.state.linkedRec\n      ? rows.filter(r => String(r['รหัสบันทึก sumary'] || '').trim() === String(this.state.linkedRec).trim())\n      : [];\n    const pre = (byRec.length ? byRec : rows).pop();\n    return pre ? Number(pre['คะแนนรวม (34-170)']) || 0 : 0;\n  }\n\n  /** ดึงภาพ QR เป็นไฟล์ PNG */\n  async qrBlob(link) {\n    const url = 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=16&data=' + encodeURIComponent(link);\n    const r = await fetch(url);\n    if (!r.ok) throw new Error('โหลดภาพ QR ไม่ได้');\n    return await r.blob();\n  }\n\n  /** แชร์ลิงก์ + ภาพ QR ผ่านช่องทางของเครื่อง */\n  async shareQr(link, title, text, setMsg) {\n    try {\n      let files = [];\n      try {\n        const b = await this.qrBlob(link);\n        const file = new File([b], 'qr-pch-sumya.png', { type: 'image/png' });\n        if (navigator.canShare && navigator.canShare({ files: [file] })) files = [file];\n      } catch (e) {}\n      if (navigator.share) {\n        await navigator.share(files.length ? { title, text: text + '\\n' + link, files } : { title, text, url: link });\n        setMsg('ส่งต่อเรียบร้อย');\n      } else {\n        await navigator.clipboard.writeText(link);\n        setMsg('เครื่องนี้ไม่รองรับการแชร์โดยตรง — คัดลอกลิงก์ให้แล้ว วางในแชตได้เลย');\n      }\n    } catch (e) {\n      if (e && e.name === 'AbortError') return;\n      setMsg('แชร์ไม่สำเร็จ: ' + e.message);\n    }\n  }\n\n  /** ดาวน์โหลดภาพ QR */\n  async downloadQr(link, name, setMsg) {\n    try {\n      const b = await this.qrBlob(link);\n      const u = URL.createObjectURL(b);\n      const a = document.createElement('a');\n      a.href = u; a.download = name + '.png';\n      document.body.appendChild(a); a.click(); a.remove();\n      setTimeout(() => URL.revokeObjectURL(u), 4000);\n      setMsg('บันทึกภาพ QR ลงเครื่องแล้ว');\n    } catch (e) { setMsg('ดาวน์โหลดไม่สำเร็จ: ' + e.message); }\n  }\n\n  lineShareUrl(link, text) {\n    return 'https://social-plugins.line.me/lineit/share?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(text);\n  }\n\n  /** ลิงก์ Kiosk บันทึกอาการรายวัน (F/U) */\n  fuDailyLinkFor(hn) {\n    const base = location.origin + location.pathname;\n    return base + '?mode=fu&hn=' + encodeURIComponent(String(hn || '').trim())\n      + '&nm=' + encodeURIComponent(this.lookupName(hn) || '')\n      + '&rec=' + encodeURIComponent(this.lookupRec(hn) || '');\n  }\n\n  /** สร้างลิงก์ประเมินซ้ำจาก HN ที่เลือก */\n  fuLinkFor(hn) {\n    const base = location.origin + location.pathname;\n    return base + '?mode=rcq&hn=' + encodeURIComponent(String(hn || '').trim())\n      + '&nm=' + encodeURIComponent(this.lookupName(hn) || '')\n      + '&rec=' + encodeURIComponent(this.lookupRec(hn) || '');\n  }\n\n  /** หาชื่อ-นามสกุลของ HN จาก patients → sumary → rcq36 */\n  lookupName(hn) {\n    const k = this.hnKeyOf(hn), s = this.state;\n    if (!k) return '';\n    const hit = (this.state.patientsList || []).find(p => this.hnKeyOf(p['HN']) === k);\n    if (hit && hit['ชื่อ-นามสกุล']) return hit['ชื่อ-นามสกุล'];\n    const c = (s.cases || []).find(c => this.hnKeyOf(c.hn) === k && c.name);\n    if (c) return c.name;\n    const r = (s.rcqRows || []).filter(r => this.hnKeyOf(r['HN']) === k && r['ชื่อ-นามสกุล']).pop();\n    return r ? r['ชื่อ-นามสกุล'] : '';\n  }\n\n  /** หารหัสบันทึก sumary ล่าสุดของ HN (ใช้จับคู่ชุด \"หลัง\" เมื่อไม่ได้เปิดจาก QR) */\n  lookupRec(hn) {\n    const k = this.hnKeyOf(hn), s = this.state;\n    if (!k) return '';\n    const byCase = (s.cases || []).filter(c => this.hnKeyOf(c.hn) === k && c.id)\n      .sort((a, b) => String(a.date || '').localeCompare(String(b.date || ''))).pop();\n    if (byCase && /^SUMA/i.test(String(byCase.id))) return byCase.id;\n    const byRcq = (s.rcqRows || []).filter(r => this.hnKeyOf(r['HN']) === k\n      && String(r['ครั้งที่ประเมิน']).indexOf('ก่อน') >= 0 && r['รหัสบันทึก sumary']).pop();\n    return byRcq ? byRcq['รหัสบันทึก sumary'] : '';\n  }\n\n  /** รวมรายชื่อจากทุกแหล่ง (patients → sumary → rcq36) สำหรับช่องค้นหา HN */\n  hnPool() {\n    const s = this.state, seen = {}, out = [];\n    const push = (hn, name) => {\n      hn = String(hn || '').trim(); name = String(name || '').trim();\n      if (!hn && !name) return;\n      const k = this.hnKeyOf(hn) || name;\n      if (seen[k]) { if (!seen[k].name && name) seen[k].name = name; return; }\n      seen[k] = { hn, name };\n      out.push(seen[k]);\n    };\n    (s.patientsList || []).forEach(p => push(p['HN'], p['ชื่อ-นามสกุล']));\n    (s.cases || []).forEach(c => push(c.hn, c.name));\n    (s.rcqRows || []).forEach(r => push(r['HN'], r['ชื่อ-นามสกุล']));\n    return out;\n  }\n\n  /* ───── ทะเบียนผู้ลงทะเบียน (ชีต patients) ───── */\n  async loadPatients() {\n    this.setState({ regBusy: true, regMsg: 'กำลังดึงทะเบียน…', regOk: true });\n    try {\n      const csv = await this.csvRows('patients');\n      if (csv) {\n        this.setState({ patientsList: csv, regMsg: 'ทะเบียน ' + csv.length + ' รายการ', regOk: true, regBusy: false });\n        return;\n      }\n      const res = await fetch(this.state.url + '?key=' + encodeURIComponent(this.state.key) + '&action=patients', { redirect: 'follow' });\n      const j = await res.json();\n      if (!j.ok) throw new Error(j.error || 'อ่านชีตไม่ได้');\n      this.setState({ patientsList: j.rows || [], regMsg: 'ทะเบียน ' + (j.rows || []).length + ' รายการ', regOk: true });\n    } catch (e) {\n      this.setState({ regMsg: 'ดึงทะเบียนไม่ได้: ' + e.message, regOk: false });\n    } finally {\n      this.setState({ regBusy: false });\n    }\n  }\n\n  openReg() {\n    this.setState({\n      regForm: { hn: '', name: '', age: '', sex: 'หญิง', thatu: 'ไฟ', contact: '', comorbid: '', clinic: 'คลินิกแพทย์แผนไทย รพ.ปากชม', consent: false, research: true },\n      regMsg: '', regOk: true\n    });\n  }\n\n  regField(k) {\n    return e => {\n      const t = e.target;\n      const v = t.type === 'checkbox' ? t.checked : t.value;\n      this.setState(s => ({ regForm: { ...s.regForm, [k]: v } }));\n    };\n  }\n\n  async saveReg() {\n    const r = this.state.regForm;\n    if (!r) return;\n    if (!r.hn) { this.setState({ regMsg: 'กรอก HN ก่อนบันทึก', regOk: false }); return; }\n    if (!r.name) { this.setState({ regMsg: 'กรอกชื่อ-นามสกุลก่อนบันทึก', regOk: false }); return; }\n    if (!r.consent) { this.setState({ regMsg: 'ต้องติ๊ก \"ยินยอมเพื่อการรักษา\" ก่อนส่งข้อมูลเข้า Google Sheet', regOk: false }); return; }\n    const dupN = (this.state.patientsList || []).filter(x => this.hnKeyOf(x['HN']) === this.hnKeyOf(r.hn)).length;\n    if (dupN > 0 && !(await this.askDuplicate('patient', r.hn, dupN))) return;\n    this.setState({ regBusy: true, regMsg: 'กำลังบันทึก…', regOk: true });\n    try {\n      const rCid = this.newConsentId();\n      const rSig = await this.uploadSignature('rsig', r.hn, rCid);\n      const res = await this.post({\n        action: 'patient', data: {\n          'HN': r.hn, 'วันที่ลงทะเบียน': new Date().toISOString().slice(0, 10), 'ชื่อ-นามสกุล': r.name,\n          'อายุ (ปี)': r.age, 'เพศ': r.sex, 'ธาตุเจ้าเรือน': r.thatu, 'เบอร์โทร/LINE': r.contact,\n          'โรคร่วม/ข้อห้าม': r.comorbid, 'คลินิก/หน่วยบริการ': r.clinic,\n          ...this.consentFields(r, rSig, rCid)\n        }\n      });\n      if (res.ok) {\n        this.setState({ regForm: null, regMsg: 'ลงทะเบียน HN ' + r.hn + ' เรียบร้อย', regOk: true });\n        this.okPop('ลงทะเบียนผู้ป่วยสำเร็จ', 'HN ' + r.hn + ' · ' + r.name + ' ถูกบันทึกเข้าชีต patients แล้ว');\n        this.loadPatients();\n      } else this.setState({ regMsg: 'ผิดพลาด: ' + res.error, regOk: false });\n    } catch (e) {\n      this.setState({ regMsg: 'บันทึกไม่ได้: ' + e.message, regOk: false });\n    } finally {\n      this.setState({ regBusy: false });\n    }\n  }\n\n  /** โหลด tnss_daily เพื่อวาดแนวโน้มจากข้อมูลจริง */\n  async loadDaily() {\n    try {\n      const csv = await this.csvRows('tnss_daily');\n      if (csv) { this.setState({ daily: csv }); return; }\n      const res = await fetch(this.state.url + '?key=' + encodeURIComponent(this.state.key) + '&action=tnss', { redirect: 'follow' });\n      const j = await res.json();\n      if (j.ok) this.setState({ daily: j.rows || [] });\n    } catch (e) {}\n  }\n\n  /** เฉลี่ย TNSS ต่อ \"วันที่ n หลังรับบริการ\" จากข้อมูลจริง */\n  dailyTrend(cases) {\n    const svc = {};\n    cases.forEach(c => { const k = this.hnKeyOf(c.hn); if (k && c.date) svc[k] = c.date; });\n    const buckets = {};\n    (this.state.daily || []).forEach(r => {\n      const k = this.hnKeyOf(r['HN']);\n      const d0 = svc[k], d1 = this.normDate(r['วันที่ประเมิน']);\n      if (!d0 || !d1) return;\n      const n = Math.round((new Date(d1) - new Date(d0)) / 86400000);\n      if (n < 0 || n > 14) return;\n      const v = Number(r['TNSS รวม']);\n      if (!isFinite(v)) return;\n      (buckets[n] = buckets[n] || []).push(v);\n    });\n    const days = Object.keys(buckets).map(Number).sort((a, b) => a - b);\n    return days.map(n => ({ n, v: buckets[n].reduce((a, b) => a + b, 0) / buckets[n].length, count: buckets[n].length }));\n  }\n\n  hnKeyOf(v) { return String(v || '').trim().replace(/[^0-9]/g, '').replace(/^0+/, ''); }\n\n  /** รับได้ทั้ง 2026-09-17, 17/09/2026, 17/09/2569 → คืน yyyy-mm-dd */\n  normDate(v) {\n    if (!v) return '';\n    const s = String(v).trim();\n    let m = s.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);\n    if (m) return m[1] + '-' + m[2] + '-' + m[3];\n    m = s.match(/^(\\d{1,2})[/-](\\d{1,2})[/-](\\d{4})/);\n    if (m) {\n      let y = Number(m[3]);\n      if (y > 2400) y -= 543;\n      return y + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');\n    }\n    const d = new Date(s);\n    return isNaN(d) ? '' : d.toISOString().slice(0, 10);\n  }\n\n  /* ───── ปฏิทินไทย (พ.ศ.) ───── */\n  openPicker(which) {\n    const cur = this.state[which];\n    const d = cur ? new Date(cur + 'T00:00:00') : new Date();\n    this.setState({ picker: this.state.picker === which ? null : which, viewY: d.getFullYear(), viewM: d.getMonth() });\n  }\n  shiftMonth(n) {\n    let m = this.state.viewM + n, y = this.state.viewY;\n    if (m < 0) { m = 11; y -= 1; }\n    if (m > 11) { m = 0; y += 1; }\n    this.setState({ viewM: m, viewY: y });\n  }\n  pickDay(iso) {\n    const which = this.state.picker;\n    if (!which) return;\n    const next = { [which]: iso, rangeDays: -1, picker: null };\n    // เลือกวันเริ่มแล้วเปิดปฏิทินวันสิ้นสุดต่อทันที ถ้ายังไม่ได้เลือก\n    if (which === 'from' && !this.state.to) { next.picker = 'to'; }\n    this.setState(next);\n  }\n  thaiDate(iso) {\n    if (!iso) return 'เลือกวันที่';\n    const M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];\n    const d = new Date(iso + 'T00:00:00');\n    if (isNaN(d)) return iso;\n    return d.getDate() + ' ' + M[d.getMonth()] + ' ' + (d.getFullYear() + 543);\n  }\n\n  setRange(days) {\n    if (!days) { this.setState({ from: '', to: '', rangeDays: 0, appliedFrom: '', appliedTo: '' }); return; }\n    const to = new Date();\n    const from = new Date(to.getTime() - (days - 1) * 86400000);\n    const f = from.toISOString().slice(0, 10), t = to.toISOString().slice(0, 10);\n    this.setState({ from: f, to: t, rangeDays: days, appliedFrom: f, appliedTo: t });\n  }\n\n  applyRange() {\n    this.setState({ appliedFrom: this.state.from, appliedTo: this.state.to, appliedQ: this.state.q.trim(), picker: null, casePage: 0 });\n  }\n\n  clearSearch() {\n    this.setState({ from: '', to: '', appliedFrom: '', appliedTo: '', q: '', appliedQ: '', rangeDays: 0, casePage: 0 });\n  }\n\n  filtered() {\n    const { cases, appliedFrom: from, appliedTo: to, appliedQ: q } = this.state;\n    let out = cases;\n    if (from || to) {\n      out = out.filter(c => {\n        const d = c.date || '';\n        if (!d) return false;\n        if (from && d < from) return false;\n        if (to && d > to) return false;\n        return true;\n      });\n    }\n    if (q) {\n      const needle = q.toLowerCase();\n      const hnq = this.hnKeyOf(q);\n      out = out.filter(c =>\n        (hnq && this.hnKeyOf(c.hn) === hnq) ||\n        String(c.hn || '').toLowerCase().includes(needle) ||\n        String(c.name || '').toLowerCase().includes(needle) ||\n        String(c.id || '').toLowerCase().includes(needle)\n      );\n    }\n    return out;\n  }\n\n  /** ฤดูตามเดือนที่รับบริการ */\n  autoUtu() {\n    const m = new Date().getMonth() + 1;\n    const hit = UTU.find(u => u.months.indexOf(m) >= 0);\n    return hit ? hit.v : '';\n  }\n\n  normHN(v) { return String(v || '').trim().replace(/^0+/, ''); }\n\n  /** คืนจำนวนรายการ HN ซ้ำในชีตที่ระบุ */\n  async countHN(which, hn) {\n    const target = this.normHN(hn);\n    if (!target) return 0;\n    if (which === 'sumary') {\n      return this.state.cases.filter(c => this.normHN(c.hn) === target).length;\n    }\n    try {\n      const csvP = await this.csvRows('patients');\n      if (csvP) {\n        const k = this.hnKeyOf(hn);\n        return csvP.filter(r => this.hnKeyOf(r['HN']) === k).length;\n      }\n      const res = await fetch(this.state.url + '?key=' + encodeURIComponent(this.state.key) + '&action=patients', { redirect: 'follow' });\n      const j = await res.json();\n      if (!j.ok) return 0;\n      const rows = j.rows || [];\n      this.setState({ patientsList: rows });\n      return rows.filter(r => this.normHN(r['HN']) === target).length;\n    } catch (e) { return 0; }\n  }\n\n  /** ถามยืนยันเมื่อพบ HN ซ้ำ — คืน true ถ้าให้บันทึกต่อ */\n  askDuplicate(kind, hn, n) {\n    return new Promise(resolve => {\n      this.setState({\n        dupAsk: {\n          hn, n, kind,\n          title: 'มีรายการ HN นี้ในระบบแล้ว',\n          body: kind === 'patient'\n            ? 'HN ' + hn + ' มีอยู่ในทะเบียนผู้ป่วยแล้ว ' + n + ' รายการ — บันทึกซ้ำจะทำให้มีทะเบียนซ้อนกัน'\n            : 'HN ' + hn + ' มีประวัติการสุมยาแล้ว ' + n + ' ครั้ง — บันทึกซ้ำจะทำให้มีทะเบียนซ้อนกัน',\n          ok: () => { this.setState({ dupAsk: null }); resolve(true); },\n          cancel: () => {\n            this.setState(kind === 'session'\n              ? { dupAsk: null, sessionMsg: 'ยกเลิกการบันทึก (HN ซ้ำ)', sessionOk: false }\n              : { dupAsk: null, intakeMsg: 'ยกเลิกการบันทึก (HN ซ้ำ)', intakeOk: false });\n            resolve(false);\n          }\n        }\n      });\n    });\n  }\n\n  /** เติมข้อมูลพื้นฐานจากทะเบียน patients ลงฟอร์มคัดกรอง */\n  fillFromRegistry(r) {\n    const thatuRaw = String(r['ธาตุเจ้าเรือน'] || '');\n    const thatu = ['ไฟ', 'ลม', 'น้ำ', 'ดิน'].find(t => thatuRaw.includes(t));\n    const f = this.state.form;\n    this.setState({\n      intakeQ: (maskName(r['ชื่อ-นามสกุล']) || r['HN'] || ''),\n      intakeQOpen: false,\n      intakeRow: r,\n      intakePicked: maskName(r['ชื่อ-นามสกุล'] || '') + ' (HN ' + (fmtHN(r['HN']) || '—') + ')',\n      form: {\n        ...f,\n        hn: String(r['HN'] || '').trim(),\n        name: r['ชื่อ-นามสกุล'] || '',\n        age: r['อายุ (ปี)'] || f.age,\n        sex: r['เพศ'] || f.sex,\n        thatu: thatu || f.thatu,\n        clinic: r['คลินิก/หน่วยบริการ'] || f.clinic,\n        consent: String(r['ยินยอมเพื่อการรักษา'] || r['ยินยอม PDPA'] || '').includes('ยินยอม'),\n        research: String(r['ยินยอมเพื่องานวิจัย R2R'] || '').includes('ยินยอม')\n      }\n    });\n  }\n\n  /* ───── e-Consent: แผ่นลายเซ็น ───── */\n  bindPad(key) {\n    return el => {\n      if (!el) return;\n      this._pads = this._pads || {};\n      if (this._pads[key] && this._pads[key].el === el) return;\n      const ctx = el.getContext('2d');\n      ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14201B';\n      const pad = { el, ctx, drawing: false, dirty: false };\n      this._pads[key] = pad;\n      const pt = e => {\n        const r = el.getBoundingClientRect();\n        const t = e.touches ? e.touches[0] : e;\n        return [(t.clientX - r.left) * (el.width / r.width), (t.clientY - r.top) * (el.height / r.height)];\n      };\n      const down = e => { e.preventDefault(); pad.drawing = true; pad.dirty = true; const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); };\n      const move = e => { if (!pad.drawing) return; e.preventDefault(); const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); };\n      const up = () => { pad.drawing = false; };\n      el.addEventListener('pointerdown', down);\n      el.addEventListener('pointermove', move);\n      window.addEventListener('pointerup', up);\n    };\n  }\n\n  clearPad(key) {\n    const p = this._pads && this._pads[key];\n    if (!p) return;\n    p.ctx.clearRect(0, 0, p.el.width, p.el.height);\n    p.dirty = false;\n  }\n\n  /** ตัดขอบว่างรอบลายเซ็น + ย่อขนาด → base64 PNG ที่เล็กลงมาก */\n  trimPad(el) {\n    const w = el.width, h = el.height;\n    const d = el.getContext('2d').getImageData(0, 0, w, h).data;\n    let x0 = w, y0 = h, x1 = 0, y1 = 0;\n    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {\n      if (d[(y * w + x) * 4 + 3] > 8) {\n        if (x < x0) x0 = x; if (x > x1) x1 = x;\n        if (y < y0) y0 = y; if (y > y1) y1 = y;\n      }\n    }\n    if (x1 <= x0 || y1 <= y0) return el.toDataURL('image/png').split(',')[1];\n    const pad = 8;\n    x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);\n    x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);\n    const cw = x1 - x0 + 1, ch = y1 - y0 + 1;\n    const scale = Math.min(1, 420 / cw);\n    const out = document.createElement('canvas');\n    out.width = Math.round(cw * scale); out.height = Math.round(ch * scale);\n    const o = out.getContext('2d');\n    o.fillStyle = '#FFFFFF'; o.fillRect(0, 0, out.width, out.height);\n    o.drawImage(el, x0, y0, cw, ch, 0, 0, out.width, out.height);\n    return out.toDataURL('image/png').split(',')[1];\n  }\n\n  /** ส่งลายเซ็นขึ้น Drive → คืน URL (ว่างถ้าไม่ได้เซ็น) */\n  async uploadSignature(key, hn, cid) {\n    const p = this._pads && this._pads[key];\n    if (!p || !p.dirty) return '';\n    try {\n      const b64 = this.trimPad(p.el);\n      const r = await this.post({ action: 'consent', hn: hn, consentId: cid, base64: b64 });\n      if (r && r.url) return r.url;\n      this.setState({ sigWarn: 'บันทึกลายเซ็นขึ้น Drive ไม่สำเร็จ: ' + ((r && r.error) || 'ไม่ทราบสาเหตุ') });\n      return '';\n    } catch (e) {\n      this.setState({ sigWarn: 'บันทึกลายเซ็นขึ้น Drive ไม่สำเร็จ: ' + e.message });\n      return '';\n    }\n  }\n\n  /** สร้างรหัสความยินยอม CONS-YYMMDD-HHMMSS-xxx */\n  newConsentId() {\n    const d = new Date(), p = n => String(n).padStart(2, '0');\n    return 'CONS-' + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate())\n      + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds())\n      + '-' + Math.random().toString(36).slice(2, 5).toUpperCase();\n  }\n\n  /** ฟิลด์ e-Consent สำหรับส่งลงชีต patients */\n  consentFields(rec, sigUrl, consentId) {\n    return {\n      'consentID': consentId || this.newConsentId(),\n      'ยินยอม PDPA': rec.consent ? 'ยินยอม' : 'ไม่ยินยอม',\n      'ยินยอมเพื่อการรักษา': rec.consent ? 'ยินยอม' : 'ไม่ยินยอม',\n      'ยินยอมเพื่องานวิจัย R2R': rec.research ? 'ยินยอม' : 'ไม่ยินยอม',\n      'วันเวลาที่ให้ความยินยอม': this.stampNow(),\n      'เวอร์ชันข้อความยินยอม': CONSENT_VERSION,\n      'ผู้รับความยินยอม': this.state.form.provider || '',\n      'ลิงก์ลายเซ็น/ภาพยินยอม': sigUrl || ''\n    };\n  }\n\n  stampNow() {\n    const d = new Date(), p = n => String(n).padStart(2, '0');\n    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());\n  }\n\n  /** ล้างข้อมูลหัตถการทั้ง 5 ขั้น แล้วกลับไปหน้าแดชบอร์ด */\n  resetSession() {\n    const herb = {};\n    HERBS.forEach(h => herb[h.key] = h.def);\n    const f = this.state.form;\n    this.stopCam && this.stopCam();\n    this.stopTimer && this.stopTimer();\n    this.setState({\n      screen: 'dash', step: 1, sel: null,\n      form: {\n        ...f, hn: '', name: '', age: 38, sex: 'หญิง', thatu: 'ไฟ',\n        utu: '', kala: KALA[0].v, tri: '', consent: false, research: true,\n        ae: 'ไม่มี', satis: 5, sus: 85, note: ''\n      },\n      herb,\n      tnss: { sneeze: 2, rhino: 2, block: 3, itch: 1 },\n      pre: null, post: null, rec: '', recSec: 0, recErr: '', wave: [],\n      camOn: false, dist: null, minDist: null, alerts: 0, manualMode: false, camErr: '', detMsg: '',\n      running: false, elapsed: 0, advice: '', aiBusy: false,\n      rcq: {}, rcqHealth: '', rcqDaysOff: '', rcqOpen: '',\n      intakeMsg: '', sessionMsg: '', linked: false, linkedRec: '',\n      intakeQ: '', intakeQOpen: false, intakePicked: '', intakeRow: null,\n      recordId: 'SUMA-' + new Date().toISOString().slice(2, 19).replace(/[-:T]/g, '').slice(0, 6) + '-' + new Date().toISOString().slice(11, 19).replace(/:/g, '')\n    }, () => this.loadSheet(true));\n  }\n\n  async submitSession() {\n    const f = this.state.form;\n    const say = (m, ok) => this.setState({ sessionMsg: m, sessionOk: ok !== false });\n    if (!f.consent) { say('ต้องติ๊ก \"ยินยอมเพื่อการรักษา\" ในขั้นที่ 1 ก่อน', false); return; }\n    if (!f.hn) { say('กรอก HN ก่อนส่ง', false); return; }\n    const total = this.herbTotal();\n    if (Math.abs(total - 100) > 0.5) { say('สัดส่วนสมุนไพรรวม ' + total + '% (ต้อง 100%)', false); return; }\n    const dupN = await this.countHN('sumary', f.hn);\n    if (dupN > 0 && !(await this.askDuplicate('session', f.hn, dupN))) return;\n    const pre = this.state.pre, post = this.state.post, t = this.state.tnss;\n    const rule = this._next ? { next: this._next } : this.ruleAdvice();\n    const tPre = this.tnssTotal();\n    const data = {\n      'ยินยอม PDPA': 'ยินยอม', 'HN': f.hn, 'ชื่อ-นามสกุล': f.name, 'อายุ (ปี)': f.age, 'เพศ': f.sex,\n      'ธาตุเจ้าเรือน': f.thatu,\n      'อุตุสมุฏฐาน (ฤดู)': f.utu || this.autoUtu(),\n      'กาลสมุฏฐาน (ช่วงเวลา)': f.kala || '',\n      'ตรีธาตุที่กระทำ': this.triNow(),\n      'วันที่รับบริการ': new Date().toISOString().slice(0, 10),\n      'คลินิก/หน่วยบริการ': f.clinic, 'ผู้ทำหัตถการ (พท.)': f.provider, 'รหัส ICD-10': f.icd, 'รหัสหัตถการ': f.proc,\n      'ขิง (%)': this.state.herb.ginger, 'ดอกปีบ (%)': this.state.herb.peep, 'มะแขว่น (%)': this.state.herb.makhwaen,\n      'ผิวมะกรูด (%)': this.state.herb.makrut, 'ข่า (%)': this.state.herb.kha,\n      'น้ำหนักยารวม (กรัม)': f.weight, 'อุณหภูมิไอน้ำ (°C)': f.temp,\n      'ระยะเวลาสุมยา (นาที)': Math.round(this.state.elapsed / 60 * 10) / 10,\n      'Patency ก่อน (%)': pre ? pre.index : '', 'Patency หลัง (%)': post ? post.index : '',\n      'ผลต่าง Patency (%)': pre && post ? post.index - pre.index : '',\n      'ลิงก์เสียงก่อน': (pre && pre.url) || '', 'ลิงก์เสียงหลัง': (post && post.url) || '',\n      'ระยะใกล้สุด (ซม.)': this.state.minDist === null ? '' : Math.round(this.state.minDist),\n      'จำนวนแจ้งเตือนระยะ': this.state.alerts,\n      'ทำครบเวลา (%)': Math.round(this.state.elapsed / this.targetSec() * 100),\n      'เหตุการณ์ไม่พึงประสงค์': f.ae,\n      'TNSS ก่อน (จาม/น้ำมูก/คัด/คัน)': [t.sneeze, t.rhino, t.block, t.itch].join('/'),\n      'TNSS รวมก่อน': tPre, 'TNSS หลัง (จาม/น้ำมูก/คัด/คัน)': '', 'TNSS รวมหลัง': '', 'TNSS ลดลง (%)': '',\n      'แปลผล TNSS ก่อน': tnssBand(tPre).label, 'แปลผล TNSS หลัง': '',\n      'รหัสบันทึก': this.state.recordId,\n      'RCQ-36 รวม (ก่อน)': this.rcqStats().total || '',\n      'RCQ-36 แปลผล (ก่อน)': this.rcqStats().answered ? rcqBand(this.rcqStats().avg).label : '',\n      'กลุ่มอาการเด่น': this.predominant().label,\n      'คำแนะนำปรับสูตรจาก AI': this.state.advice || this.ruleAdvice().text,\n      'สูตรแนะนำครั้งถัดไป': this.formulaText(rule.next),\n      'คะแนน SUS (พท.)': f.sus, 'ความพึงพอใจผู้ป่วย (1-5)': f.satis,\n      'ต้นทุนรวม/ครั้ง (บาท)': f.cost, 'อุปกรณ์': navigator.userAgent.slice(0, 80),\n      'เวอร์ชันแอป': APP_VERSION, 'หมายเหตุ': f.note\n    };\n    say('กำลังส่ง…');\n    try {\n      const r = await this.post({ action: 'session', data });\n      say(r.ok ? ('บันทึกลงชีต sumary แถวที่ ' + r.row + ' · ' + r.id) : ('ผิดพลาด: ' + r.error), !!r.ok);\n      if (r.ok) {\n        this.setState({ linked: true });\n        this.okPop('ส่งข้อมูลการสุมยาสำเร็จ', 'บันทึกลงชีต sumary แถวที่ ' + r.row + ' · รหัส ' + r.id + '\\nระบบล้างฟอร์มและกลับไปหน้าแดชบอร์ดให้แล้ว');\n        this.resetSession();\n      }\n    } catch (e) {\n      say('ส่งไม่สำเร็จ: ' + e.message, false);\n    }\n  }\n\n  async savePatient(chained) {\n    const f = this.state.form;\n    if (!f.consent) { this.setState({ submitMsg: 'ต้องได้รับความยินยอม PDPA ก่อน', submitOk: false }); return false; }\n    if (!f.hn) { this.setState({ submitMsg: 'กรอก HN ก่อนบันทึก', submitOk: false }); return false; }\n    this.setState({ submitMsg: 'กำลังตรวจสอบ HN…', submitOk: true });\n    const dupN = await this.countHN('patients', f.hn);\n    if (dupN > 0 && !(await this.askDuplicate('patient', f.hn, dupN))) return false;\n    this.setState({ submitMsg: 'กำลังบันทึกทะเบียน…', submitOk: true });\n    try {\n      const cid = this.newConsentId();\n      const sigUrl = await this.uploadSignature('sig', f.hn, cid);\n      const r = await this.post({\n        action: 'patient', data: {\n          'HN': f.hn, 'วันที่ลงทะเบียน': new Date().toISOString().slice(0, 10), 'ชื่อ-นามสกุล': f.name,\n          'อายุ (ปี)': f.age, 'เพศ': f.sex, 'ธาตุเจ้าเรือน': f.thatu,\n          'คลินิก/หน่วยบริการ': f.clinic,\n          ...this.consentFields(f, sigUrl, cid)\n        }\n      });\n      this.setState({\n        submitMsg: r.ok ? (chained ? 'บันทึกทะเบียนแล้ว · กำลังส่งแบบสอบถาม…' : 'บันทึกทะเบียนผู้ป่วยแล้ว') : ('ผิดพลาด: ' + r.error),\n        submitOk: !!r.ok\n      });\n      if (r.ok && !chained) this.okPop('บันทึกทะเบียนผู้ป่วยสำเร็จ', 'HN ' + f.hn + ' · ' + (f.name || '') + ' ถูกบันทึกเข้าชีต patients แล้ว');\n      return !!r.ok;\n    } catch (e) {\n      this.setState({ submitMsg: 'บันทึกไม่ได้: ' + e.message, submitOk: false });\n      return false;\n    }\n  }\n\n  /** กดครั้งเดียว — บันทึกทะเบียน (patients) แล้วต่อด้วยแบบสอบถาม (rcq36) */\n  async saveIntake() {\n    const f = this.state.form;\n    const say = (m, ok) => this.setState({ intakeMsg: m, intakeOk: ok !== false });\n    if (!f.hn) { say('กรอก HN ก่อนบันทึก', false); return; }\n    if (!f.consent) { say('ผู้ป่วยรายนี้ยังไม่มี e-Consent ในทะเบียน — ลงทะเบียนและลงนามยินยอมที่
